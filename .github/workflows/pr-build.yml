name: PR build artifacts

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-artifacts:
    name: Windows artifacts
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install NSIS
        run: choco install nsis -y

      - name: Install frontend dependencies
        working-directory: apps/codex-plus-manager
        run: npm install --package-lock=false

      - name: Install Taskboard dependencies
        working-directory: apps/codex-taskboard
        run: npm ci

      - name: Frontend tests
        working-directory: apps/codex-plus-manager
        run: npm test

      - name: TypeScript check
        working-directory: apps/codex-plus-manager
        run: npm run check

      - name: Build frontend
        working-directory: apps/codex-plus-manager
        run: npm run vite:build

      - name: Taskboard TypeScript check
        working-directory: apps/codex-taskboard
        run: npm run typecheck

      - name: Build Taskboard frontend
        working-directory: apps/codex-taskboard
        run: npm run build:web

      - name: Taskboard tests
        working-directory: apps/codex-taskboard
        run: npm test

      - name: Rust tests
        run: cargo test --workspace

      - name: Build release binaries
        run: cargo build --release

      - name: Stage Windows app files
        shell: pwsh
        run: .\scripts\installer\windows\package-windows.ps1 -SkipInstall -SkipBuild -SkipInstaller

      - name: Build Windows installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v", "V")
          $version = $version -replace '[\\/]', '-'
          if (-not $version -or $version -eq "main") {
            $version = "0.0.0-${{ github.run_number }}"
          }
          $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) {
            $makensis = "makensis"
          }
          Push-Location scripts/installer/windows
          & $makensis "/INPUTCHARSET" "UTF8" "/DVERSION=$version" CodexPlusPlus.nsi
          Pop-Location

      - name: Smoke test installed Windows runtime
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v", "V")
          $version = $version -replace '[\\/]', '-'
          if (-not $version -or $version -eq "main") {
            $version = "0.0.0-${{ github.run_number }}"
          }
          $installer = Join-Path $PWD "dist/windows/CodexPlusPlus-$version-windows-x64-setup.exe"
          $installRoot = Join-Path $env:RUNNER_TEMP "codex-plus-plus-pr-smoke"
          if (Test-Path $installRoot) { Remove-Item -LiteralPath $installRoot -Recurse -Force }
          $installerProcess = Start-Process -FilePath $installer -ArgumentList @("/S", "/D=$installRoot") -Wait -PassThru
          if ($installerProcess.ExitCode -ne 0) { throw "Silent Windows install failed with exit code $($installerProcess.ExitCode)" }
          try {
            $runtimeRoot = Join-Path $installRoot "codex-taskboard"
            $runtimeFiles = @(
              (Join-Path $runtimeRoot "dist/web/index.html"),
              (Join-Path $runtimeRoot "scripts/codex-injector.mjs"),
              (Join-Path $runtimeRoot "server/index.mjs")
            )
            $deadline = (Get-Date).AddSeconds(15)
            while ((@($runtimeFiles | Where-Object { -not (Test-Path $_) }).Count -gt 0) -and (Get-Date) -lt $deadline) {
              Start-Sleep -Milliseconds 250
            }
            $missingRuntimeFiles = @($runtimeFiles | Where-Object { -not (Test-Path $_) })
            if ($missingRuntimeFiles.Count -gt 0) {
              throw "Silent install did not finish staging Taskboard runtime: $($missingRuntimeFiles -join ', ')"
            }
            node scripts/installer/taskboard-health-smoke.mjs $runtimeRoot
          } finally {
            $uninstaller = Join-Path $installRoot "uninstall.exe"
            if (Test-Path $uninstaller) { & $uninstaller /S }
          }

      - name: Upload Windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: codex-plus-plus-windows-binaries
          path: dist/windows/app/*
          if-no-files-found: error

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: codex-plus-plus-windows-installer
          path: dist/windows/*.exe
          if-no-files-found: error

  macos-dmg:
    name: macOS DMG (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - arch: arm64
            runner: macos-14
            target: aarch64-apple-darwin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install frontend dependencies
        working-directory: apps/codex-plus-manager
        run: npm install --package-lock=false

      - name: Install Taskboard dependencies
        working-directory: apps/codex-taskboard
        run: npm ci

      - name: Build frontend
        working-directory: apps/codex-plus-manager
        run: npm run vite:build

      - name: Build Taskboard frontend
        working-directory: apps/codex-taskboard
        run: npm run build:web

      - name: Build release binaries
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build macOS DMG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          VERSION="${VERSION#V}"
          VERSION="${VERSION//\//-}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then
            VERSION="0.0.0-${GITHUB_RUN_NUMBER}"
          fi
          BINARY_DIR="$PWD/target/${{ matrix.target }}/release" bash scripts/installer/macos/package-dmg.sh "$VERSION" "${{ matrix.arch }}"

      - name: Verify macOS bundle structure
        run: |
          set -euo pipefail
          test -L "dist/macos/stage/Applications"
          test "$(readlink "dist/macos/stage/Applications")" = "/Applications"
          for app in "dist/macos/stage/Codex++.app" "dist/macos/stage/Codex++ 管理工具.app"; do
            test -f "$app/Contents/Info.plist"
            test -f "$app/Contents/PkgInfo"
            test -x "$app/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")"
            test -f "$app/Contents/Resources/codex-taskboard/dist/web/index.html"
            test -f "$app/Contents/Resources/codex-taskboard/server/index.mjs"
            plutil -lint "$app/Contents/Info.plist" >/dev/null
            codesign -dv "$app" >/dev/null 2>&1
            echo "verified: $app"
          done

      - name: Smoke test packaged macOS runtime
        run: node scripts/installer/taskboard-health-smoke.mjs "dist/macos/stage/Codex++.app/Contents/Resources/codex-taskboard"

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: codex-plus-plus-macos-${{ matrix.arch }}-dmg
          path: dist/macos/*.dmg
          if-no-files-found: error

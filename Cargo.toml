[workspace]
resolver = "2"
members = [
  "crates/codex-plus-core",
  "crates/codex-plus-data",
  "apps/codex-plus-launcher",
  "apps/codex-plus-manager/src-tauri",
]

[workspace.package]
version = "2.1.4"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/BigPizzaV3/CodexPlusPlus"

[workspace.dependencies]
aes-gcm = "0.10"
anyhow = "1"
base64 = "0.22"
directories = "6"
fs2 = "0.4"
futures-util = "0.3"
http = "1"
httpdate = "1"
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls", "rustls-tls-native-roots", "system-proxy"], default-features = false }
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sherpa-onnx = "1.13.8"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "time"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
toml = "0.8"
toml_edit = "0.22"
url = "2"
uuid = { version = "1", features = ["v4"] }
winresource = "0.1"
zip = { version = "2", default-features = false, features = ["deflate"] }
zstd = "0.13"

# 开发/测试构建只保留行号表：panic 回溯仍带文件行号，调试信息体积和链接时间大幅下降。
# 依赖不带调试信息。test profile 继承 dev；release 不受影响。
# 需要单步调试变量时，本地临时改回 `debug = true` 即可。
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" fill="none">
  <title>Codex++ — 让 Codex 更顺手</title>
  <desc>深色背景与蓝紫色点缀，展示供应商、工作流和个性化三个方向。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10141F"/><stop offset="1" stop-color="#191A36"/>
    </linearGradient>
    <linearGradient id="accent" x1="760" y1="70" x2="1050" y2="270" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7BA7FF"/><stop offset="1" stop-color="#9C86FF"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#A3AFF3" fill-opacity=".12"/>
    </pattern>
  </defs>
  <rect width="1200" height="320" rx="20" fill="url(#bg)"/>
  <rect x="680" width="520" height="320" rx="20" fill="url(#dots)"/>
  <path d="M700 320L1020 0M810 320L1130 0" stroke="#8A93D0" stroke-opacity=".09"/>
  <rect x="56" y="48" width="4" height="20" rx="2" fill="#829BFF"/>
  <text x="73" y="63" fill="#ADB6D3" font-family="system-ui, -apple-system, sans-serif" font-size="13" letter-spacing="3">YOUR CODEX, UPGRADED.</text>
  <text x="54" y="146" fill="#F4F6FF" font-family="system-ui, -apple-system, sans-serif" font-size="66" font-weight="750" letter-spacing="-3">Codex<tspan fill="#9CAFFF">++</tspan></text>
  <text x="56" y="206" fill="#E8EBF7" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="34" font-weight="600">让 Codex 更顺手。</text>
  <text x="56" y="260" fill="#9DA7C3" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16">供应商与模型 · 工作流增强 · 拓展与个性化</text>

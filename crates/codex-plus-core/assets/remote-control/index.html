<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#111316">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Codex++">
<link rel="manifest" href="/manifest.webmanifest">
<title>Codex++ 远程控制</title>
<style>
  :root {
    --bg: light-dark(#f6f7f9, #111316);
    --panel: light-dark(#ffffff, #1a1d21);
    --line: light-dark(#e3e6ea, #2a2e34);
    --text: light-dark(#1d2025, #e6e8eb);
    --muted: light-dark(#6b7280, #8b929b);
    --accent: #3b6ef5;
    --danger: #d93f3f;
    --ok: #1f9d55;
    --code: light-dark(#f1f3f5, #14171a);
    color-scheme: light dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; background: var(--bg); color: var(--text); }
  button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: inherit; border-radius: 7px; padding: 5px 11px; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { color: var(--danger); }
  input, textarea { font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 6px 9px; }
  textarea { resize: none; }
  [hidden] { display: none !important; }
  .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 7px 14px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 90vw; z-index: 50; }
  .toast.show { opacity: .92; }
  /* ================= Codex 样式：照 Codex 桌面版（图标栏 + 侧栏「新聊天 / 项目 / 最近」+ 居中对话 + 输入卡片）================= */
  :root {
    --cx-bg: light-dark(#ffffff, #181818);
    --cx-side: light-dark(#f7f7f8, #1f1f1f);
    --cx-hover: light-dark(rgb(0 0 0 / .05), rgb(255 255 255 / .06));
    --cx-active: light-dark(rgb(0 0 0 / .08), rgb(255 255 255 / .1));
    --cx-line: light-dark(#e6e6e8, #2e2e2e);
    --cx-text: light-dark(#1f1f1f, #ececec);
    --cx-sub: light-dark(#6e6e73, #9b9b9b);
    --cx-faint: light-dark(#a1a1a6, #6b6b6b);
    --cx-bubble: light-dark(#f1f1f3, #2a2a2a);
    --cx-card: light-dark(#ffffff, #212121);
    --cx-composer: light-dark(#ffffff, #262626);
    --cx-code: light-dark(#f6f6f8, #1d1d1d);
    --cx-orange: light-dark(#c4620a, #f0883e);
    --cx-green: light-dark(#1a7f37, #3fb950);
    --cx-red: light-dark(#cf222e, #f85149);
    --cx-blue: light-dark(#0969da, #58a6ff);
  }
  .app { display: grid; grid-template-columns: 52px 280px minmax(0, 1fr); height: 100%; background: var(--cx-bg); color: var(--cx-text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Segoe UI", sans-serif; }
  .app button { font: inherit; color: inherit; background: none; border: none; padding: 0; border-radius: 8px; cursor: pointer; }
  .app button:hover:not(:disabled) { border-color: transparent; }
  .app svg { display: block; }
  .cx-rail { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 12px 0; background: var(--cx-side); }
  .cx-rail button { width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; color: var(--cx-sub); }
  .cx-rail button:hover:not(:disabled) { background: var(--cx-hover); color: var(--cx-text); }
  .cx-rail button.on { background: var(--cx-active); color: var(--cx-text); }
  .cx-rail svg { width: 18px; height: 18px; }
  .cx-rail .grow { flex: 1; }
  .cx-side { display: flex; flex-direction: column; min-height: 0; background: var(--cx-side); border-right: 1px solid var(--cx-line); }
  .cx-side-head { flex: 0 0 auto; display: flex; align-items: center; gap: 2px; padding: 12px 10px 6px 14px; }
  .app .cx-host { min-width: 0; display: flex; align-items: center; gap: 4px; padding: 3px 6px; margin-left: -6px; font-size: 17px; font-weight: 600; }
  .app .cx-host:hover { background: var(--cx-hover); }
  .cx-host span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cx-host svg { flex: 0 0 auto; width: 14px; height: 14px; color: var(--cx-sub); }
  .grow { flex: 1; }
  .app .cx-icon { flex: 0 0 auto; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; color: var(--cx-sub); }
  .app .cx-icon:hover:not(:disabled) { background: var(--cx-hover); color: var(--cx-text); }
  .app .cx-icon:disabled { opacity: .4; cursor: default; }
  .cx-icon svg { width: 16px; height: 16px; }
  .cx-side-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 8px 12px; }
  .app .cx-nav { width: 100%; display: flex; align-items: center; gap: 10px; padding: 6px 10px; text-align: left; }
  .app .cx-nav:hover { background: var(--cx-hover); }
  .cx-nav svg { width: 16px; height: 16px; color: var(--cx-sub); }
  .cx-section { display: flex; align-items: center; padding: 16px 10px 4px; font-size: 13px; color: var(--cx-sub); }
  .cx-row { display: flex; align-items: center; gap: 8px; min-height: 32px; padding: 5px 8px 5px 10px; border-radius: 8px; cursor: pointer; }
  .cx-row:hover { background: var(--cx-hover); }
  .cx-row.active { background: var(--cx-active); }
  .cx-row.child { padding-left: 34px; }
  .cx-row > svg { flex: 0 0 auto; width: 16px; height: 16px; color: var(--cx-sub); }
  .cx-row .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cx-row .count { flex: 0 0 auto; color: var(--cx-faint); font-size: 12px; }
  .cx-row .aux { flex: 0 0 auto; color: var(--cx-faint); font-size: 12px; }
  .cx-row .add { width: 22px; height: 22px; visibility: hidden; }
  .cx-row:hover .add { visibility: visible; }
  .cx-row .unread { flex: 0 0 7px; width: 7px; height: 7px; border-radius: 50%; background: var(--cx-blue); }
  .spin { flex: 0 0 auto; width: 12px; height: 12px; border-radius: 50%; border: 2px solid color-mix(in srgb, var(--cx-faint) 50%, transparent); border-top-color: var(--cx-blue); animation: cx-spin .8s linear infinite; }
  @keyframes cx-spin { to { transform: rotate(360deg); } }
  .cx-empty { padding: 6px 10px; color: var(--cx-faint); font-size: 13px; }
  .whoami { flex: 0 0 auto; display: flex; align-items: center; gap: 6px; padding: 8px 12px 10px 16px; border-top: 1px solid var(--cx-line); color: var(--cx-sub); font-size: 12px; }
  .whoami span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .app .whoami button { padding: 2px 8px; border-radius: 6px; font-size: 12px; color: var(--cx-sub); }
  .app .whoami button:hover { background: var(--cx-hover); color: var(--cx-text); }
  /* 主区 */
  .app main { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--cx-bg); }
  .cx-top { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 14px 0 20px; }
  .cx-top .title { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
  .app .cx-back { display: none; width: 32px; height: 32px; margin-left: -10px; align-items: center; justify-content: center; color: var(--cx-sub); }
  .cx-back svg { width: 20px; height: 20px; }
  .cx-badge { flex: 0 0 auto; font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--cx-hover); color: var(--cx-sub); white-space: nowrap; }
  .cx-badge:empty { display: none; }
  .cx-badge.running { color: var(--cx-blue); }
  .cx-badge.live { color: var(--cx-green); }
  .app .cx-btn { flex: 0 0 auto; height: 28px; padding: 0 11px; border: 1px solid var(--cx-line); border-radius: 8px; font-size: 13px; white-space: nowrap; }
  .app .cx-btn:hover:not(:disabled) { background: var(--cx-hover); border-color: var(--cx-line); }
  .app .cx-btn:disabled { opacity: .45; cursor: default; }
  .app .cx-btn.primary { background: var(--cx-text); color: var(--cx-bg); border-color: transparent; }
  .app .cx-btn.primary:hover:not(:disabled) { background: var(--cx-text); opacity: .88; }
  .app .cx-btn.danger { color: var(--cx-red); }
  .app .cx-btn.on { border-color: var(--cx-blue); color: var(--cx-blue); }
  .log { flex: 1; min-height: 0; overflow-y: auto; padding: 8px 28px 28px; }
  .log > * { max-width: 760px; margin-left: auto; margin-right: auto; }
  .cx-turn { display: flex; flex-direction: column; gap: 14px; padding: 14px 0; }
  .cx-user { align-self: flex-end; max-width: 80%; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .cx-user .text { padding: 8px 14px; border-radius: 18px; background: var(--cx-bubble); white-space: pre-wrap; word-break: break-word; }
  .cx-user.steer .text::before { content: "插话 · "; color: var(--cx-sub); }
  .cx-user .files { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; }
  .app .m-photo { max-width: 240px; border-radius: 12px; }
  .app .m-file { width: auto; max-width: 280px; border-radius: 12px; border: 1px solid var(--cx-line); background: var(--cx-card); padding: 8px 12px; }
  .app .m-file svg { width: 22px; height: 22px; color: var(--cx-sub); }
  .app .m-file span { font-size: 13px; }
  .cx-agent { line-height: 1.7; word-break: break-word; }
  .cx-agent > :first-child { margin-top: 0; }
  .cx-agent > :last-child { margin-bottom: 0; }
  .cx-agent p { margin: 0 0 10px; white-space: pre-wrap; }
  .cx-agent h3, .cx-agent h4, .cx-agent h5 { margin: 16px 0 6px; line-height: 1.4; }
  .cx-agent h3 { font-size: 17px; } .cx-agent h4 { font-size: 15px; } .cx-agent h5 { font-size: 14px; }
  .cx-agent ul, .cx-agent ol { margin: 0 0 10px; padding-left: 22px; }
  .cx-agent li + li { margin-top: 2px; }
  .cx-agent blockquote { margin: 0 0 10px; padding-left: 12px; border-left: 3px solid var(--cx-line); color: var(--cx-sub); }
  .cx-agent hr { border: none; border-top: 1px solid var(--cx-line); margin: 14px 0; }
  .cx-agent code, .cx-cmd summary code { font: 12.5px/1.5 ui-monospace, "SF Mono", Menlo, monospace; padding: 1px 5px; border-radius: 5px; background: var(--cx-code); border: 1px solid var(--cx-line); }
  .cx-agent pre { margin: 0 0 10px; padding: 10px 12px; overflow-x: auto; border-radius: 10px; background: var(--cx-code); border: 1px solid var(--cx-line); font: 12.5px/1.55 ui-monospace, "SF Mono", Menlo, monospace; }
  .cx-agent pre code { padding: 0; border: none; background: none; }
  .cx-agent a { color: var(--cx-blue); }
  .cx-cmd { color: var(--cx-sub); font-size: 13px; }
  .cx-cmd summary { list-style: none; display: flex; align-items: center; gap: 6px; min-width: 0; cursor: pointer; }
  .cx-cmd summary::-webkit-details-marker { display: none; }
  .cx-cmd summary code { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--cx-text); }
  .cx-cmd summary > span:first-child { flex: 0 0 auto; white-space: nowrap; }
  .cx-cmd summary:hover > span { color: var(--cx-text); }
  .cx-cmd .bad { color: var(--cx-red); }
  .cx-cmd pre { margin: 6px 0 0; max-height: 280px; overflow: auto; padding: 8px 10px; border-radius: 8px; background: var(--cx-code); border: 1px solid var(--cx-line);
    color: var(--cx-text); font: 12px/1.5 ui-monospace, "SF Mono", Menlo, monospace; white-space: pre-wrap; word-break: break-all; }
  .cx-files { border: 1px solid var(--cx-line); border-radius: 12px; overflow: hidden; background: var(--cx-card); }
  .cx-files .head { display: flex; align-items: center; gap: 12px; padding: 10px 14px; }
  .cx-files .icon { flex: 0 0 auto; width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--cx-line); display: flex; align-items: center; justify-content: center; color: var(--cx-sub); }
  .cx-files .icon svg { width: 16px; height: 16px; }
  .cx-files .head b { font-weight: 500; }
  .cx-files .head small { display: block; font-size: 12px; }
  .cx-files .file { display: flex; align-items: baseline; gap: 0; padding: 8px 14px; border-top: 1px solid var(--cx-line); font-size: 13px; }
  .cx-files .file .dir { color: var(--cx-sub); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; direction: rtl; text-align: left; }
  .cx-files .file .base { flex: 0 0 auto; white-space: nowrap; }
  .cx-files .file .stat { margin-left: auto; padding-left: 12px; white-space: nowrap; font-size: 12px; }
  .cx-files .more { color: var(--cx-sub); }
  .plus-n { color: var(--cx-green); } .minus-n { color: var(--cx-red); }
  .cx-note { color: var(--cx-faint); font-size: 12px; text-align: center; }
  .cx-error { display: grid; gap: 4px; padding: 10px 14px; border-radius: 12px; font-size: 13px; word-break: break-word;
    border: 1px solid color-mix(in srgb, var(--cx-red) 45%, var(--cx-line)); background: color-mix(in srgb, var(--cx-red) 8%, transparent); }
  .cx-error strong { color: var(--cx-red); font-weight: 600; }
  .cx-error summary { cursor: pointer; color: var(--cx-sub); font-size: 12px; }
  .cx-error pre { margin: 6px 0 0; max-height: 220px; overflow: auto; white-space: pre-wrap; font: 12px/1.5 ui-monospace, "SF Mono", Menlo, monospace; }
  .cx-step { color: var(--cx-sub); font-size: 13px; }
  .cx-thinking { align-self: flex-start; font-size: 14px; color: transparent; padding: 14px 0;
    background: linear-gradient(90deg, var(--cx-faint) 30%, var(--cx-text) 50%, var(--cx-faint) 70%) 0 0 / 300% 100%; -webkit-background-clip: text; background-clip: text; animation: cx-shine 1.6s linear infinite; }
  @keyframes cx-shine { from { background-position: 100% 0; } to { background-position: 0 0; } }
  .log.blank { display: flex; align-items: center; justify-content: center; }
  .cx-hello { text-align: center; color: var(--cx-sub); display: grid; justify-items: center; gap: 10px; }
  .cx-hello svg { width: 40px; height: 40px; color: var(--cx-faint); }
  .cx-hello h2 { margin: 0; font-size: 22px; font-weight: 600; color: var(--cx-text); }
  .cx-hello p { margin: 0; font-size: 13px; max-width: 420px; }
  /* 审批 / 提问 */
  .requests { flex: 0 0 auto; padding: 0 28px; max-height: 45vh; overflow-y: auto; }
  .requests > * { max-width: 760px; margin: 0 auto 10px; }
  .cx-request { display: grid; gap: 8px; padding: 12px 14px; border-radius: 14px; border: 1px solid color-mix(in srgb, var(--cx-orange) 55%, var(--cx-line)); background: var(--cx-card); }
  .cx-request strong { font-weight: 600; }
  .cx-request code { display: block; white-space: pre-wrap; word-break: break-all; padding: 8px 10px; border-radius: 8px; background: var(--cx-code); font: 12px/1.5 ui-monospace, "SF Mono", Menlo, monospace; }
  .cx-request .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .cx-request input { flex: 1 1 160px; height: 28px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--cx-line); background: transparent; color: inherit; font: inherit; font-size: 13px; }
  .cx-request .readonly { color: var(--cx-sub); font-size: 12px; }
  /* 输入卡片 */
  .app footer { flex: 0 0 auto; padding: 4px 28px 16px; }
  .cx-composer { max-width: 760px; margin: 0 auto; padding: 12px 10px 8px 16px; border-radius: 20px; border: 1px solid var(--cx-line); background: var(--cx-composer);
    box-shadow: 0 1px 3px rgb(0 0 0 / .05); transition: border-color .15s; }
  .cx-composer:focus-within { border-color: color-mix(in srgb, var(--cx-text) 30%, var(--cx-line)); }
  .cx-composer.drag { border-color: var(--cx-blue); }
  .cx-composer textarea { display: block; width: 100%; min-height: 22px; max-height: 220px; padding: 0 6px 0 0; border: none; outline: none; resize: none; background: transparent;
    color: inherit; font: inherit; line-height: 22px; }
  .cx-composer textarea::placeholder { color: var(--cx-faint); }
  .cx-attach { padding: 0 0 10px; flex-wrap: wrap; }
  .cx-attach .item { background: var(--cx-bubble); }
  .cx-bar { display: flex; align-items: center; gap: 2px; margin: 10px 0 0 -6px; min-width: 0; }
  .app .cx-pill { flex: 0 1 auto; min-width: 0; height: 28px; padding: 0 8px; display: flex; align-items: center; gap: 5px; border-radius: 8px; color: var(--cx-sub); font-size: 13px; white-space: nowrap; }
  .app .cx-pill:hover:not(:disabled) { background: var(--cx-hover); color: var(--cx-text); }
  .app .cx-pill:disabled { opacity: .5; cursor: default; }
  .cx-pill span { overflow: hidden; text-overflow: ellipsis; }
  .cx-pill svg { flex: 0 0 auto; width: 15px; height: 15px; }
  .cx-pill .chev { width: 12px; height: 12px; }
  .app .cx-pill.warn { color: var(--cx-orange); }
  .app .cx-pill.on { color: var(--cx-blue); }
  .cx-ring { flex: 0 0 auto; display: flex; align-items: center; gap: 5px; padding: 0 6px; color: var(--cx-faint); font-size: 12px; }
  .cx-ring svg { width: 16px; height: 16px; }
  .app .cx-send { flex: 0 0 auto; width: 30px; height: 30px; margin-left: 4px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--cx-text); color: var(--cx-bg); }
  .app .cx-send:disabled { background: var(--cx-active); color: var(--cx-faint); cursor: default; }
  .cx-send svg { width: 16px; height: 16px; }
  .readonly { max-width: 760px; margin: 0 auto; padding: 10px; text-align: center; color: var(--cx-sub); font-size: 12px; }
  /* 下拉菜单（权限、模型、主机）：贴着按钮弹出 */
  .cx-menu { position: fixed; z-index: 30; min-width: 220px; max-width: min(360px, calc(100vw - 16px)); max-height: 62vh; overflow-y: auto; padding: 5px;
    border-radius: 12px; border: 1px solid var(--cx-line); background: var(--cx-card); color: var(--cx-text); box-shadow: 0 10px 30px rgb(0 0 0 / .25);
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Segoe UI", sans-serif; }
  .cx-menu .title { padding: 6px 10px 4px; font-size: 12px; color: var(--cx-sub); }
  .cx-menu .sep { height: 1px; margin: 5px 4px; background: var(--cx-line); }
  .cx-menu button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
  .cx-menu .item { width: 100%; display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 7px; text-align: left; }
  .cx-menu .item:hover:not(:disabled) { background: var(--cx-hover); }
  .cx-menu .item:disabled { opacity: .55; cursor: default; }
  .cx-menu .item .label { flex: 1; min-width: 0; display: grid; gap: 1px; }
  .cx-menu .item small { color: var(--cx-sub); font-size: 12px; }
  .cx-menu .item .check { flex: 0 0 auto; width: 14px; color: var(--cx-text); }
  .cx-menu .item.danger { color: var(--cx-red); }
  .cx-menu .segs { display: flex; flex-wrap: wrap; gap: 4px; padding: 2px 8px 6px; }
  .cx-menu .segs button { padding: 3px 10px; border-radius: 999px; border: 1px solid var(--cx-line); font-size: 12px; }
  .cx-menu .segs button.on { border-color: var(--cx-text); font-weight: 600; }
  .cx-search { flex: 0 0 auto; padding: 0 12px 6px; }
  .cx-search input { width: 100%; height: 30px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--cx-line); background: var(--cx-bg); color: inherit; font: inherit; font-size: 13px; outline: none; }
  @media (max-width: 720px) {
    .app { grid-template-columns: minmax(0, 1fr); }
    .cx-rail { display: none; }
    .app.viewing .cx-side { display: none; }
    .app:not(.viewing) main { display: none; }
    .app .cx-back { display: flex; }
    /* iOS 输入框字号小于 16px 会自动放大页面 */
    input, textarea, select { font-size: 16px; }
    .cx-side { padding-bottom: env(safe-area-inset-bottom); }
    .cx-side-head, .cx-top { padding-top: env(safe-area-inset-top); }
    .cx-row { min-height: 40px; }
    .log { padding: 8px 16px 20px; }
    .requests { padding: 0 12px; }
    .app footer { padding: 4px 10px calc(10px + env(safe-area-inset-bottom)); }
    .cx-user { max-width: 92%; }
  }
  .gate { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; padding: 24px; z-index: 10; }
  .gate .card { width: min(380px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: grid; gap: 12px; }
  .gate h2 { margin: 0; font-size: 17px; }
  .gate p { margin: 0; color: var(--muted); font-size: 13px; }
  .gate input { width: 100%; }
  .gate .code { font: 600 18px/1.4 ui-monospace, Menlo, monospace; letter-spacing: 3px; text-transform: uppercase; }
  /* ================= 聊天样式：独立的手机界面（列表 / 项目 / 对话 / 设置），照微信与 Codex 手机端做 ================= */
  html[data-style="chat"] .app { display: none !important; }
  html:not([data-style="chat"]) .m { display: none !important; }
  html[data-style="chat"] body { background: var(--m-bg); }
  .m, .m-mask {
    --m-bg: light-dark(#ededed, #111111);
    --m-bar: light-dark(#ededed, #191919);
    --m-row: light-dark(#ffffff, #191919);
    --m-row-active: light-dark(#e5e5e5, #262626);
    --m-line: light-dark(#e5e5e5, #2a2a2a);
    --m-text: light-dark(#191919, #e8e8e8);
    --m-sub: light-dark(#8a8a8a, #808080);
    --m-time: light-dark(#b2b2b2, #6a6a6a);
    --m-field: light-dark(#ffffff, #2c2c2c);
    --m-green: #07c160;
    --m-blue: light-dark(#576b95, #7d93c9);
    --m-red: #fa5151;
    --m-warn: #e3a92b;
    --m-in: light-dark(#ffffff, #2c2c2c);
    --m-out: light-dark(#95ec69, #3eb575);
    --m-out-text: light-dark(#191919, #0e1a12);
    --m-composer: light-dark(#f7f7f7, #1c1c1c);
    --m-pill: light-dark(#ffffff, #2c2c2c);
  }
  .m {
    position: fixed; inset: 0; max-width: 640px; margin: 0 auto; display: flex; flex-direction: column;
    background: var(--m-row); color: var(--m-text); overflow: hidden;
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Segoe UI", sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  .m button { font: inherit; color: inherit; background: none; border: none; padding: 0; cursor: pointer; border-radius: 0; }
  .m button:hover:not(:disabled) { border-color: transparent; }
  .m svg { display: block; }
  .m-screen { flex: 1; min-height: 0; display: flex; flex-direction: column; background: var(--m-row); }
  /* 顶栏 */
  .m-top { flex: 0 0 auto; display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; height: 48px;
    padding: env(safe-area-inset-top) 8px 0; background: var(--m-bar); }
  .m-top .m-icon { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; }
  .m-top .m-icon svg { width: 26px; height: 26px; }
  .m-top .m-title { justify-self: center; min-width: 0; max-width: 100%; display: flex; align-items: center; gap: 6px; font-size: 17px; font-weight: 600; }
  .m-top .m-title span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .m-top .m-title .dot { flex: 0 0 8px; width: 8px; height: 8px; border-radius: 50%; background: var(--m-green); }
  .m-top .m-title .dot.off { background: var(--m-red); }
  .m-top .m-title svg { flex: 0 0 auto; width: 14px; height: 14px; opacity: .7; }
  .m-top .m-back { display: flex; align-items: center; gap: 2px; height: 44px; font-size: 16px; }
  .m-top .m-back svg { width: 24px; height: 24px; }
  .m-top .m-back .count { font-size: 14px; padding: 1px 7px; border-radius: 999px; background: color-mix(in srgb, var(--m-text) 10%, transparent); }
  /* 搜索 */
  .m-search { flex: 0 0 auto; padding: 4px 12px 10px; background: var(--m-bar); }
  .m-search label { position: relative; display: block; }
  .m-search input { width: 100%; height: 36px; border: none; border-radius: 8px; background: var(--m-field); color: var(--m-text);
    font-size: 16px; text-align: center; padding: 0 12px; outline: none; }
  .m-search input:focus, .m-search input:not(:placeholder-shown) { text-align: left; padding-left: 34px; }
  .m-search svg { position: absolute; left: 10px; top: 9px; width: 18px; height: 18px; opacity: .5; display: none; }
  .m-search input:focus + svg, .m-search input:not(:placeholder-shown) + svg { display: block; }
  /* 列表 */
  .m-rows { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; background: var(--m-row); }
  .m-row { position: relative; display: flex; align-items: center; gap: 12px; padding: 12px 16px; cursor: pointer; }
  .m-row:active, .m-row.active { background: var(--m-row-active); }
  .m-row::after { content: ""; position: absolute; left: 76px; right: 0; bottom: 0; border-bottom: 1px solid var(--m-line); }
  .m-row:last-child::after { display: none; }
  .m-row-body { flex: 1; min-width: 0; display: grid; gap: 3px; }
  .m-row-head { display: flex; align-items: baseline; gap: 8px; }
  .m-row-title { flex: 1; min-width: 0; font-size: 17px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .m-row-time { flex: 0 0 auto; font-size: 12px; color: var(--m-time); }
  .m-row-sub { font-size: 14px; color: var(--m-sub); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .m-row-sub .running { color: var(--m-blue); }
  .m-empty { padding: 48px 24px; text-align: center; color: var(--m-sub); font-size: 14px; }
  /* 头像：单字方块 / 九宫格（按微信群头像的排法） */
  .m-avatar { position: relative; flex: 0 0 48px; width: 48px; height: 48px; }
  .m-avatar .face { width: 100%; height: 100%; border-radius: 6px; overflow: hidden; display: flex; flex-direction: column;
    justify-content: center; gap: 2px; padding: 2px; box-sizing: border-box; background: light-dark(#dcdcdc, #2e2e2e); }
  .m-avatar .face.single { padding: 0; align-items: center; color: #fff; font-size: 21px; font-weight: 500; }
  .m-avatar .grid-row { display: flex; justify-content: center; gap: 2px; }
  .m-avatar .tile { display: flex; align-items: center; justify-content: center; border-radius: 2px; color: #fff; font-weight: 500; overflow: hidden; }
  .m-avatar .badge { position: absolute; top: -6px; right: -6px; min-width: 18px; height: 18px; padding: 0 5px; box-sizing: border-box;
    border-radius: 9px; background: var(--m-red); color: #fff; font-size: 11px; line-height: 18px; text-align: center; }
  .m-avatar .badge.dot { min-width: 10px; width: 10px; height: 10px; padding: 0; top: -3px; right: -3px; }
  /* 底部标签栏 */
  .m-tabs { flex: 0 0 auto; display: flex; border-top: 1px solid var(--m-line); background: var(--m-composer); padding-bottom: env(safe-area-inset-bottom); }
  .m-tabs button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 7px 0 5px; font-size: 11px; color: var(--m-text); position: relative; }
  .m-tabs button svg { width: 26px; height: 26px; }
  .m-tabs button[aria-selected="true"] { color: var(--m-green); }
  .m-tabs .badge { position: absolute; top: 2px; left: calc(50% + 6px); min-width: 18px; height: 18px; padding: 0 5px; box-sizing: border-box;
    border-radius: 9px; background: var(--m-red); color: #fff; font-size: 11px; line-height: 18px; }
  /* 对话 */
  .m-chat { background: var(--m-bg); }
  .m-chat .m-top { background: var(--m-bg); border-bottom: 1px solid var(--m-line); }
  .m-chat .m-title { flex-direction: column; gap: 0; }
  .m-chat .m-title small { font-size: 11px; font-weight: 400; color: var(--m-sub); }
  .m-log { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 8px 12px 16px; display: flex; flex-direction: column; gap: 16px; }
  .m-time-tip { align-self: center; font-size: 12px; color: var(--m-time); padding-top: 4px; }
  .m-tip { align-self: center; max-width: 80%; text-align: center; font-size: 12px; color: var(--m-sub);
    padding: 3px 8px; border-radius: 4px; background: color-mix(in srgb, var(--m-text) 6%, transparent); }
  .m-tip.error { color: var(--m-red); text-align: left; white-space: pre-wrap; word-break: break-word; }
  .m-msg { display: flex; align-items: flex-start; gap: 10px; }
  .m-msg.out { flex-direction: row-reverse; }
  .m-msg .who { flex: 0 0 40px; width: 40px; height: 40px; border-radius: 5px; display: flex; align-items: center; justify-content: center;
    font-size: 17px; font-weight: 600; }
  .m-msg.in .who { background: light-dark(#191919, #e8e8e8); color: light-dark(#ffffff, #191919); }
  .m-msg.out .who { background: light-dark(#c9c9c9, #3a3a3a); color: light-dark(#ffffff, #d0d0d0); }
  .m-bubble { position: relative; max-width: calc(100% - 100px); padding: 9px 12px; border-radius: 6px; font-size: 16px; line-height: 1.5;
    white-space: pre-wrap; word-break: break-word; background: var(--m-in); color: var(--m-text); }
  .m-bubble::before { content: ""; position: absolute; top: 13px; width: 0; height: 0; border: 7px solid transparent; }
  .m-msg.in .m-bubble::before { left: -13px; border-right-color: var(--m-in); }
  .m-msg.out .m-bubble { background: var(--m-out); color: var(--m-out-text); }
  .m-msg.out .m-bubble::before { right: -13px; border-left-color: var(--m-out); }
  .m-bubble .tag { display: inline-block; margin-right: 6px; padding: 0 5px; border-radius: 3px; font-size: 11px; line-height: 17px; vertical-align: 2px;
    background: color-mix(in srgb, currentColor 14%, transparent); }
  .m-bubble pre, .m-bubble code { font-family: ui-monospace, Menlo, monospace; font-size: 13px; }
  .m-bubble pre { margin: 6px 0; padding: 8px 10px; border-radius: 5px; overflow-x: auto; white-space: pre; background: color-mix(in srgb, var(--m-text) 7%, transparent); }
  .m-bubble code { padding: 0 3px; border-radius: 3px; background: color-mix(in srgb, var(--m-text) 8%, transparent); }
  .m-bubble.typing { display: flex; gap: 5px; align-items: center; padding: 14px 14px; }
  .m-bubble.typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--m-sub); animation: m-dot 1.2s infinite ease-in-out; }
  .m-bubble.typing i:nth-child(2) { animation-delay: .15s; } .m-bubble.typing i:nth-child(3) { animation-delay: .3s; }
  @keyframes m-dot { 0%, 80%, 100% { opacity: .25; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-3px); } }
  /* 卡片气泡：命令、改文件、审批、提问 */
  .m-card { max-width: calc(100% - 100px); width: 280px; border-radius: 6px; background: var(--m-in); color: var(--m-text); overflow: hidden; font-size: 14px; }
  .m-card-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px 6px; font-weight: 500; }
  .m-card-head .state { margin-left: auto; font-size: 12px; font-weight: 400; color: var(--m-sub); }
  .m-card-head .state.ok { color: var(--m-green); } .m-card-head .state.bad { color: var(--m-red); }
  .m-card-body { padding: 0 12px 10px; }
  .m-card .m-cmd { display: block; font: 12.5px/1.45 ui-monospace, Menlo, monospace; white-space: pre-wrap; word-break: break-all; color: var(--m-sub);
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .m-card pre.out { margin: 8px 0 0; padding: 8px; border-radius: 4px; max-height: 240px; overflow: auto; font: 12px/1.45 ui-monospace, Menlo, monospace;
    white-space: pre-wrap; background: color-mix(in srgb, var(--m-text) 6%, transparent); }
  .m-card-foot { display: flex; border-top: 1px solid var(--m-line); }
  .m-card-foot button { flex: 1; padding: 11px 0; font-size: 15px; text-align: center; }
  .m-card-foot button + button { border-left: 1px solid var(--m-line); }
  .m-card-foot button.primary { color: var(--m-green); font-weight: 600; }
  .m-card-foot button.danger { color: var(--m-red); }
  .m-card-foot button:disabled { opacity: .4; }
  .m-card .reason { margin-bottom: 6px; }
  .m-card .choices { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .m-card .choices button { padding: 6px 12px; border-radius: 16px; border: 1px solid var(--m-line); font-size: 14px; }
  .m-card .choices button.on { border-color: var(--m-green); color: var(--m-green); }
  .m-card .choices input { flex: 1 0 100%; height: 34px; border-radius: 6px; border: 1px solid var(--m-line); background: transparent; color: inherit; padding: 0 10px; font-size: 16px; }
  .m-card .readonly { padding: 10px 12px; color: var(--m-sub); font-size: 13px; border-top: 1px solid var(--m-line); }
  .m-card.attention { box-shadow: 0 0 0 1.5px var(--m-warn); }
  /* 加加：头像、会话卡片、审批卡片上的会话名、状态行 */
  .m-avatar .face.jj, .m-msg .who.jj, .jj-preview .face.jj { background: linear-gradient(135deg, #07c160, #10aeff); color: #fff; font-weight: 600; }
  .m-avatar .face.jj, .m-msg .who.jj { overflow: hidden; white-space: nowrap; }
  .face.jj.jj-img, .who.jj.jj-img { background-size: cover; background-position: center; background-repeat: no-repeat; }
  .m-row.jj-row { background: color-mix(in srgb, var(--m-green) 6%, var(--m-row)); }
  .m-sheet .jj-preview { display: flex; justify-content: center; padding: 16px 0 6px; }
  .m-sheet .jj-preview .face { width: 72px; height: 72px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 32px; }
  .m-sheet .swatches { display: flex; flex-wrap: wrap; gap: 10px; padding: 4px 18px 12px; }
  .m-sheet .swatches button { width: 32px; height: 32px; border-radius: 50%; border: 2px solid transparent; }
  .m-sheet .swatches button.on { border-color: var(--m-text); }
  .m-sheet .persona { min-height: 110px; }
  .m-card.m-thread { cursor: pointer; }
  .m-card.m-thread .m-card-head { padding-bottom: 2px; }
  .m-card.m-thread .m-card-head .kind { font-size: 12px; font-weight: 400; color: var(--m-sub); }
  .m-card.m-thread .m-card-body { color: var(--m-sub); font-size: 13px; }
  .m-card .jj-thread { padding: 8px 12px 0; font-size: 13px; color: var(--m-blue); cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .m-card.resolved { opacity: .6; box-shadow: none; }
  .m-card.resolved .m-card-head { align-items: flex-start; }
  .m-card.resolved .m-card-head > span:first-child { min-width: 0; overflow-wrap: anywhere; font-weight: 400; }
  .m-card.resolved .m-card-head .state { flex: 0 0 auto; white-space: nowrap; }
  .m-bot-stack { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; min-width: 0; max-width: calc(100% - 50px); }
  .m-bot-stack > .m-bubble, .m-bot-stack > .m-card { max-width: 100%; }
  .m-more-older { align-self: center; font-size: 13px; color: var(--m-blue); padding: 4px 10px; }
  .m-sheet .memory { width: 100%; box-sizing: border-box; min-height: 120px; border: 1px solid var(--m-line); border-radius: 8px; background: var(--m-bg);
    color: inherit; font: 14px/1.5 ui-monospace, Menlo, monospace; padding: 10px 12px; resize: vertical; }
  .m-sheet .hint { padding: 0 18px 12px; font-size: 13px; color: var(--m-sub); line-height: 1.5; }
  /* 输入区：胶囊输入框 + 模式 / 权限 / 模型 / 上下文 */
  .m-composer { flex: 0 0 auto; padding: 8px 12px calc(8px + env(safe-area-inset-bottom)); background: var(--m-composer); border-top: 1px solid var(--m-line); }
  .m-pill { display: flex; align-items: flex-end; gap: 6px; min-height: 46px; padding: 4px 6px 4px 8px; box-sizing: border-box; border-radius: 23px; background: var(--m-pill); }
  .m-pill .plus { flex: 0 0 38px; height: 38px; display: flex; align-items: center; justify-content: center; color: var(--m-sub); }
  .m-pill .plus svg { width: 26px; height: 26px; }
  .m-pill textarea { flex: 1; min-width: 0; max-height: 132px; height: 38px; padding: 8px 2px; border: none; outline: none; resize: none;
    background: transparent; color: var(--m-text); font: inherit; font-size: 16px; line-height: 22px; }
  .m-pill textarea::placeholder { color: var(--m-sub); }
  .m-pill .go { flex: 0 0 38px; width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .m-pill .go svg { width: 20px; height: 20px; }
  .m-pill .go.send { background: var(--m-green); color: #fff; }
  .m-pill .go.stop { background: var(--m-text); color: var(--m-composer); }
  .m-pill .go:disabled { opacity: .4; }
  .m-chips { display: flex; align-items: center; gap: 16px; padding: 8px 6px 0; overflow-x: auto; scrollbar-width: none; font-size: 14px; color: var(--m-sub); }
  .m-chips::-webkit-scrollbar { display: none; }
  .m-chips button { flex: 0 0 auto; display: flex; align-items: center; gap: 5px; white-space: nowrap; max-width: 220px; }
  .m-chips button span { overflow: hidden; text-overflow: ellipsis; }
  .m-chips button svg { flex: 0 0 auto; width: 16px; height: 16px; }
  .m-chips button.warn { color: var(--m-warn); }
  .m-chips button.on { color: var(--m-blue); }
  .m-chips button:disabled { opacity: .5; }
  .m-chips .ring { display: flex; align-items: center; gap: 6px; flex: 0 0 auto; }
  .m-chips .ring svg { width: 18px; height: 18px; }
  .m-readonly { padding: 12px 4px; text-align: center; color: var(--m-sub); font-size: 13px; }
  /* 待发送的附件 */
  .m-attach { display: flex; gap: 8px; padding: 0 2px 8px; overflow-x: auto; scrollbar-width: none; }
  .m-attach::-webkit-scrollbar { display: none; }
  .m-attach .item { position: relative; flex: 0 0 auto; width: 64px; height: 64px; border-radius: 8px; overflow: hidden; background: var(--m-pill);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 10px; color: var(--m-sub); }
  .m-attach .item img { width: 100%; height: 100%; object-fit: cover; }
  .m-attach .item svg { width: 22px; height: 22px; }
  .m-attach .item .name { max-width: 58px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 3px; }
  .m-attach .item .x { position: absolute; top: 3px; right: 3px; width: 18px; height: 18px; border-radius: 50%; background: rgb(0 0 0 / .55); color: #fff;
    font-size: 12px; line-height: 18px; text-align: center; }
  .m-attach .item.uploading::after { content: attr(data-progress); position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgb(0 0 0 / .45); color: #fff; font-size: 13px; font-weight: 600; }
  .m-attach .item.error { outline: 2px solid var(--m-red); }
  /* 消息里的图片 / 文件 */
  .m-photo { max-width: min(220px, calc(100% - 100px)); border-radius: 6px; overflow: hidden; background: var(--m-in); cursor: zoom-in; }
  .m-photo img { display: block; max-width: 100%; max-height: 300px; object-fit: cover; }
  .m-photo.missing { padding: 18px 22px; color: var(--m-sub); font-size: 13px; cursor: default; }
  .m-file { display: flex; align-items: center; gap: 10px; width: 220px; max-width: calc(100% - 100px); padding: 12px; border-radius: 6px; background: var(--m-in); color: var(--m-text); box-sizing: border-box; }
  .m-file svg { flex: 0 0 auto; width: 30px; height: 30px; color: var(--m-blue); }
  .m-file span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 15px; }
  .m-viewer { position: fixed; inset: 0; z-index: 40; background: #000; display: flex; align-items: center; justify-content: center; }
  .m-viewer img { max-width: 100%; max-height: 100%; object-fit: contain; }
  /* 文件夹浏览 */
  .m-sheet .crumb { padding: 10px 18px; font-size: 13px; color: var(--m-sub); word-break: break-all; background: var(--m-bg); }
  .m-sheet .opt .folder { flex: 0 0 auto; width: 24px; height: 24px; color: var(--m-blue); }
  .m-sheet .opt .git { flex: 0 0 auto; font-size: 11px; padding: 1px 6px; border-radius: 4px; color: var(--m-green); border: 1px solid currentColor; }
  .m-sheet .pick { position: sticky; bottom: 0; padding: 10px 18px; background: var(--m-row); border-top: 1px solid var(--m-line); display: grid; gap: 6px; }
  .m-sheet .pick small { color: var(--m-sub); font-size: 12px; word-break: break-all; }
  .m-sheet .chosen { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 8px; background: var(--m-bg); }
  .m-sheet .chosen span { flex: 1; min-width: 0; word-break: break-all; font-size: 14px; }
  .m-sheet .chosen button { flex: 0 0 auto; color: var(--m-blue); font-size: 14px; }
  /* 设置 */
  .m-settings { background: var(--m-bg); }
  .m-group { margin: 12px 0 0; background: var(--m-row); }
  .m-group-title { padding: 18px 16px 6px; font-size: 13px; color: var(--m-sub); }
  .m .m-item { position: relative; display: flex; align-items: center; gap: 12px; width: 100%; min-height: 54px; padding: 0 16px; box-sizing: border-box; text-align: left; font-size: 17px; }
  .m-item + .m-item::before { content: ""; position: absolute; left: 16px; right: 0; top: 0; border-top: 1px solid var(--m-line); }
  .m-item .value { margin-left: auto; color: var(--m-sub); font-size: 15px; max-width: 60%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .m .m-item.danger { justify-content: center; color: var(--m-red); }
  .m .m-item:disabled { opacity: 1; cursor: default; }
  .m-seg { margin-left: auto; display: inline-flex; padding: 2px; border-radius: 8px; background: color-mix(in srgb, var(--m-text) 8%, transparent); }
  .m-seg button { padding: 5px 12px; border-radius: 6px; font-size: 14px; }
  .m-seg button[aria-pressed="true"] { background: var(--m-row); box-shadow: 0 1px 2px rgb(0 0 0 / .12); font-weight: 500; }
  /* 底部弹出菜单 */
  .m-mask { position: fixed; inset: 0; z-index: 20; background: rgb(0 0 0 / .45); display: flex; align-items: flex-end; justify-content: center; animation: m-fade .18s; }
  .m-sheet { width: 100%; max-width: 640px; max-height: 82vh; display: flex; flex-direction: column; border-radius: 14px 14px 0 0; overflow: hidden;
    background: var(--m-bg); color: var(--m-text); padding-bottom: env(safe-area-inset-bottom); animation: m-up .22s ease-out;
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Segoe UI", sans-serif; }
  .m-sheet-title { padding: 14px 16px 10px; text-align: center; font-size: 13px; color: var(--m-sub); background: var(--m-row); }
  .m-sheet-body { overflow-y: auto; background: var(--m-row); }
  .m-sheet button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
  .m-sheet .opt { position: relative; display: flex; align-items: center; gap: 10px; width: 100%; min-height: 54px; padding: 8px 18px; box-sizing: border-box; text-align: left; }
  .m-sheet .opt + .opt::before { content: ""; position: absolute; left: 18px; right: 0; top: 0; border-top: 1px solid var(--m-line); }
  .m-sheet .opt .label { display: grid; gap: 2px; flex: 1; min-width: 0; }
  .m-sheet .opt small { font-size: 13px; color: var(--m-sub); }
  .m-sheet .opt.danger { color: var(--m-red); }
  .m-sheet .opt.center { justify-content: center; text-align: center; }
  .m-sheet .opt .check { color: var(--m-green); font-weight: 700; }
  .m-sheet .opt:disabled { opacity: .45; }
  .m-sheet .section { padding: 12px 18px 4px; font-size: 13px; color: var(--m-sub); }
  .m-sheet .seg-row { display: flex; flex-wrap: wrap; gap: 8px; padding: 6px 18px 14px; }
  .m-sheet .seg-row button { padding: 6px 14px; border-radius: 16px; border: 1px solid var(--m-line); font-size: 14px; }
  .m-sheet .seg-row button.on { border-color: var(--m-green); color: var(--m-green); }
  .m-sheet .form { display: grid; gap: 10px; padding: 14px 18px 18px; }
  .m-sheet .form input, .m-sheet .form textarea { width: 100%; box-sizing: border-box; border: 1px solid var(--m-line); border-radius: 8px; background: var(--m-bg);
    color: inherit; font: inherit; font-size: 16px; padding: 10px 12px; }
  .m-sheet .form textarea { min-height: 80px; resize: none; }
  .m-sheet .primary-btn { height: 44px; border-radius: 8px; background: var(--m-green); color: #fff; font-weight: 600; }
  .m-sheet .primary-btn:disabled { opacity: .5; }
  .m-sheet .cancel { margin-top: 8px; width: 100%; min-height: 54px; background: var(--m-row); }
  @keyframes m-up { from { transform: translateY(100%); } to { transform: none; } }
  @keyframes m-fade { from { opacity: 0; } to { opacity: 1; } }
  /* ================= 桌面镜像 ================= */
  html[data-style="mirror"] .app, html[data-style="mirror"] .m { display: none !important; }
  html:not([data-style="mirror"]) .mirror { display: none !important; }
  html[data-style="mirror"] body { background: #000; }
  .mirror { position: fixed; inset: 0; display: flex; flex-direction: column; background: #0b0b0b; color: #e8e8e8;
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif; }
  .mirror-bar { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; min-height: 44px; padding: env(safe-area-inset-top) 10px 0; background: #1a1a1a; border-bottom: 1px solid #2a2a2a; }
  .mirror-bar .status { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: #bbb; font-size: 13px; }
  .mirror-bar .dot { flex: 0 0 8px; width: 8px; height: 8px; border-radius: 50%; background: #777; }
  .mirror-bar .dot.on { background: #07c160; } .mirror-bar .dot.off { background: #fa5151; }
  .mirror-bar button { flex: 0 0 auto; font: inherit; font-size: 13px; color: #e8e8e8; background: #2c2c2c; border: 1px solid #3a3a3a; border-radius: 6px; padding: 5px 10px; cursor: pointer; }
  .mirror-bar button.on { border-color: #07c160; color: #07c160; }
  .mirror-stage { flex: 1; min-height: 0; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  .mirror-stage canvas { display: block; max-width: 100%; max-height: 100%; outline: none; }
  .mirror-tip { position: absolute; left: 24px; right: 24px; top: 50%; transform: translateY(-50%); text-align: center; color: #999; font-size: 14px; pointer-events: none; }
  .mirror-ime { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom)); transform: translateX(-50%); max-width: 80vw; padding: 6px 14px; border-radius: 8px;
    background: rgb(30 30 30 / .94); border: 1px solid #444; color: #fff; font-size: 17px; white-space: pre-wrap; z-index: 5; }
  #mirrorInput { position: fixed; left: 0; bottom: 0; width: 2px; height: 2px; padding: 0; border: 0; opacity: 0; resize: none; font-size: 16px; caret-color: transparent; }
  html[data-style="chat"] .toast { bottom: calc(96px + env(safe-area-inset-bottom)); z-index: 30; }
  html[data-style="chat"] .gate { background: var(--bg); }
  /* ================= 聊天样式·宽屏：照电脑版微信（图标栏 + 会话列表 + 对话）================= */
  .m-tabs .m-rail-only, .m-placeholder { display: none; }
  @media (min-width: 900px) {
    .m { max-width: none; display: grid; grid-template-columns: 64px 300px minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); font-size: 14px;
      --m-bg: light-dark(#f5f5f5, #1f1f1f); --m-bar: light-dark(#f7f7f7, #262626); --m-row: light-dark(#f7f7f7, #262626);
      --m-row-active: light-dark(#dedede, #333333); --m-line: light-dark(#e6e6e6, #313131); --m-field: light-dark(#e3e3e3, #333333);
      --m-composer: light-dark(#ffffff, #262626); --m-rail: light-dark(#ececec, #2e2e2e); }
    .m > #mList, .m > #mProject, .m > #mSettings { grid-column: 2; grid-row: 1; border-right: 1px solid var(--m-line); }
    .m > #mChat, .m > #mBot { grid-column: 3; grid-row: 1; }
    /* 图标栏 */
    .m-tabs { grid-column: 1; grid-row: 1; flex-direction: column; align-items: center; gap: 6px; padding: 28px 0 14px; border: none; background: var(--m-rail); }
    .m-tabs .m-rail-only { display: flex; }
    .m-tabs .grow { flex: 1; }
    .m-tabs button { flex: 0 0 auto; width: 42px; height: 42px; padding: 0; justify-content: center; border-radius: 8px; color: var(--m-sub); }
    .m-tabs button:hover { background: color-mix(in srgb, var(--m-text) 7%, transparent); }
    .m-tabs button span { display: none; }
    .m-tabs button svg { width: 25px; height: 25px; }
    .m-tabs .badge { top: 2px; left: auto; right: -2px; }
    .m-me { width: 38px; height: 38px; margin-bottom: 14px; border-radius: 6px; align-items: center; justify-content: center; color: #fff; font-size: 17px; font-weight: 600; background: #3f9a8c; }
    /* 会话列表：搜索框 + ⊕ 一行，下面是会话 */
    #mList { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: auto minmax(0, 1fr); }
    #mList .m-top { grid-column: 2; grid-row: 1; display: flex; height: auto; padding: 18px 12px 12px 0; gap: 2px; }
    #mList .m-top .m-title { display: none; }
    #mList .m-top .m-icon { width: 30px; height: 30px; border-radius: 6px; color: var(--m-sub); }
    #mList .m-top .m-icon:hover { background: var(--m-field); }
    #mList .m-top .m-icon svg { width: 21px; height: 21px; }
    #mList .m-search { grid-column: 1; grid-row: 1; padding: 18px 8px 12px 14px; }
    #mList .m-search input { height: 30px; border-radius: 6px; font-size: 13px; text-align: left; padding-left: 30px; }
    #mList .m-search svg { display: block; left: 9px; top: 7px; width: 16px; height: 16px; }
    #mList .m-rows { grid-column: 1 / -1; grid-row: 2; }
    .m-top { height: 60px; }
    #mProject .m-top, #mSettings .m-top { display: flex; padding: 0 8px; border-bottom: 1px solid var(--m-line); }
    #mProject .m-top .m-title, #mSettings .m-top .m-title { flex: 1; justify-content: flex-start; font-size: 15px; }
    .m-rows { background: var(--m-row); }
    .m-row { padding: 12px 14px; gap: 11px; }
    .m-row::after { display: none; }
    .m-row:hover { background: color-mix(in srgb, var(--m-text) 5%, transparent); }
    .m-row.active, .m-row.active:hover { background: #07c160; color: #fff; }
    .m-row.active .m-row-sub, .m-row.active .m-row-time, .m-row.active .m-row-sub .running { color: rgb(255 255 255 / .85); }
    .m-row-title { font-size: 15px; }
    .m-row-sub { font-size: 12.5px; }
    .m-row-time { font-size: 11px; }
    .m .m-item { font-size: 14px; min-height: 46px; }
    /* 对话 */
    .m-chat { background: var(--m-bg); }
    .m-chat .m-top { display: flex; height: 60px; padding: 0 12px 0 24px; background: var(--m-bg); }
    .m-chat .m-back { display: none; }
    .m-chat .m-title { flex: 1; flex-direction: row; align-items: baseline; justify-content: flex-start; gap: 10px; font-size: 17px; font-weight: 500; }
    .m-chat .m-title small { font-size: 12px; }
    .m-chat .m-icon { width: 36px; height: 36px; border-radius: 6px; color: var(--m-sub); }
    .m-chat .m-icon:hover { background: color-mix(in srgb, var(--m-text) 7%, transparent); }
    .m-chat .m-icon svg { width: 22px; height: 22px; }
    .m-log { padding: 16px 28px 24px; gap: 18px; }
    .m-msg .who { flex-basis: 36px; width: 36px; height: 36px; border-radius: 4px; font-size: 15px; }
    .m-bubble, .m-card, .m-file { font-size: 14px; max-width: min(620px, calc(100% - 100px)); }
    .m-bubble { padding: 9px 12px; border-radius: 4px; }
    .m-bubble::before { top: 12px; }
    .m-card { width: 340px; }
    .m-tip, .m-time-tip { font-size: 12px; }
    /* 输入区：上面整块打字，下面一行工具 + 发送（照电脑版微信） */
    .m-composer { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; grid-template-rows: auto minmax(0, 1fr) auto; height: 190px;
      margin: 0 16px 16px; padding: 10px 12px; border: 1px solid var(--m-line); border-radius: 10px; background: var(--m-composer); }
    .m-composer:focus-within { border-color: color-mix(in srgb, var(--m-text) 22%, var(--m-line)); }
    .m-composer.drag { border-color: #07c160; }
    .m-composer .m-pill { display: contents; }
    .m-composer .m-attach { grid-column: 1 / -1; grid-row: 1; }
    .m-composer .m-pill textarea { grid-column: 1 / -1; grid-row: 2; height: 100% !important; max-height: none; padding: 2px 4px; font-size: 14px; line-height: 21px; }
    .m-composer .m-pill .plus { grid-column: 1; grid-row: 3; width: 32px; height: 32px; border-radius: 6px; }
    .m-composer .m-pill .plus:hover { background: var(--m-field); }
    .m-composer .m-pill .plus svg { width: 21px; height: 21px; }
    .m-composer .m-chips { grid-column: 2; grid-row: 3; padding: 0 8px; gap: 14px; font-size: 13px; }
    .m-composer .m-pill .go { grid-column: 3; grid-row: 3; width: auto; height: 32px; padding: 0 20px; border-radius: 6px; font-size: 14px;
      background: var(--m-field); color: var(--m-sub); }
    .m-composer .m-pill .go.ready { background: #07c160; color: #fff; }
    .m-composer .m-pill .go.stop { background: var(--m-red); color: #fff; }
    .m-placeholder { display: flex; flex: 1; align-items: center; justify-content: center; color: color-mix(in srgb, var(--m-sub) 45%, transparent); }
    .m-placeholder svg { width: 96px; height: 96px; }
    .m.no-chat #mChat > :not(.m-placeholder) { display: none !important; }
    .m:not(.no-chat) .m-placeholder { display: none; }
    /* 弹出菜单：宽屏上居中成对话框 */
    .m-mask { align-items: center; }
    .m-sheet { max-width: 420px; border-radius: 12px; animation: m-fade .15s; }
    .m-sheet .cancel { display: none; }
  }
</style>
</head>
<body>
<div class="app" id="app">
  <nav class="cx-rail">
    <button class="on" id="railThreads" title="会话"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1Z"/></svg></button>
    <button id="mirrorOpen" title="桌面镜像：直接看并操作桌面上的 Codex 窗口" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg></button>
    <button id="jiajiaOpen" title="加加：帮你照看会话的助理（切到聊天样式）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="7" width="16" height="12" rx="3"/><path d="M12 7V4M9 12h.01M15 12h.01M9.5 15.5h5"/></svg></button>
    <span class="grow"></span>

    <button id="style" title="切换到聊天样式（照微信）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-8.5 8.3 9 9 0 0 1-3.9-.9L3 20l1.3-4.4a8 8 0 0 1-1.1-4.1A8.4 8.4 0 0 1 11.7 3.2h.8a8.4 8.4 0 0 1 8.5 8.3Z"/></svg></button>
  </nav>
  <aside class="cx-side">
    <div class="cx-side-head">
      <button class="cx-host" id="cxHost" title="这台电脑"><span id="cxHostName">Codex</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>
      <span class="grow"></span>
      <button class="cx-icon" id="refresh" title="刷新"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>
      <button class="cx-icon" id="cxSearchToggle" title="搜索"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
    </div>
    <div class="cx-search" id="cxSearchBox" hidden><input id="cxSearch" type="search" placeholder="搜索会话" autocomplete="off"></div>
    <div class="cx-side-scroll">
      <button class="cx-nav" id="cxNew"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg><span>新聊天</span></button>
      <div class="cx-section">项目</div>
      <div id="cxProjects"></div>
      <div class="cx-section">最近</div>
      <div id="threads"><div class="cx-empty">加载中…</div></div>
    </div>
    <div class="whoami" id="whoami" hidden><span id="whoamiText"></span><button id="forget" hidden title="清除本机保存的设备令牌">退出</button></div>
  </aside>
  <main>
    <header class="cx-top">
      <button class="cx-back" id="back" aria-label="返回"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>

<!-- 聊天样式：手机界面。和上面的 Codex 样式共用数据与接口，只是另一套呈现。 -->

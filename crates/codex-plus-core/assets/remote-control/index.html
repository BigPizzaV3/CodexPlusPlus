<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#111316">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Codex++">
<link rel="manifest" href="/manifest.webmanifest">
<title>Codex++ 远程控制</title>
<style>
  :root {
    --bg: light-dark(#f6f7f9, #111316);
    --panel: light-dark(#ffffff, #1a1d21);
    --line: light-dark(#e3e6ea, #2a2e34);
    --text: light-dark(#1d2025, #e6e8eb);
    --muted: light-dark(#6b7280, #8b929b);
    --accent: #3b6ef5;
    --danger: #d93f3f;
    --ok: #1f9d55;
    --code: light-dark(#f1f3f5, #14171a);
    color-scheme: light dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; background: var(--bg); color: var(--text); }
  button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: inherit; border-radius: 7px; padding: 5px 11px; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { color: var(--danger); }
  input, textarea { font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 6px 9px; }
  textarea { resize: none; }
  .app { display: grid; grid-template-columns: 300px 1fr; height: 100%; }
  aside { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; background: var(--panel); }
  aside header { padding: 12px; border-bottom: 1px solid var(--line); display: flex; gap: 8px; align-items: center; }
  aside header h1 { font-size: 15px; margin: 0; flex: 1; }
  .threads { overflow: auto; flex: 1; }
  .thread { padding: 9px 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .thread:hover { background: var(--bg); }
  .thread.active { background: color-mix(in srgb, var(--accent) 12%, transparent); }
  .thread .title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .thread .meta { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .new-thread { padding: 10px 12px; border-top: 1px solid var(--line); display: grid; gap: 6px; }
  main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  main header { padding: 10px 16px; border-bottom: 1px solid var(--line); display: flex; gap: 10px; align-items: center; background: var(--panel); }
  main header .title { font-weight: 600; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge { font-size: 12px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  .badge.live { color: var(--ok); border-color: var(--ok); }
  .badge.running { color: var(--accent); border-color: var(--accent); }
  .log { flex: 1; overflow: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .empty { color: var(--muted); margin: auto; text-align: center; }
  .turn { display: flex; flex-direction: column; gap: 8px; }
  .msg { display: flex; gap: 8px; align-items: flex-start; max-width: 820px; }
  .msg .bubble { white-space: pre-wrap; word-break: break-word; min-width: 0; }
  .msg .avatar { display: none; flex: 0 0 auto; align-items: center; justify-content: center; font-weight: 600; }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg.user .bubble { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 7px 12px; }
  .msg.agent { align-self: flex-start; }
  .msg.steer { align-self: flex-end; color: var(--muted); font-size: 13px; }
  .thread-avatar, .thread-time { display: none; }
  .more { display: none; }
  .project-back { border: none; background: transparent; color: var(--muted); padding: 2px 6px 2px 0; font-size: 13px; }
  .thread.project .title { font-weight: 600; }
  .thread .count { color: var(--muted); font-weight: 400; }
  .thread .running { color: var(--ok); }
  .cmd { align-self: stretch; background: var(--code); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font: 12px/1.45 ui-monospace, Menlo, monospace; }
  .cmd summary { cursor: pointer; }
  .cmd pre { margin: 6px 0 0; white-space: pre-wrap; max-height: 260px; overflow: auto; }
  .note { color: var(--muted); font-size: 12px; }
  .requests { display: flex; flex-direction: column; gap: 8px; padding: 0 16px; }
  .request { border: 1px solid var(--accent); border-radius: 10px; padding: 10px 12px; background: var(--panel); display: grid; gap: 8px; }
  .request code { display: block; white-space: pre-wrap; word-break: break-all; background: var(--code); padding: 6px 8px; border-radius: 6px; font: 12px/1.45 ui-monospace, Menlo, monospace; }
  .request .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  footer { padding: 8px 16px 14px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; background: var(--panel); }
  footer .compose { display: flex; gap: 8px; }
  footer textarea { flex: 1; min-height: 40px; max-height: 160px; }
  .controls { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  [hidden] { display: none !important; }
  .controls select { font: inherit; font-size: 12px; color: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 3px 8px; max-width: 200px; }
  .controls select:disabled { opacity: .5; }
  .controls .plan { font-size: 12px; border-radius: 999px; padding: 3px 10px; }
  .controls .plan.on { background: color-mix(in srgb, var(--accent) 18%, transparent); border-color: var(--accent); color: var(--accent); }
  .controls select.danger { border-color: var(--danger); color: var(--danger); }
  .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 7px 14px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 90vw; }
  .toast.show { opacity: .92; }
  .back { display: none; }
  .whoami { padding: 6px 12px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 12px; display: flex; gap: 8px; align-items: center; }
  .whoami span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .whoami button { font-size: 12px; padding: 2px 8px; }
  .readonly { color: var(--muted); font-size: 12px; }
  .gate { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; padding: 24px; z-index: 10; }
  .gate .card { width: min(380px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: grid; gap: 12px; }
  .gate h2 { margin: 0; font-size: 17px; }
  .gate p { margin: 0; color: var(--muted); font-size: 13px; }
  .gate input { width: 100%; }
  .gate .code { font: 600 18px/1.4 ui-monospace, Menlo, monospace; letter-spacing: 3px; text-transform: uppercase; }
  /* ================= 聊天样式：独立的手机界面（列表 / 项目 / 对话 / 设置），照微信与 Codex 手机端做 ================= */
  html[data-style="chat"] .app { display: none !important; }
  html:not([data-style="chat"]) .m { display: none !important; }
  html[data-style="chat"] body { background: var(--m-bg); }
  .m {
    --m-bg: light-dark(#ededed, #111111);
    --m-bar: light-dark(#ededed, #191919);
    --m-row: light-dark(#ffffff, #191919);
    --m-row-active: light-dark(#e5e5e5, #262626);
    --m-line: light-dark(#e5e5e5, #2a2a2a);
    --m-text: light-dark(#191919, #e8e8e8);
    --m-sub: light-dark(#8a8a8a, #808080);
    --m-time: light-dark(#b2b2b2, #6a6a6a);
    --m-field: light-dark(#ffffff, #2c2c2c);
    --m-green: #07c160;
    --m-blue: light-dark(#576b95, #7d93c9);
    --m-red: #fa5151;
    --m-warn: #e3a92b;
    --m-in: light-dark(#ffffff, #2c2c2c);
    --m-out: light-dark(#95ec69, #3eb575);
    --m-out-text: light-dark(#191919, #0e1a12);
    --m-composer: light-dark(#f7f7f7, #1c1c1c);
    --m-pill: light-dark(#ffffff, #2c2c2c);
    position: fixed; inset: 0; max-width: 640px; margin: 0 auto; display: flex; flex-direction: column;
    background: var(--m-row); color: var(--m-text); overflow: hidden;
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Segoe UI", sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  .m button { font: inherit; color: inherit; background: none; border: none; padding: 0; cursor: pointer; border-radius: 0; }
  .m button:hover:not(:disabled) { border-color: transparent; }
  .m svg { display: block; }
  .m-screen { flex: 1; min-height: 0; display: flex; flex-direction: column; background: var(--m-row); }
  /* 顶栏 */
  .m-top { flex: 0 0 auto; display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; height: 48px;
    padding: env(safe-area-inset-top) 8px 0; background: var(--m-bar); }
  .m-top .m-icon { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; }
  .m-top .m-icon svg { width: 26px; height: 26px; }
  .m-top .m-title { justify-self: center; min-width: 0; max-width: 100%; display: flex; align-items: center; gap: 6px; font-size: 17px; font-weight: 600; }
  .m-top .m-title span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .m-top .m-title .dot { flex: 0 0 8px; width: 8px; height: 8px; border-radius: 50%; background: var(--m-green); }
  .m-top .m-title .dot.off { background: var(--m-red); }
  .m-top .m-title svg { flex: 0 0 auto; width: 14px; height: 14px; opacity: .7; }
  .m-top .m-back { display: flex; align-items: center; gap: 2px; height: 44px; font-size: 16px; }
  .m-top .m-back svg { width: 24px; height: 24px; }
  .m-top .m-back .count { font-size: 14px; padding: 1px 7px; border-radius: 999px; background: color-mix(in srgb, var(--m-text) 10%, transparent); }
  /* 搜索 */
  .m-search { flex: 0 0 auto; padding: 4px 12px 10px; background: var(--m-bar); }
  .m-search label { position: relative; display: block; }
  .m-search input { width: 100%; height: 36px; border: none; border-radius: 8px; background: var(--m-field); color: var(--m-text);
    font-size: 16px; text-align: center; padding: 0 12px; outline: none; }
  .m-search input:focus, .m-search input:not(:placeholder-shown) { text-align: left; padding-left: 34px; }
  .m-search svg { position: absolute; left: 10px; top: 9px; width: 18px; height: 18px; opacity: .5; display: none; }
  .m-search input:focus + svg, .m-search input:not(:placeholder-shown) + svg { display: block; }
  /* 列表 */
  .m-rows { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; background: var(--m-row); }
  .m-row { position: relative; display: flex; align-items: center; gap: 12px; padding: 12px 16px; cursor: pointer; }
  .m-row:active, .m-row.active { background: var(--m-row-active); }
  .m-row::after { content: ""; position: absolute; left: 76px; right: 0; bottom: 0; border-bottom: 1px solid var(--m-line); }
  .m-row:last-child::after { display: none; }
  .m-row-body { flex: 1; min-width: 0; display: grid; gap: 3px; }
  .m-row-head { display: flex; align-items: baseline; gap: 8px; }
  .m-row-title { flex: 1; min-width: 0; font-size: 17px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .m-row-time { flex: 0 0 auto; font-size: 12px; color: var(--m-time); }
  .m-row-sub { font-size: 14px; color: var(--m-sub); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .m-row-sub .running { color: var(--m-blue); }
  .m-empty { padding: 48px 24px; text-align: center; color: var(--m-sub); font-size: 14px; }
  /* 头像：单字方块 / 九宫格（按微信群头像的排法） */
  .m-avatar { position: relative; flex: 0 0 48px; width: 48px; height: 48px; }
  .m-avatar .face { width: 100%; height: 100%; border-radius: 6px; overflow: hidden; display: flex; flex-direction: column;
    justify-content: center; gap: 2px; padding: 2px; box-sizing: border-box; background: light-dark(#dcdcdc, #2e2e2e); }
  .m-avatar .face.single { padding: 0; align-items: center; color: #fff; font-size: 21px; font-weight: 500; }
  .m-avatar .grid-row { display: flex; justify-content: center; gap: 2px; }
  .m-avatar .tile { display: flex; align-items: center; justify-content: center; border-radius: 2px; color: #fff; font-weight: 500; overflow: hidden; }
  .m-avatar .badge { position: absolute; top: -6px; right: -6px; min-width: 18px; height: 18px; padding: 0 5px; box-sizing: border-box;
    border-radius: 9px; background: var(--m-red); color: #fff; font-size: 11px; line-height: 18px; text-align: center; }
  .m-avatar .badge.dot { min-width: 10px; width: 10px; height: 10px; padding: 0; top: -3px; right: -3px; }
  /* 底部标签栏 */
  .m-tabs { flex: 0 0 auto; display: flex; border-top: 1px solid var(--m-line); background: var(--m-composer); padding-bottom: env(safe-area-inset-bottom); }
  .m-tabs button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 7px 0 5px; font-size: 11px; color: var(--m-text); position: relative; }
  .m-tabs button svg { width: 26px; height: 26px; }
  .m-tabs button[aria-selected="true"] { color: var(--m-green); }
  .m-tabs .badge { position: absolute; top: 2px; left: calc(50% + 6px); min-width: 18px; height: 18px; padding: 0 5px; box-sizing: border-box;
    border-radius: 9px; background: var(--m-red); color: #fff; font-size: 11px; line-height: 18px; }
  /* 对话 */
  .m-chat { background: var(--m-bg); }
  .m-chat .m-top { background: var(--m-bg); border-bottom: 1px solid var(--m-line); }
  .m-chat .m-title { flex-direction: column; gap: 0; }
  .m-chat .m-title small { font-size: 11px; font-weight: 400; color: var(--m-sub); }
  .m-log { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 8px 12px 16px; display: flex; flex-direction: column; gap: 16px; }
  .m-time-tip { align-self: center; font-size: 12px; color: var(--m-time); padding-top: 4px; }
  .m-tip { align-self: center; max-width: 80%; text-align: center; font-size: 12px; color: var(--m-sub);
    padding: 3px 8px; border-radius: 4px; background: color-mix(in srgb, var(--m-text) 6%, transparent); }
  .m-msg { display: flex; align-items: flex-start; gap: 10px; }
  .m-msg.out { flex-direction: row-reverse; }
  .m-msg .who { flex: 0 0 40px; width: 40px; height: 40px; border-radius: 5px; display: flex; align-items: center; justify-content: center;
    font-size: 17px; font-weight: 600; }
  .m-msg.in .who { background: light-dark(#191919, #e8e8e8); color: light-dark(#ffffff, #191919); }
  .m-msg.out .who { background: light-dark(#c9c9c9, #3a3a3a); color: light-dark(#ffffff, #d0d0d0); }
  .m-bubble { position: relative; max-width: calc(100% - 100px); padding: 9px 12px; border-radius: 6px; font-size: 16px; line-height: 1.5;
    white-space: pre-wrap; word-break: break-word; background: var(--m-in); color: var(--m-text); }
  .m-bubble::before { content: ""; position: absolute; top: 13px; width: 0; height: 0; border: 7px solid transparent; }
  .m-msg.in .m-bubble::before { left: -13px; border-right-color: var(--m-in); }
  .m-msg.out .m-bubble { background: var(--m-out); color: var(--m-out-text); }
  .m-msg.out .m-bubble::before { right: -13px; border-left-color: var(--m-out); }
  .m-bubble .tag { display: inline-block; margin-right: 6px; padding: 0 5px; border-radius: 3px; font-size: 11px; line-height: 17px; vertical-align: 2px;
    background: color-mix(in srgb, currentColor 14%, transparent); }
  .m-bubble pre, .m-bubble code { font-family: ui-monospace, Menlo, monospace; font-size: 13px; }
  .m-bubble pre { margin: 6px 0; padding: 8px 10px; border-radius: 5px; overflow-x: auto; white-space: pre; background: color-mix(in srgb, var(--m-text) 7%, transparent); }
  .m-bubble code { padding: 0 3px; border-radius: 3px; background: color-mix(in srgb, var(--m-text) 8%, transparent); }
  .m-bubble.typing { display: flex; gap: 5px; align-items: center; padding: 14px 14px; }
  .m-bubble.typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--m-sub); animation: m-dot 1.2s infinite ease-in-out; }
  .m-bubble.typing i:nth-child(2) { animation-delay: .15s; } .m-bubble.typing i:nth-child(3) { animation-delay: .3s; }
  @keyframes m-dot { 0%, 80%, 100% { opacity: .25; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-3px); } }
  /* 卡片气泡：命令、改文件、审批、提问 */
  .m-card { max-width: calc(100% - 100px); width: 280px; border-radius: 6px; background: var(--m-in); color: var(--m-text); overflow: hidden; font-size: 14px; }
  .m-card-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px 6px; font-weight: 500; }
  .m-card-head .state { margin-left: auto; font-size: 12px; font-weight: 400; color: var(--m-sub); }
  .m-card-head .state.ok { color: var(--m-green); } .m-card-head .state.bad { color: var(--m-red); }
  .m-card-body { padding: 0 12px 10px; }
  .m-card .m-cmd { display: block; font: 12.5px/1.45 ui-monospace, Menlo, monospace; white-space: pre-wrap; word-break: break-all; color: var(--m-sub);
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .m-card pre.out { margin: 8px 0 0; padding: 8px; border-radius: 4px; max-height: 240px; overflow: auto; font: 12px/1.45 ui-monospace, Menlo, monospace;
    white-space: pre-wrap; background: color-mix(in srgb, var(--m-text) 6%, transparent); }
  .m-card-foot { display: flex; border-top: 1px solid var(--m-line); }
  .m-card-foot button { flex: 1; padding: 11px 0; font-size: 15px; text-align: center; }
  .m-card-foot button + button { border-left: 1px solid var(--m-line); }
  .m-card-foot button.primary { color: var(--m-green); font-weight: 600; }
  .m-card-foot button.danger { color: var(--m-red); }
  .m-card-foot button:disabled { opacity: .4; }
  .m-card .reason { margin-bottom: 6px; }
  .m-card .choices { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .m-card .choices button { padding: 6px 12px; border-radius: 16px; border: 1px solid var(--m-line); font-size: 14px; }
  .m-card .choices button.on { border-color: var(--m-green); color: var(--m-green); }
  .m-card .choices input { flex: 1 0 100%; height: 34px; border-radius: 6px; border: 1px solid var(--m-line); background: transparent; color: inherit; padding: 0 10px; font-size: 16px; }
  .m-card .readonly { padding: 10px 12px; color: var(--m-sub); font-size: 13px; border-top: 1px solid var(--m-line); }
  .m-card.attention { box-shadow: 0 0 0 1.5px var(--m-warn); }
  /* 输入区：胶囊输入框 + 模式 / 权限 / 模型 / 上下文 */
  .m-composer { flex: 0 0 auto; padding: 8px 12px calc(8px + env(safe-area-inset-bottom)); background: var(--m-composer); border-top: 1px solid var(--m-line); }
  .m-pill { display: flex; align-items: flex-end; gap: 6px; min-height: 46px; padding: 4px 6px 4px 8px; box-sizing: border-box; border-radius: 23px; background: var(--m-pill); }
  .m-pill .plus { flex: 0 0 38px; height: 38px; display: flex; align-items: center; justify-content: center; color: var(--m-sub); }
  .m-pill .plus svg { width: 26px; height: 26px; }
  .m-pill textarea { flex: 1; min-width: 0; max-height: 132px; height: 38px; padding: 8px 2px; border: none; outline: none; resize: none;
    background: transparent; color: var(--m-text); font: inherit; font-size: 16px; line-height: 22px; }
  .m-pill textarea::placeholder { color: var(--m-sub); }
  .m-pill .go { flex: 0 0 38px; width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .m-pill .go svg { width: 20px; height: 20px; }
  .m-pill .go.send { background: var(--m-green); color: #fff; }
  .m-pill .go.stop { background: var(--m-text); color: var(--m-composer); }
  .m-pill .go:disabled { opacity: .4; }
  .m-chips { display: flex; align-items: center; gap: 16px; padding: 8px 6px 0; overflow-x: auto; scrollbar-width: none; font-size: 14px; color: var(--m-sub); }
  .m-chips::-webkit-scrollbar { display: none; }
  .m-chips button { flex: 0 0 auto; display: flex; align-items: center; gap: 5px; white-space: nowrap; max-width: 220px; }
  .m-chips button span { overflow: hidden; text-overflow: ellipsis; }
  .m-chips button svg { flex: 0 0 auto; width: 16px; height: 16px; }
  .m-chips button.warn { color: var(--m-warn); }
  .m-chips button.on { color: var(--m-blue); }
  .m-chips button:disabled { opacity: .5; }
  .m-chips .ring { display: flex; align-items: center; gap: 6px; flex: 0 0 auto; }
  .m-chips .ring svg { width: 18px; height: 18px; }
  .m-readonly { padding: 12px 4px; text-align: center; color: var(--m-sub); font-size: 13px; }
  /* 待发送的附件 */
  .m-attach { display: flex; gap: 8px; padding: 0 2px 8px; overflow-x: auto; scrollbar-width: none; }

  .m-attach .item { position: relative; flex: 0 0 auto; width: 64px; height: 64px; border-radius: 8px; overflow: hidden; background: var(--m-pill);

  .m-attach .item img { width: 100%; height: 100%; object-fit: cover; }

  .m-attach .item .x { position: absolute; top: 3px; right: 3px; width: 18px; height: 18px; border-radius: 50%; background: rgb(0 0 0 / .55); color: #fff;
    font-size: 12px; line-height: 18px; text-align: center; }
  .m-attach .item.uploading::after { content: attr(data-progress); position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;

  .m-attach .item.error { outline: 2px solid var(--m-red); }
  /* 消息里的图片 / 文件 */

  .m-photo img { display: block; max-width: 100%; max-height: 300px; object-fit: cover; }
  .m-photo.missing { padding: 18px 22px; color: var(--m-sub); font-size: 13px; cursor: default; }
  .m-file { display: flex; align-items: center; gap: 10px; width: 220px; max-width: calc(100% - 100px); padding: 12px; border-radius: 6px; background: var(--m-in); color: var(--m-text); box-sizing: border-box; }
  .m-file svg { flex: 0 0 auto; width: 30px; height: 30px; color: var(--m-blue); }
  .m-file span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 15px; }
  .m-viewer { position: fixed; inset: 0; z-index: 40; background: #000; display: flex; align-items: center; justify-content: center; }
  .m-viewer img { max-width: 100%; max-height: 100%; object-fit: contain; }
  /* 文件夹浏览 */
  .m-sheet .crumb { padding: 10px 18px; font-size: 13px; color: var(--m-sub); word-break: break-all; background: var(--m-bg); }
  .m-sheet .opt .folder { flex: 0 0 auto; width: 24px; height: 24px; color: var(--m-blue); }
  .m-sheet .opt .git { flex: 0 0 auto; font-size: 11px; padding: 1px 6px; border-radius: 4px; color: var(--m-green); border: 1px solid currentColor; }
  .m-sheet .pick { position: sticky; bottom: 0; padding: 10px 18px; background: var(--m-row); border-top: 1px solid var(--m-line); display: grid; gap: 6px; }
  .m-sheet .pick small { color: var(--m-sub); font-size: 12px; word-break: break-all; }
  .m-sheet .chosen { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 8px; background: var(--m-bg); }
  .m-sheet .chosen span { flex: 1; min-width: 0; word-break: break-all; font-size: 14px; }
  .m-sheet .chosen button { flex: 0 0 auto; color: var(--m-blue); font-size: 14px; }
  /* 设置 */
  .m-settings { background: var(--m-bg); }
  .m-group { margin: 12px 0 0; background: var(--m-row); }
  .m-group-title { padding: 18px 16px 6px; font-size: 13px; color: var(--m-sub); }
  .m .m-item { position: relative; display: flex; align-items: center; gap: 12px; width: 100%; min-height: 54px; padding: 0 16px; box-sizing: border-box; text-align: left; font-size: 17px; }
  .m-item + .m-item::before { content: ""; position: absolute; left: 16px; right: 0; top: 0; border-top: 1px solid var(--m-line); }
  .m-item .value { margin-left: auto; color: var(--m-sub); font-size: 15px; max-width: 60%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .m .m-item.danger { justify-content: center; color: var(--m-red); }
  .m .m-item:disabled { opacity: 1; cursor: default; }
  .m-seg { margin-left: auto; display: inline-flex; padding: 2px; border-radius: 8px; background: color-mix(in srgb, var(--m-text) 8%, transparent); }
  .m-seg button { padding: 5px 12px; border-radius: 6px; font-size: 14px; }
  .m-seg button[aria-pressed="true"] { background: var(--m-row); box-shadow: 0 1px 2px rgb(0 0 0 / .12); font-weight: 500; }
  /* 底部弹出菜单 */
  .m-mask { position: fixed; inset: 0; z-index: 20; background: rgb(0 0 0 / .45); display: flex; align-items: flex-end; justify-content: center; animation: m-fade .18s; }
  .m-sheet { width: 100%; max-width: 640px; max-height: 82vh; display: flex; flex-direction: column; border-radius: 14px 14px 0 0; overflow: hidden;
    background: var(--m-bg); color: var(--m-text); padding-bottom: env(safe-area-inset-bottom); animation: m-up .22s ease-out;
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Segoe UI", sans-serif; }
  .m-sheet-title { padding: 14px 16px 10px; text-align: center; font-size: 13px; color: var(--m-sub); background: var(--m-row); }
  .m-sheet-body { overflow-y: auto; background: var(--m-row); }
  .m-sheet button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
  .m-sheet .opt { position: relative; display: flex; align-items: center; gap: 10px; width: 100%; min-height: 54px; padding: 8px 18px; box-sizing: border-box; text-align: left; }
  .m-sheet .opt + .opt::before { content: ""; position: absolute; left: 18px; right: 0; top: 0; border-top: 1px solid var(--m-line); }
  .m-sheet .opt .label { display: grid; gap: 2px; flex: 1; min-width: 0; }
  .m-sheet .opt small { font-size: 13px; color: var(--m-sub); }
  .m-sheet .opt.danger { color: var(--m-red); }
  .m-sheet .opt.center { justify-content: center; text-align: center; }
  .m-sheet .opt .check { color: var(--m-green); font-weight: 700; }
  .m-sheet .opt:disabled { opacity: .45; }
  .m-sheet .section { padding: 12px 18px 4px; font-size: 13px; color: var(--m-sub); }
  .m-sheet .seg-row { display: flex; flex-wrap: wrap; gap: 8px; padding: 6px 18px 14px; }
  .m-sheet .seg-row button { padding: 6px 14px; border-radius: 16px; border: 1px solid var(--m-line); font-size: 14px; }
  .m-sheet .seg-row button.on { border-color: var(--m-green); color: var(--m-green); }
  .m-sheet .form { display: grid; gap: 10px; padding: 14px 18px 18px; }
  .m-sheet .form input, .m-sheet .form textarea { width: 100%; box-sizing: border-box; border: 1px solid var(--m-line); border-radius: 8px; background: var(--m-bg);
    color: inherit; font: inherit; font-size: 16px; padding: 10px 12px; }
  .m-sheet .form textarea { min-height: 80px; resize: none; }
  .m-sheet .primary-btn { height: 44px; border-radius: 8px; background: var(--m-green); color: #fff; font-weight: 600; }
  .m-sheet .primary-btn:disabled { opacity: .5; }
  .m-sheet .cancel { margin-top: 8px; width: 100%; min-height: 54px; background: var(--m-row); }
  @keyframes m-up { from { transform: translateY(100%); } to { transform: none; } }
  @keyframes m-fade { from { opacity: 0; } to { opacity: 1; } }
  /* ================= 桌面镜像 ================= */
  html[data-style="mirror"] .app, html[data-style="mirror"] .m { display: none !important; }
  html:not([data-style="mirror"]) .mirror { display: none !important; }
  html[data-style="mirror"] body { background: #000; }
  .mirror { position: fixed; inset: 0; display: flex; flex-direction: column; background: #0b0b0b; color: #e8e8e8;
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif; }
  .mirror-bar { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; min-height: 44px; padding: env(safe-area-inset-top) 10px 0; background: #1a1a1a; border-bottom: 1px solid #2a2a2a; }
  .mirror-bar .status { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: #bbb; font-size: 13px; }
  .mirror-bar .dot { flex: 0 0 8px; width: 8px; height: 8px; border-radius: 50%; background: #777; }
  .mirror-bar .dot.on { background: #07c160; } .mirror-bar .dot.off { background: #fa5151; }
  .mirror-bar button { flex: 0 0 auto; font: inherit; font-size: 13px; color: #e8e8e8; background: #2c2c2c; border: 1px solid #3a3a3a; border-radius: 6px; padding: 5px 10px; cursor: pointer; }
  .mirror-bar button.on { border-color: #07c160; color: #07c160; }
  .mirror-stage { flex: 1; min-height: 0; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  .mirror-stage canvas { display: block; max-width: 100%; max-height: 100%; outline: none; }
  .mirror-tip { position: absolute; left: 24px; right: 24px; top: 50%; transform: translateY(-50%); text-align: center; color: #999; font-size: 14px; pointer-events: none; }
  .mirror-ime { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom)); transform: translateX(-50%); max-width: 80vw; padding: 6px 14px; border-radius: 8px;
    background: rgb(30 30 30 / .94); border: 1px solid #444; color: #fff; font-size: 17px; white-space: pre-wrap; z-index: 5; }
  #mirrorInput { position: fixed; left: 0; bottom: 0; width: 2px; height: 2px; padding: 0; border: 0; opacity: 0; resize: none; font-size: 16px; caret-color: transparent; }
  html[data-style="chat"] .toast { bottom: calc(96px + env(safe-area-inset-bottom)); z-index: 30; }
  html[data-style="chat"] .gate { background: var(--bg); }
  @media (max-width: 720px) {
    .app { grid-template-columns: 1fr; }
    .app.viewing aside { display: none; }
    .app:not(.viewing) main { display: none; }
    .back { display: inline-block; }
    /* iOS 输入框字号小于 16px 会自动放大页面 */
    input, textarea, select, .controls select { font-size: 16px; }
    button { padding: 7px 13px; }
    .thread { padding: 12px 14px; }
    footer { padding-bottom: calc(14px + env(safe-area-inset-bottom)); }
    aside { padding-bottom: env(safe-area-inset-bottom); }

</style>
</head>
<body>
<div class="app" id="app">
  <aside>
    <header>
      <button class="project-back" id="projectBack" hidden title="回到项目列表">‹ 项目</button>

    </header>
    <div class="whoami" id="whoami" hidden>

      <button id="notify" hidden title="会话需要审批或回答、或者跑完时提醒">开启提醒</button>
      <button id="forget" hidden title="清除本机保存的设备令牌">退出</button>
    </div>
    <div class="threads" id="threads"><div class="empty">加载中…</div></div>
    <div class="new-thread" id="newThread">

  <main>
    <header>

      <button id="interrupt" class="danger" hidden>停止</button>
      <button class="more" id="more" title="模型、推理强度、权限">⋯</button>
    </header>
    <div class="log" id="log"><div class="empty">在左侧选择会话。没在桌面打开的会话可以先查看历史，发消息时会自动在桌面打开。</div></div>
    <div class="requests" id="requests"></div>
    <footer>
      <div class="controls" id="controls" hidden>
        <select id="model" title="模型"></select>
        <select id="effort" title="推理强度"></select>

        <textarea id="input" placeholder="输入消息，Enter 发送，Shift+Enter 换行" disabled></textarea>
        <button id="send" class="primary" disabled>发送</button>

      <div class="readonly" id="readonly" hidden>这台设备只能查看。需要发消息可在 Codex++ 的设备列表里调高权限。</div>
    </footer>

</div>
<!-- 聊天样式：手机界面。和上面的 Codex 样式共用数据与接口，只是另一套呈现。 -->

  <section class="m-screen" id="mList">

      <button class="m-icon" id="mNew" aria-label="新建会话"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="M12 8v8M8 12h8"/></svg></button>
    </header>
    <div class="m-search"><label><input id="mSearch" type="search" placeholder="搜索" autocomplete="off"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></label></div>

      <div class="m-title"><span id="mProjectTitle"></span></div>

    </header>
    <div class="m-rows" id="mProjectRows"></div>
  </section>
  <section class="m-screen m-settings" id="mSettings" hidden>
    <header class="m-top"><span></span><div class="m-title"><span>设置</span></div><span></span></header>
    <div class="m-rows" id="mSettingsBody" style="background: var(--m-bg)"></div>
  </section>
  <nav class="m-tabs" id="mTabs">

    <button id="mTabSettings" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12.2 2h-.4a2 2 0 0 0-2 2v.2a2 2 0 0 1-1 1.7l-.4.3a2 2 0 0 1-2 0l-.2-.1a2 2 0 0 0-2.7.7l-.2.4a2 2 0 0 0 .7 2.7l.2.1a2 2 0 0 1 1 1.7v.5a2 2 0 0 1-1 1.8l-.2.1a2 2 0 0 0-.7 2.7l.2.4a2 2 0 0 0 2.7.7l.2-.1a2 2 0 0 1 2 0l.4.3a2 2 0 0 1 1 1.7v.2a2 2 0 0 0 2 2h.4a2 2 0 0 0 2-2v-.2a2 2 0 0 1 1-1.7l.4-.3a2 2 0 0 1 2 0l.2.1a2 2 0 0 0 2.7-.7l.2-.4a2 2 0 0 0-.7-2.7l-.2-.1a2 2 0 0 1-1-1.8v-.5a2 2 0 0 1 1-1.7l.2-.1a2 2 0 0 0 .7-2.7l-.2-.4a2 2 0 0 0-2.7-.7l-.2.1a2 2 0 0 1-2 0l-.4-.3a2 2 0 0 1-1-1.7V4a2 2 0 0 0-2-2Z"/><circle cx="12" cy="12" r="3"/></svg><span>设置</span></button>

      <div class="m-title"><span id="mChatTitle"></span><small id="mChatState"></small></div>

<!-- 桌面镜像：Codex 桌面窗口的实时画面 -->
<div class="mirror" id="mirror">

    <div class="status"><i class="dot" id="mirrorDot"></i><span id="mirrorStatus">桌面镜像</span></div>
    <button id="mirrorRetry" title="重新连接">刷新</button>

  </div>
  <div class="mirror-stage" id="mirrorStage">
    <canvas id="mirrorCanvas" tabindex="-1"></canvas>
    <div class="mirror-tip" id="mirrorTip">桌面镜像</div>
  </div>

</div>
<div class="gate" id="gate" hidden>
  <div class="card">
    <h2 id="gateTitle">配对这台设备</h2>
    <p id="gateText"></p>
    <input id="pairCode" class="code" placeholder="配对码" autocomplete="one-time-code" autocapitalize="characters" hidden>
    <input id="pairName" placeholder="设备名称" maxlength="40" hidden>
    <button id="pairButton" class="primary" hidden>配对</button>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
(() => {
  // 令牌来源：本机页面的主令牌走 #token=（只存会话级）；配对设备的令牌存 localStorage，长期有效直到被移除。
  const MASTER_KEY = "codexPlusRemoteToken";
  const DEVICE_KEY = "codexPlusRemoteDeviceToken";
  const params = new URLSearchParams(location.hash.slice(1));
  const pairCode = params.get("pair") || "";
  if (params.get("token")) sessionStorage.setItem(MASTER_KEY, params.get("token"));
  if (params.get("token") || pairCode) history.replaceState(null, "", location.pathname);
  const token = sessionStorage.getItem(MASTER_KEY) || localStorage.getItem(DEVICE_KEY) || "";
  // 对话样式：codex（桌面形态）或 chat（按微信做的聊天形态）。手机没选过时默认聊天。
  const STYLE_KEY = "codexPlusRemoteStyle";
  const narrow = window.matchMedia?.("(max-width: 720px)").matches ?? window.innerWidth <= 720;
  const style = localStorage.getItem(STYLE_KEY) || (narrow ? "chat" : "codex");
  document.documentElement.dataset.style = style;
  const $ = (id) => document.getElementById(id);
  const state = { threads: [], project: null, current: null, view: null, socket: null, poller: null, busy: false, stickNext: false, options: null, optionsFor: null, applying: false, me: null, seenRequests: new Set(), wasRunning: false };
  const rank = { view: 0, message: 1, full: 2 };
  const can = (role) => rank[state.me?.role ?? "view"] >= rank[role];

  /** 未配对 / 被移除：盖住整个页面，引导扫码或输入配对码。 */
  function showGate(title, text, { pairing = false, code = "" } = {}) {
    closeSocket();
    $("gate").hidden = false;
    $("gateTitle").textContent = title;
    $("gateText").textContent = text;
    for (const id of ["pairCode", "pairName", "pairButton"]) $(id).hidden = !pairing;
    if (pairing) {
      $("pairCode").value = code;
      $("pairName").value = guessDeviceName();
      (code ? $("pairName") : $("pairCode")).focus();
    }
  }

  function guessDeviceName() {
    const ua = navigator.userAgent;
    if (/iPhone/.test(ua)) return "iPhone";
    if (/iPad/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1)) return "iPad";
    if (/Android/.test(ua)) return "Android 手机";
    if (/Macintosh/.test(ua)) return "Mac";
    if (/Windows/.test(ua)) return "Windows 电脑";
    return "浏览器";
  }

  async function pair() {
    const code = $("pairCode").value.trim();
    if (!code) return toast("先填配对码");
    $("pairButton").disabled = true;
    try {
      const response = await fetch("/api/pair", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ code, name: $("pairName").value.trim() }),
      });
      const payload = await response.json().catch(() => ({ ok: false, error: `HTTP ${response.status}` }));
      if (!payload.ok) throw new Error(payload.error || `HTTP ${response.status}`);
      localStorage.setItem(DEVICE_KEY, payload.data.token);
      location.reload();
    } catch (error) {
      toast(error.message);
      $("pairButton").disabled = false;
    }
  }

  function unauthorized(message) {
    if (sessionStorage.getItem(MASTER_KEY)) {
      sessionStorage.removeItem(MASTER_KEY);
      showGate("令牌已失效", "请从 Codex++「远程控制」页面重新打开本页。");
    } else {
      localStorage.removeItem(DEVICE_KEY);
      showGate("需要重新配对", `${message || "这台设备已被移除"}。在 Codex++「远程控制」里点「添加设备」，扫码或输入配对码。`, { pairing: true });
    }
  }

  function toast(text) {
    const node = $("toast");
    node.textContent = text;
    node.classList.add("show");
    clearTimeout(toast.timer);
    toast.timer = setTimeout(() => node.classList.remove("show"), 3200);
  }

  async function api(method, path, body) {
    const response = await fetch(`/api${path}`, {
      method,
      headers: { "Authorization": `Bearer ${token}`, ...(body ? { "Content-Type": "application/json" } : {}) },
      body: body ? JSON.stringify(body) : undefined,
    });
    const payload = await response.json().catch(() => ({ ok: false, error: `HTTP ${response.status}` }));
    if (response.status === 401) unauthorized(payload.error);
    if (!payload.ok) throw new Error(payload.error || `HTTP ${response.status}`);
    return payload.data;
  }

  /** 页面不在前台时提醒：标题、振动、系统通知（用户允许过才发）。 */
  function alertUser(text) {
    if (!document.hidden) return;
    document.title = `● ${text} · Codex++`;
    navigator.vibrate?.(200);
    if ("Notification" in window && Notification.permission === "granted") {
      try { new Notification("Codex++ 远程控制", { body: text, tag: "codex-plus-remote" }); } catch {}
    }
  }
  document.addEventListener("visibilitychange", () => { if (!document.hidden) document.title = "Codex++ 远程控制"; });

  function watchForAttention(view) {
    for (const request of view.requests || []) {
      const key = `${view.threadId || state.current}:${JSON.stringify(request.id)}`;
      if (state.seenRequests.has(key)) continue;
      state.seenRequests.add(key);
      alertUser(request.method === "item/tool/requestUserInput" ? "模型在提问" : "有操作等你审批");
    }
    const running = view.runtime === "active";
    if (state.wasRunning && !running && view.live) alertUser(`「${view.title || "会话"}」这一轮跑完了`);
    state.wasRunning = running;
  }

  function applyRole() {
    const me = state.me;
    $("whoami").hidden = !me || me.kind === "master";
    if (me?.kind === "device") {
      const roleText = { view: "只能查看", message: "可发消息", full: "完全控制" }[me.role] || me.role;
      $("whoamiText").textContent = `${me.name} · ${roleText}`;
      $("forget").hidden = false;
    }
    $("notify").hidden = !("Notification" in window) || Notification.permission !== "default";
    $("newThread").hidden = !can("message");
    $("compose").hidden = !can("message");
    $("readonly").hidden = can("message");
    $("mirrorOpen").hidden = !can("full");
    m.onRole();
  }

  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text != null) node.textContent = text;
    return node;
  }

  function relative(seconds) {
    if (!seconds) return "";
    const diff = Date.now() / 1000 - seconds;
    if (diff < 60) return "刚刚";
    if (diff < 3600) return `${Math.floor(diff / 60)} 分钟前`;
    if (diff < 86400) return `${Math.floor(diff / 3600)} 小时前`;
    return new Date(seconds * 1000).toLocaleDateString();
  }

  async function loadThreads() {
    try {
      const data = await api("GET", "/threads");
      state.threads = data.threads || [];
      renderThreads();
    } catch (error) {
      $("threads").replaceChildren(el("div", "empty", `读取会话失败：${error.message}`));
      m.onThreadsError(error.message);
    }
  }

  const isRunning = (thread) => thread.status === "active" || thread.status === "running" || thread.status === "inProgress";
  const baseName = (path) => String(path || "").replace(/\/+$/, "").split("/").pop() || path || "未记录项目";

  /** 会话按工作目录归到项目里，项目按最近活动排序。 */
  function projectsOf(threads) {
    const map = new Map();
    for (const thread of threads) {
      const key = thread.cwd || "";
      const project = map.get(key) || { cwd: key, name: baseName(key), threads: [], updatedAt: 0, running: 0 };
      project.threads.push(thread);
      project.updatedAt = Math.max(project.updatedAt, Number(thread.updatedAt) || 0);
      if (isRunning(thread)) project.running += 1;
      map.set(key, project);
    }
    return [...map.values()].sort((a, b) => b.updatedAt - a.updatedAt);
  }

  /** 一条列表行：头像 + 标题 / 摘要 + 右侧时间。聊天样式与 Codex 样式共用。 */
  function listRow({ avatar, titleNode, meta, updatedAt, active, kind, onClick }) {
    const row = el("div", `thread${active ? " active" : ""}${kind ? ` ${kind}` : ""}`);
    row.append(el("div", "thread-avatar", avatar));
    const body = el("div", "thread-body");
    const title = el("div", "title");
    title.append(...titleNode);
    body.append(title);
    if (meta) body.append(el("div", "meta", meta));
    row.append(body);
    row.append(el("div", "thread-time", relative(updatedAt)));
    row.onclick = onClick;
    return row;
  }

  function renderThreads() {
    renderThreadsCodex();
    m.onThreads();
  }

  function renderThreadsCodex() {
    const list = $("threads");
    const insideProject = state.project !== null;
    $("projectBack").hidden = !insideProject;
    $("asideTitle").textContent = insideProject ? baseName(state.project) : "Codex++ 远程控制";
    $("newCwd").hidden = insideProject;
    $("newCwd").value = insideProject ? state.project : $("newCwd").value;
    if (!state.threads.length) return list.replaceChildren(el("div", "empty", "还没有会话"));
    if (!insideProject) {
      const projects = projectsOf(state.threads);
      $("newCwd").value = $("newCwd").value || projects.find((project) => project.cwd)?.cwd || "";
      return list.replaceChildren(...projects.map((project) => listRow({
        avatar: (project.name.trim()[0] || "#").toUpperCase(),
        titleNode: [project.name, el("span", "count", ` (${project.threads.length})`)],
        meta: [
          project.running ? el("span", "running", `${project.running} 个运行中 · `) : null,
          project.threads[0]?.title || "（未命名）",
        ].filter(Boolean),
        updatedAt: project.updatedAt,
        kind: "project",
        onClick: () => { state.project = project.cwd; renderThreads(); },
      })));
    }
    const threads = state.threads.filter((thread) => (thread.cwd || "") === state.project);
    if (!threads.length) return list.replaceChildren(el("div", "empty", "这个项目还没有会话"));
    list.replaceChildren(...threads.map((thread) => listRow({
      avatar: (thread.title || "#").trim()[0]?.toUpperCase() || "#",
      titleNode: [isRunning(thread) ? el("span", "running", "● ") : null, thread.title || "（未命名）"].filter(Boolean),
      meta: relative(thread.updatedAt),
      updatedAt: thread.updatedAt,
      active: thread.id === state.current,
      onClick: () => selectThread(thread.id),
    })));
  }

  async function selectThread(id) {
    state.current = id;
    state.view = null;
    state.wasRunning = false;
    closeSocket();
    renderThreads();
    $("app").classList.add("viewing");
    state.stickNext = true;
    $("log").replaceChildren(el("div", "empty", "加载中…"));
    $("requests").replaceChildren();
    try {
      const view = await api("GET", `/threads/${id}`);
      if (state.current !== id) return;
      applyView(view);
      if (view.live) connectSocket(id);
      loadOptions(id);
    } catch (error) {
      $("log").replaceChildren(el("div", "empty", `读取失败：${error.message}`));
    }
  }

  function closeSocket() {
    if (state.socket) {
      state.socket.onclose = null;
      state.socket.close();
      state.socket = null;
    }
    clearInterval(state.poller);
    state.poller = null;
  }

  // 有的手机浏览器对自签证书的 wss 不放行（页面本身已信任也一样），连不上就改成轮询。
  let socketFailures = 0;

  function startPolling(id) {
    clearInterval(state.poller);
    state.poller = setInterval(async () => {
      if (state.current !== id || state.busy) return;
      try {
        const view = await api("GET", `/threads/${id}`);
        if (state.current === id) applyView(view);
      } catch {}
    }, 1500);
  }

  function connectSocket(id) {
    closeSocket();
    if (socketFailures >= 2) return startPolling(id);
    const scheme = location.protocol === "https:" ? "wss" : "ws";
    const socket = new WebSocket(`${scheme}://${location.host}/api/threads/${id}/stream?token=${encodeURIComponent(token)}`);
    let opened = false;
    state.socket = socket;
    socket.onopen = () => { opened = true; socketFailures = 0; };
    socket.onmessage = (event) => {
      const message = JSON.parse(event.data);
      if (state.current !== id) return;
      if (message.type === "view") applyView(message.view);
      else if (message.type === "revoked") unauthorized(message.reason);
      else if (message.type === "closed" && message.reconnect) {
        // 推送来源换了（例如后台会话转到桌面）：重连一次就接到新的来源。
        state.socket.onclose = null;
        state.socket = null;
        setTimeout(() => state.current === id && !state.socket && !state.poller && connectSocket(id), 600);
      } else if (message.type === "closed" || message.type === "error") {
        toast(message.reason || message.error || "实时连接已断开");
        if (state.view) applyView({ ...state.view, live: false, requests: [] });
      }
    };
    socket.onclose = () => {
      if (state.socket !== socket) return;
      state.socket = null;
      if (!opened) socketFailures += 1;
      if (state.current === id && state.view?.live) setTimeout(() => state.current === id && !state.socket && !state.poller && connectSocket(id), 1500);
    };
  }

  function nearBottom(node) {
    return node.scrollHeight - node.scrollTop - node.clientHeight < 80;
  }

  function applyView(view) {
    state.view = view;
    $("title").textContent = view.title || "（未命名）";
    const running = view.runtime === "active";
    const badge = $("state");
    badge.className = `badge${running ? " running" : view.live ? " live" : ""}`;
    // 后台会话：在这台电脑后台跑，桌面窗口不切换；随时可以点「在桌面打开」接过去。
    const background = !!view.headless;
    badge.textContent = running ? (background ? "后台运行中" : "运行中") : background ? "后台" : view.live ? "已在桌面打开" : "未打开";
    badge.title = background ? "在这台电脑的后台运行，桌面 Codex 不会切到这个会话" : "";
    $("open").hidden = (view.live && !background) || !can("message");
    $("interrupt").hidden = !running || !can("message");
    watchForAttention(view);
    $("input").disabled = false;
    $("send").disabled = false;
    $("send").textContent = running ? "插话" : "发送";
    const log = $("log");
    const stick = nearBottom(log) || state.stickNext;
    state.stickNext = false;
    const nodes = [];
    if (view.truncatedTurns) nodes.push(el("div", "note", `更早的 ${view.truncatedTurns} 轮未显示`));
    for (const turn of view.turns || []) nodes.push(renderTurn(turn));
    if (!nodes.length) nodes.push(el("div", "empty", "还没有消息"));
    // 最后一条不是助手消息时才补「正在处理…」，免得和流式气泡重复。
    const lastItems = view.turns?.at(-1)?.items || [];
    if (running && lastItems.at(-1)?.type !== "agentMessage") nodes.push(typingRow());
    log.replaceChildren(...nodes);
    if (stick) log.scrollTop = log.scrollHeight;
    renderRequests(view.requests || []);
    renderControls();
    m.onView();
  }

  const effortLabels = { none: "不推理", minimal: "最低", low: "低", medium: "中", high: "高", xhigh: "极高", max: "Max", ultra: "Ultra" };

  async function loadOptions(id) {
    try {
      const options = await api("GET", `/threads/${id}/options`);
      if (state.current !== id) return;
      state.options = options;
      state.optionsFor = id;
      renderControls();
      m.onView();
    } catch (error) {
      toast(`读取可选模型失败：${error.message}`);
    }
  }

  function option(value, label, selected) {
    const node = el("option", "", label);
    node.value = value;
    if (selected) node.selected = true;
    return node;
  }

  function renderControls() {
    const box = $("controls");
    const options = state.optionsFor === state.current ? state.options : null;
    if (!options || !state.view) { box.hidden = true; return; }
    box.hidden = false;
    const current = state.view.controls || options.current || {};
    const models = [...options.models];
    if (current.model && !models.some((model) => model.id === current.model)) models.unshift({ id: current.model, label: current.model, efforts: [] });
    $("model").replaceChildren(...models.map((model) => option(model.id, model.label || model.id, model.id === current.model)));
    if (!current.model) $("model").prepend(option("", "模型", true));
    const model = models.find((item) => item.id === current.model);
    const efforts = model?.efforts?.length ? model.efforts : ["low", "medium", "high"];
    $("effort").replaceChildren(
      option("", `默认推理${model?.defaultEffort ? `（${effortLabels[model.defaultEffort] || model.defaultEffort}）` : ""}`, !current.effort),
      ...efforts.map((effort) => option(effort, `推理：${effortLabels[effort] || effort}`, effort === current.effort)),
    );
    const permissions = options.permissionModes.map((mode) => option(mode.id, mode.label, mode.id === current.permissionMode));
    if (!current.permissionMode || current.permissionMode === "custom") {
      permissions.unshift(option("custom", current.permissionMode ? "自定义权限" : "沿用会话权限", true));
    }
    $("permission").replaceChildren(...permissions);
    $("permission").title = options.permissionModes.find((mode) => mode.id === current.permissionMode)?.detail || "权限";
    $("permission").classList.toggle("danger", current.permissionMode === "full-access");
    const plan = current.collaborationMode === "plan";
    $("plan").classList.toggle("on", plan);
    $("plan").textContent = plan ? "计划模式：开" : "计划";
    for (const id of ["model", "effort", "permission", "plan"]) $(id).disabled = state.applying || !can("full");
    box.title = can("full") ? "" : "改模型与权限需要「完全控制」权限";
  }

  async function changeSettings(change, confirmText) {
    if (!state.current || state.applying) return;
    if (confirmText && !confirm(confirmText)) { renderControls(); return; }
    state.applying = true;
    renderControls();
    try {
      const view = await api("POST", `/threads/${state.current}/settings`, change);
      applyView(view);
      if (!state.socket && !state.poller) connectSocket(state.current);
    } catch (error) {
      toast(error.message);
    } finally {
      state.applying = false;
      renderControls();
      m.onView();
    }
  }

  /** 一条消息：头像 + 气泡（头像只在聊天样式里显示，Codex 样式里等同于整段文字）。 */
  function bubble(role, text, extra = "") {
    const node = el("div", `msg ${role}${extra ? ` ${extra}` : ""}`);
    node.append(el("div", "avatar", role === "user" ? "我" : "C"));
    node.append(el("div", "bubble", text));
    return node;
  }

  function renderTurn(turn) {
    const box = el("div", "turn");
    for (const item of turn.items || []) {
      switch (item.type) {
        case "userMessage": box.append(bubble("user", item.text || "")); break;
        case "steeringUserMessage": box.append(el("div", "msg steer", `插话：${item.text || ""}`)); break;
        case "agentMessage": if (item.text) box.append(bubble("agent", item.text)); break;
        case "commandExecution": {
          const details = el("details", "cmd");
          const status = { completed: "✓", failed: "✗", declined: "已拒绝", inProgress: "…" }[item.status] || item.status || "";
          details.append(el("summary", "", `${status} ${item.command || ""}`));
          if (item.aggregatedOutput) details.append(el("pre", "", item.aggregatedOutput));
          box.append(details);
          break;
        }
        case "fileChange": {
          const files = (item.changes || []).map((change) => change.path).filter(Boolean).join("\n");
          box.append(el("div", "cmd", `改动文件 ${item.status || ""}\n${files}`));
          break;
        }
        case "userInputResponse": box.append(el("div", "note", "已回答提问")); break;
        case "modelChanged": box.append(el("div", "note", `模型已从 ${item.fromModel || "?"} 切换为 ${item.toModel || "?"}`)); break;
        case "contextCompaction": box.append(el("div", "note", "已压缩上下文")); break;
        case "webSearch": box.append(el("div", "note", `搜索：${item.query || ""}`)); break;
        case "reasoning": case "steered": case "hookRun": break;
        default: if (item.type) box.append(el("div", "note", `[${item.type}]`));
      }
    }
    if (turn.status === "interrupted") box.append(el("div", "note", "已中断"));
    if (turn.status === "failed") box.append(el("div", "note", "这一轮失败了"));
    return box;
  }

  /** 运行中的「正在处理…」气泡，放在最后一边流式输出一边提示。 */
  function typingRow() {
    const node = bubble("agent", "正在处理", "typing");
    return node;
  }

  function renderRequests(requests) {
    const box = $("requests");
    box.replaceChildren(...requests.map(renderRequest));
  }

  function renderRequest(request) {
    const card = el("div", "request");
    const params = request.params || {};
    const actions = el("div", "actions");
    const respond = async (body, button) => {
      for (const b of actions.querySelectorAll("button")) b.disabled = true;
      state.stickNext = true;
      try {
        await api("POST", `/threads/${state.current}/requests/${encodeURIComponent(JSON.stringify(request.id))}`, body);
      } catch (error) {
        toast(error.message);
        for (const b of actions.querySelectorAll("button")) b.disabled = false;
      }
    };
    if (request.method === "item/commandExecution/requestApproval" || request.method === "item/fileChange/requestApproval") {
      const isCommand = request.method.includes("commandExecution");
      card.append(el("strong", "", isCommand ? "请求执行命令" : "请求修改文件"));
      if (params.reason) card.append(el("div", "", params.reason));
      if (isCommand) card.append(el("code", "", `${params.command || ""}\n# ${params.cwd || ""}`));
      const decisions = params.availableDecisions || ["accept", "decline"];
      const labels = { accept: "同意", acceptForSession: "本会话都同意", decline: "拒绝", cancel: "取消这一轮" };
      for (const decision of decisions) {
        if (typeof decision !== "string") continue;
        const button = el("button", decision === "accept" ? "primary" : decision === "decline" || decision === "cancel" ? "danger" : "", labels[decision] || decision);
        button.onclick = () => respond({ decision }, button);
        actions.append(button);
      }
      if (!decisions.includes("decline")) {
        const button = el("button", "danger", "拒绝");
        button.onclick = () => respond({ decision: "decline" }, button);
        actions.append(button);
      }
    } else if (request.method === "item/tool/requestUserInput") {
      card.append(el("strong", "", "模型在提问"));
      const answers = {};
      for (const question of params.questions || []) {
        card.append(el("div", "", question.question || question.header || ""));
        const row = el("div", "actions");
        for (const option of question.options || []) {
          const button = el("button", "", option.label);
          if (option.description) button.title = option.description;
          button.onclick = () => {
            answers[question.id] = { answers: [option.label] };
            for (const b of row.querySelectorAll("button")) b.classList.toggle("primary", b === button);
          };
          row.append(button);
        }
        if (question.isOther !== false) {
          const other = el("input");
          other.placeholder = "其他答案";
          other.oninput = () => { answers[question.id] = { answers: [other.value] }; };
          row.append(other);
        }
        card.append(row);
      }
      const submit = el("button", "primary", "提交回答");
      submit.onclick = () => respond({ answers }, submit);
      actions.append(submit);
    } else {
      card.append(el("strong", "", "需要在桌面处理的请求"));
      card.append(el("code", "", request.method));
    }
    if (!can("full")) {
      actions.replaceChildren(el("span", "readonly", "审批与回答需要「完全控制」权限，可在 Codex++ 的设备列表里调整。"));
    }
    card.append(actions);
    return card;
  }

  async function send() {
    const text = $("input").value.trim();
    if (!text || !state.current || state.busy) return;
    state.busy = true;
    state.stickNext = true;
    $("send").disabled = true;
    try {
      await api("POST", `/threads/${state.current}/messages`, { text });
      $("input").value = "";
      if (!state.socket && !state.poller) {

  $("send").onclick = send;
  $("model").onchange = () => changeSettings({ model: $("model").value });
  $("effort").onchange = () => changeSettings({ effort: $("effort").value || null });
  $("permission").onchange = () => {

  };
  $("plan").onclick = () => {

  $("back").onclick = () => { $("app").classList.remove("viewing"); closeSocket(); state.current = null; renderThreads(); };
  // 桌面样式下图标栏一直可见，会话开着时也能点：一并退出会话，回到项目列表。
  $("projectBack").onclick = () => {
    $("app").classList.remove("viewing");
    closeSocket();
    state.current = null;
    state.project = null;
    renderThreads();
  };
  $("open").onclick = async () => {
    try {
      toast("正在桌面打开会话…");
      const view = await api("POST", `/threads/${state.current}/open`);
      applyView(view);
      connectSocket(state.current);
    } catch (error) { toast(error.message); }
  };
  $("interrupt").onclick = async () => {
    try { await api("POST", `/threads/${state.current}/interrupt`); } catch (error) { toast(error.message); }
  };
  $("create").onclick = async () => {
    // 项目里的新建会话用该项目的目录；项目列表上新建要手填目录。
    const cwd = state.project !== null ? state.project : $("newCwd").value.trim();
    if (!cwd) return toast("先填工作目录");
    $("create").disabled = true;
    try {
      toast("正在新建会话…");
      const data = await api("POST", "/threads", { cwd, name: $("newName").value.trim() || undefined });
      $("newName").value = "";
      await loadThreads();
      await selectThread(data.threadId);
    } catch (error) {
      toast(error.message);
    } finally {
      $("create").disabled = false;
    }
  };

  // ================= 桌面镜像 =================
  // 把 Codex 桌面窗口的画面投过来（服务端经 CDP 投屏），鼠标 / 触摸 / 滚轮 / 按键发回去。
  // 输入法用本机的：隐藏输入框收字，拼完的文字整段发过去（Input.insertText），回车退格等单独作为按键发。
  const MIRROR_BACK_KEY = "codexPlusRemoteStyleBeforeMirror";
  const mirror = (() => {
    const SENTINEL = "​"; // 输入框里常驻一个零宽字符：手机键盘在空输入框上按退格不发事件
    const SPECIAL = new Set(["Enter", "Backspace", "Delete", "Tab", "Escape", "ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "Home", "End", "PageUp", "PageDown"]);
    const KEYCODES = { Enter: 13, Backspace: 8, Delete: 46, Tab: 9, Escape: 27, ArrowLeft: 37, ArrowUp: 38, ArrowRight: 39, ArrowDown: 40, Home: 36, End: 35, PageUp: 33, PageDown: 34 };
    const s = { socket: null, active: false, meta: null, title: "", composing: false, touch: null, moveQueued: null, resizeTimer: null, retryTimer: null, keyboard: false };
    const canvas = $("mirrorCanvas");
    const context = canvas.getContext("2d");
    const input = $("mirrorInput");

    function status(text, tone = "") {
      $("mirrorStatus").textContent = text;
      $("mirrorDot").className = `dot ${tone}`;
    }
    function tip(text) {
      $("mirrorTip").hidden = !text;
      $("mirrorTip").textContent = text || "";
    }

    const modifiersOf = (event) => (event.altKey ? 1 : 0) | (event.ctrlKey ? 2 : 0) | (event.metaKey ? 4 : 0) | (event.shiftKey ? 8 : 0);

    function requestFrames() {
      const stage = $("mirrorStage");
      // 高分屏要的像素多、每帧大：长边最多 1920，够看清字，带宽少一半以上。
      const ratio = Math.min(window.devicePixelRatio || 1, 2, 1920 / Math.max(stage.clientWidth, stage.clientHeight, 1));
      send({ type: "start", width: Math.round(stage.clientWidth * ratio), height: Math.round(stage.clientHeight * ratio) });

    let decoding = false;
    let pendingFrame = null;
    async function drawFrame(blob) {
      if (decoding) {
        pendingFrame = blob;
        return;
      }
      decoding = true;
      try {
        const bitmap = await createImageBitmap(blob);
        if (canvas.width !== bitmap.width || canvas.height !== bitmap.height) {
          canvas.width = bitmap.width;
          canvas.height = bitmap.height;
        }
        context.drawImage(bitmap, 0, 0);
        bitmap.close?.();
        tip("");
      } catch {}
      decoding = false;
      if (pendingFrame) {
        const next = pendingFrame;
        pendingFrame = null;
        drawFrame(next);
      }

        if (s.socket !== socket) return;
        if (typeof event.data !== "string") {
          drawFrame(event.data);
          return;
        }

        if (message.type === "ready") {
          s.title = message.title || "Codex";
          status(`已连接 · ${s.title}`, "on");

          s.meta = message.meta;
        } else if (message.type === "visibility") {
          tip(message.visible ? "" : "Codex 暂时没有出画面，稍等一下；一直没有的话，在电脑上把 Codex 窗口点出来一次。");

          toast(message.error);
        } else if (message.type === "revoked") {
          stop();
          unauthorized(message.reason);
        } else if (message.type === "error") {
          status("连接失败", "off");
          tip(message.error);
          s.socket = null;
        } else if (message.type === "closed") {

        if (s.socket !== socket) return;
        s.socket = null;
        if (s.active) {

    function start() {
      if (s.active) return;
      s.active = true;
      input.value = SENTINEL;

      if (!matchMedia("(pointer: coarse)").matches) focusInput();

    function stop() {
      s.active = false;
      clearTimeout(s.retryTimer);
      const socket = s.socket;
      s.socket = null;
      if (socket) { socket.onclose = null; socket.close(); }
      input.blur();
      hideIme();
    }

    function focusInput() {
      input.focus({ preventScroll: true });
      input.setSelectionRange(input.value.length, input.value.length);
    }

    // ---------- 坐标：画布上的点 → Codex 页面里的点（CSS 像素）----------
    function point(event) {
      const rect = canvas.getBoundingClientRect();
      const width = s.meta?.deviceWidth || canvas.width;
      const height = s.meta?.deviceHeight || canvas.height;
      const x = ((event.clientX - rect.left) / rect.width) * width;
      const y = ((event.clientY - rect.top) / rect.height) * height + (s.meta?.offsetTop || 0);
      return { x: Math.max(0, Math.min(width, x)), y: Math.max(0, y), scale: width / rect.width };

    const buttonOf = (button) => ["left", "middle", "right"][button] || "none";

    canvas.addEventListener("pointerdown", (event) => {
      event.preventDefault();

      const { x, y } = point(event);
      if (event.pointerType === "mouse") {
        send({ type: "mouse", event: "mousePressed", x, y, button: buttonOf(event.button), buttons: event.buttons, clickCount: event.detail || 1, modifiers: modifiersOf(event) });

          requestAnimationFrame(() => {
            s.moveScheduled = false;

            if (!last) return;
            const { x, y } = point(last);

        return;

      s.touch = null;
      if (!touch || touch.moved) return;

    // ---------- 键盘与输入法 ----------
    /** macOS 上 Cmd / Option 组合键要带编辑命令，Codex 里才会执行（全选、撤销、按词移动……）。 */
    function commandsFor(event) {
      const key = event.key.length === 1 ? event.key.toLowerCase() : event.key;
      const shift = event.shiftKey;
      if (event.metaKey && !event.altKey) {

          ArrowLeft: [shift ? "moveToBeginningOfLineAndModifySelection" : "moveToBeginningOfLine"],
          ArrowRight: [shift ? "moveToEndOfLineAndModifySelection" : "moveToEndOfLine"],
          ArrowUp: ["moveToBeginningOfDocument"], ArrowDown: ["moveToEndOfDocument"],
          Backspace: ["deleteToBeginningOfLine"],

        const map = {
          ArrowLeft: [shift ? "moveWordLeftAndModifySelection" : "moveWordLeft"],
          ArrowRight: [shift ? "moveWordRightAndModifySelection" : "moveWordRight"],
          Backspace: ["deleteWordBackward"], Delete: ["deleteWordForward"],

      send({ type: "key", ...down, key, code, keyCode, modifiers, ...(commands ? { commands } : {}) });
      send({ type: "key", event: "keyUp", key, code, keyCode, modifiers });

    input.addEventListener("keydown", (event) => {
      if (event.isComposing || event.keyCode === 229 || s.composing) return;

      if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "v") return;

    });

    function flush() {

      input.value = SENTINEL;
      input.setSelectionRange(1, 1);
      if (value === "") return pressKey("Backspace"); // 零宽字符被删了 = 按了退格

      text.split(/\r?\n/).forEach((line, index) => {
        if (index > 0) pressKey("Enter");
        if (line) send({ type: "text", text: line });
      });
    }
    input.addEventListener("input", (event) => {
      if (s.composing || event.isComposing) {
        showIme(input.value.split(SENTINEL).join(""));
        return;
      }
      flush();
    });

    input.addEventListener("compositionupdate", (event) => showIme(event.data || ""));
    input.addEventListener("compositionend", () => {
      s.composing = false;
      hideIme();
      flush();
    });

      event.preventDefault();
      const text = event.clipboardData?.getData("text/plain");

    });

      $("mirrorIme").hidden = !text;
      $("mirrorIme").textContent = text;
    }
    function hideIme() { $("mirrorIme").hidden = true; }

    // ---------- 工具栏 ----------
    $("mirrorKeyboard").onclick = () => {
      s.keyboard = !s.keyboard;
      $("mirrorKeyboard").classList.toggle("on", s.keyboard);

  })();

  // ================= 手机界面（聊天样式）=================
  // 四屏：列表（项目）/ 项目（会话）/ 对话 / 设置。和 Codex 样式共用 state、接口和推送，只是另一套呈现。
  const m = (() => {
    const SEEN_KEY = "codexPlusRemoteSeen";
    const ui = { screen: "list", from: "list", project: null, filter: "all", query: "", stick: false, expanded: new Set(), requestCards: new Map() };
    const palette = ["#c8574d", "#3f9a8c", "#c98a3a", "#5677b8", "#8b62b3", "#55995a", "#b9567f", "#5f8ea6", "#a0784f"];
    const coarse = window.matchMedia?.("(pointer: coarse)").matches ?? false;
    const isChat = () => document.documentElement.dataset.style === "chat";
    const svg = (d, attrs = "") => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"${attrs}>${d}</svg>`;
    const ICON = {
      send: svg('<path d="M12 19V5M5 12l7-7 7 7"/>', ' stroke-width="2.4"'),
      stop: svg('<rect x="7" y="7" width="10" height="10" rx="1.5" fill="currentColor"/>'),
      // 无限符号：对应 Codex 手机端的「∞ Agent」。
      agent: svg('<path d="M6.5 15.5a3.5 3.5 0 1 1 0-7c3 0 8 7 11 7a3.5 3.5 0 1 0 0-7c-3 0-8 7-11 7Z"/>'),
      plan: svg('<path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/>'),
      shield: svg('<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/><path d="M12 8v4M12 16h.01"/>'),
      spark: svg('<path d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6 5.6 18.4"/>'),
      bot: svg('<path d="m7 9 3 3-3 3M13 15h4"/>', ' stroke-width="2.2"'),
      file: svg('<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6"/>'),
      folder: svg('<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/>'),
    };
    // 附件：上传到这台电脑的上传目录，发消息时带上路径。
    ui.pending = [];
    const rawUrl = (path) => `/api/uploads/raw?path=${encodeURIComponent(path)}&token=${encodeURIComponent(token)}`;

    // ---------- 未读：每个会话上次看到时的 updatedAt，存在本机 ----------
    let seen = null;
    try { seen = JSON.parse(localStorage.getItem(SEEN_KEY) || "null"); } catch {}
    const saveSeen = () => { try { localStorage.setItem(SEEN_KEY, JSON.stringify(seen)); } catch {} };
    function markSeen(id) {
      if (!id) return;
      seen = seen || {};
      seen[id] = Math.floor(Date.now() / 1000) + 1;
      saveSeen();
    }
    function initSeen(threads) {
      if (seen) return;
      // 第一次打开：已有的会话都算看过，免得满屏红点。
      seen = {};
      for (const thread of threads) seen[thread.id] = Number(thread.updatedAt) || 0;
      saveSeen();
    }
    const unread = (thread) => !!seen && thread.id !== state.current && (Number(thread.updatedAt) || 0) > (seen[thread.id] || 0);

    // ---------- 小工具 ----------
    const hash = (text) => { let value = 7; for (const ch of String(text)) value = (value * 31 + ch.codePointAt(0)) >>> 0; return value; };
    const colorOf = (key) => palette[hash(key) % palette.length];
    const firstChar = (text) => { const ch = [...String(text || "").trim()][0] || "#"; return /[a-z]/i.test(ch) ? ch.toUpperCase() : ch; };
    const pad = (value) => String(value).padStart(2, "0");
    /** 微信式时间：今天 时:分；昨天；本周 周几；今年 几月几日；更早 年月日。 */
    function chatTime(seconds, withClock = false) {
      if (!seconds) return "";
      const date = new Date(seconds * 1000);
      const now = new Date();
      const clock = `${pad(date.getHours())}:${pad(date.getMinutes())}`;
      const dayStart = (value) => new Date(value.getFullYear(), value.getMonth(), value.getDate()).getTime();
      const days = Math.round((dayStart(now) - dayStart(date)) / 86400000);
      if (days <= 0) return clock;
      let day;
      if (days === 1) day = "昨天";

      else day = `${date.getFullYear()}年${date.getMonth() + 1}月${date.getDate()}日`;

    }
    const formatTokens = (value) => (value >= 1e6 ? `${+(value / 1e6).toFixed(value % 1e6 ? 1 : 0)}M` : value >= 1e3 ? `${Math.round(value / 1e3)}K` : String(value));
    const roleText = (role) => ({ view: "只能查看", message: "可发消息", full: "完全控制" }[role] || role || "");

    /** 头像：一个会话用单字方块；多个会话按微信群头像的排法拼九宫格，每格是会话标题的首字。 */
    function avatarNode(tiles, { badge = 0, dot = false } = {}) {
      const box = el("div", "m-avatar");
      const face = el("div", "face");
      if (tiles.length === 1) {
        face.classList.add("single");
        face.style.background = colorOf(tiles[0].key);
        face.textContent = tiles[0].char;
      } else {
        const count = Math.min(tiles.length, 9);
        const layout = { 2: [2], 3: [1, 2], 4: [2, 2], 5: [2, 3], 6: [3, 3], 7: [1, 3, 3], 8: [2, 3, 3], 9: [3, 3, 3] }[count];
        const columns = count <= 4 ? 2 : 3;
        const size = Math.floor((48 - 4 - 2 * (columns - 1)) / columns);
        let index = 0;
        for (const perRow of layout) {
          const row = el("div", "grid-row");
          for (let k = 0; k < perRow; k += 1, index += 1) {
            const tile = el("div", "tile", tiles[index].char);
            Object.assign(tile.style, { width: `${size}px`, height: `${size}px`, background: colorOf(tiles[index].key), fontSize: `${Math.round(size * 0.6)}px` });
            row.append(tile);
          }
          face.append(row);
        }
      }
      box.append(face);
      if (badge) box.append(el("b", "badge", badge > 99 ? "99+" : String(badge)));
      else if (dot) box.append(el("b", "badge dot"));
      return box;
    }

    function rowNode({ avatar, title, sub, time, active, onClick }) {
      const row = el("div", `m-row${active ? " active" : ""}`);
      const body = el("div", "m-row-body");
      const head = el("div", "m-row-head");
      head.append(el("div", "m-row-title", title), el("div", "m-row-time", time));
      const subLine = el("div", "m-row-sub");
      subLine.append(...sub);
      body.append(head, subLine);
      row.append(avatar, body);
      row.onclick = onClick;
      return row;

    const byRecent = (a, b) => (Number(b.updatedAt) || 0) - (Number(a.updatedAt) || 0);
    const threadTitle = (thread) => thread.title || thread.preview || "（未命名）";

    function filteredThreads() {
      const query = ui.query.trim().toLowerCase();
      return state.threads.filter((thread) => {
        if (ui.filter === "running" && !isRunning(thread)) return false;
        if (ui.filter === "unread" && !unread(thread)) return false;
        return !query || [thread.title, thread.preview, thread.cwd].some((value) => String(value || "").toLowerCase().includes(query));
      });
    }

    function setBackCount(id, count) {
      const node = $(id);
      node.hidden = !count;
      node.textContent = count > 99 ? "99+" : String(count);
    }

    // ---------- 列表（项目）----------
    function renderList() {
      const rows = $("mRows");
      const total = state.threads.filter(unread).length;
      $("mTabBadge").hidden = !total;
      $("mTabBadge").textContent = total > 99 ? "99+" : String(total);
      if (!state.threads.length) return rows.replaceChildren(el("div", "m-empty", "还没有会话。点右上角 ⊕ 新建一个。"));
      const threads = filteredThreads();
      if (!threads.length) return rows.replaceChildren(el("div", "m-empty", ui.query ? "没有匹配的会话" : "没有符合筛选的会话"));
      rows.replaceChildren(...projectsOf(threads).map((project) => {
        const sessions = [...project.threads].sort(byRecent);
        const single = sessions.length === 1;
        const tiles = single
          ? [{ char: firstChar(project.name), key: project.cwd || project.name }]
          : sessions.slice(0, 9).map((thread) => ({ char: firstChar(threadTitle(thread)), key: thread.id }));
        const sub = [];
        if (project.running) sub.push(el("span", "running", `${project.running} 个运行中 · `));
        sub.push(document.createTextNode(threadTitle(sessions[0])));
        return rowNode({
          avatar: avatarNode(tiles, { badge: sessions.filter(unread).length }),
          title: single ? project.name : `${project.name}（${sessions.length}）`,
          sub,
          time: chatTime(project.updatedAt),
          // 只有一个会话的项目直接进对话（和微信单聊一样）。
          onClick: () => (single ? openChat(sessions[0].id, "list") : openProject(project.cwd)),
        });
      }));

    // ---------- 项目（会话）----------
    function renderProject() {
      if (ui.project === null) return;
      const sessions = state.threads.filter((thread) => (thread.cwd || "") === ui.project).sort(byRecent);
      $("mProjectTitle").textContent = `${baseName(ui.project)}（${sessions.length}）`;
      setBackCount("mProjectBackCount", state.threads.filter((thread) => unread(thread) && (thread.cwd || "") !== ui.project).length);
      $("mProjectNew").hidden = !can("message");
      const rows = $("mProjectRows");
      if (!sessions.length) return rows.replaceChildren(el("div", "m-empty", "这个项目还没有会话"));
      rows.replaceChildren(...sessions.map((thread) => {
        const sub = [];
        if (isRunning(thread)) sub.push(el("span", "running", "运行中 · "));
        sub.push(document.createTextNode(thread.preview && thread.preview !== thread.title ? thread.preview : relative(thread.updatedAt)));
        return rowNode({
          avatar: avatarNode([{ char: firstChar(threadTitle(thread)), key: thread.id }], { dot: unread(thread) }),

          active: thread.id === state.current,
          onClick: () => openChat(thread.id, "project"),

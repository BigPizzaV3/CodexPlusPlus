    // ---------- 对话 ----------
    function msgNode(direction, content) {
      const node = el("div", `m-msg ${direction}`);
      const who = el("div", "who");
      if (direction === "out") who.textContent = "我";
      else who.innerHTML = ICON.bot;
      node.append(who, content);
      return node;
    }

    /** 文字气泡：认 ``` 代码块和 `行内代码`，其余原样（不解析 HTML）。 */
    function textBubble(text, tag) {
      const node = el("div", "m-bubble");
      if (tag) node.append(el("span", "tag", tag));
      String(text || "").split(/```[^\n]*\n?/).forEach((part, index) => {
        if (!part) return;
        if (index % 2 === 1) return node.append(el("pre", "", part.replace(/\n$/, "")));
        const trimmed = index > 0 ? part.replace(/^\n/, "") : part;
        for (const segment of trimmed.split(/(`[^`\n]+`)/)) {
          if (/^`[^`]+`$/.test(segment)) node.append(el("code", "", segment.slice(1, -1)));
          else if (segment) node.append(document.createTextNode(segment));
        }
      });
      return node;
    }

    /** 消息里的图片 / 文件。上传目录里的图片能取原图；别处的（比如桌面上粘贴的）只显示占位。 */
    function attachmentNode(attachment) {
      if (attachment.kind === "image") {
        const box = el("div", "m-photo");
        const src = attachment.path ? rawUrl(attachment.path) : attachment.url && /^(data:image|https?:)/.test(attachment.url) ? attachment.url : null;
        if (!src) {
          box.classList.add("missing");
          box.textContent = "[图片]";
          return box;
        }
        const img = el("img");
        img.alt = attachment.name || "图片";
        img.loading = "lazy";
        img.src = src;
        img.onerror = () => { box.classList.add("missing"); box.replaceChildren(document.createTextNode("[图片]")); };
        // 图片加载出来会把内容撑高：原本在底部就继续贴着底部。
        img.onload = () => {
          const log = $("mLog");
          if (log.scrollHeight - log.scrollTop - log.clientHeight < img.clientHeight + 160) log.scrollTop = log.scrollHeight;
        };
        box.append(img);
        box.onclick = () => openViewer(src);
        return box;
      }
      const card = el("div", "m-file");
      card.innerHTML = ICON.file;
      card.append(el("span", "", attachment.name || "文件"));
      return card;
    }

    function openViewer(src) {
      const viewer = el("div", "m-viewer");
      const img = el("img");
      img.src = src;
      viewer.append(img);
      viewer.onclick = () => viewer.remove();
      $("m").append(viewer);
    }

    // ---------- 附件：选择、压缩、上传 ----------
    function pickFiles(accept, capture) {
      const input = document.createElement("input");
      input.type = "file";
      input.multiple = !capture;
      if (accept) input.accept = accept;
      if (capture) input.setAttribute("capture", capture);
      input.onchange = () => { for (const file of input.files || []) addPending(file); };
      input.click();
    }

    /** 大图先在手机上缩到长边 2048、转 JPEG，上传快，也省模型的上下文。 */
    async function shrinkImage(file) {
      if (!file.type.startsWith("image/") || file.type === "image/gif" || file.size < 1.5 * 1024 * 1024) return file;
      try {
        const bitmap = await createImageBitmap(file);
        const scale = Math.min(1, 2048 / Math.max(bitmap.width, bitmap.height));
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(bitmap.width * scale);
        canvas.height = Math.round(bitmap.height * scale);
        canvas.getContext("2d").drawImage(bitmap, 0, 0, canvas.width, canvas.height);
        const blob = await new Promise((resolve) => canvas.toBlob(resolve, "image/jpeg", 0.85));
        if (!blob || blob.size >= file.size) return file;
        return new File([blob], file.name.replace(/\.[^.]+$/, "") + ".jpg", { type: "image/jpeg" });
      } catch {
        return file;
      }
    }

    function upload(file, onProgress) {
      return new Promise((resolve, reject) => {
        const request = new XMLHttpRequest();
        request.open("POST", "/api/uploads");
        request.setRequestHeader("Authorization", `Bearer ${token}`);
        request.setRequestHeader("Content-Type", file.type || "application/octet-stream");
        request.setRequestHeader("X-File-Name", encodeURIComponent(file.name || "file"));
        request.upload.onprogress = (event) => event.lengthComputable && onProgress(event.loaded / event.total);
        request.onload = () => {
          let payload = {};
          try { payload = JSON.parse(request.responseText); } catch {}
          if (request.status === 401) unauthorized(payload.error);
          if (payload.ok) resolve(payload.data);
          else reject(new Error(payload.error || `HTTP ${request.status}`));
        };
        request.onerror = () => reject(new Error("上传失败，检查网络"));
        request.send(file);
      });
    }

    async function addPending(original) {
      if (ui.pending.length >= 9) return toast("一次最多带 9 个附件");
      const isImage = original.type.startsWith("image/");
      const entry = { key: Math.random().toString(36).slice(2), name: original.name || "文件", kind: isImage ? "image" : "file", status: "uploading", progress: 0,
        preview: isImage ? URL.createObjectURL(original) : null };
      ui.pending.push(entry);
      renderAttach();
      try {
        const file = await shrinkImage(original);
        const data = await upload(file, (ratio) => { entry.progress = ratio; renderAttach(); });
        Object.assign(entry, { status: "ready", path: data.path, name: data.name, kind: data.kind });
      } catch (error) {
        entry.status = "error";
        toast(`${entry.name}：${error.message}`);
      }
      renderAttach();
    }

    function removePending(key) {
      const entry = ui.pending.find((item) => item.key === key);
      if (entry?.preview) URL.revokeObjectURL(entry.preview);
      ui.pending = ui.pending.filter((item) => item.key !== key);
      renderAttach();
    }

    function renderAttach() {
      const tray = $("mAttach");
      tray.hidden = !ui.pending.length;
      tray.replaceChildren(...ui.pending.map((entry) => {
        const item = el("div", `item ${entry.status}`);
        item.dataset.progress = `${Math.round(entry.progress * 100)}%`;
        if (entry.preview) {
          const img = el("img");
          img.src = entry.preview;
          item.append(img);
        } else {
          item.innerHTML = ICON.file;
          item.append(el("span", "name", entry.name));
        }
        const remove = el("button", "x", "×");
        remove.setAttribute("aria-label", "移除");
        remove.onclick = () => removePending(entry.key);
        item.append(remove);
        return item;
      }));
      renderComposer();
    }

    function openAttachSheet() {
      openSheet("", (body) => {
        body.append(
          optionButton({ label: "照片", detail: "从相册选，可多选", onClick: () => pickFiles("image/*") }),
          optionButton({ label: "拍照", onClick: () => pickFiles("image/*", "environment") }),
          optionButton({ label: "文件", detail: "代码、文档、日志等，Codex 会去读它", onClick: () => pickFiles("") }),
        );
      });
    }

    function typingBubble() {
      const node = el("div", "m-bubble typing");
      node.append(el("i"), el("i"), el("i"));
      return node;
    }

    function commandCard(item) {
      const card = el("div", "m-card");
      const [label, tone] = { completed: ["完成", "ok"], failed: ["失败", "bad"], declined: ["已拒绝", "bad"], inProgress: ["运行中", ""] }[item.status] || [item.status || "", ""];
      const head = el("div", "m-card-head");
      head.append(el("span", "", "⌘ 执行命令"), el("span", `state ${tone}`, label));
      const body = el("div", "m-card-body");
      body.append(el("code", "m-cmd", item.command || ""));
      if (item.aggregatedOutput) {
        const output = el("pre", "out", item.aggregatedOutput);
        const key = item.id || item.command;
        output.hidden = !ui.expanded.has(key);
        body.append(output);
        card.style.cursor = "pointer";
        card.onclick = () => {
          output.hidden = !output.hidden;
          if (output.hidden) ui.expanded.delete(key); else ui.expanded.add(key);
        };
      }
      card.append(head, body);
      return card;
    }

    function fileCard(item) {
      const card = el("div", "m-card");
      const files = (item.changes || []).map((change) => change.path).filter(Boolean);
      const head = el("div", "m-card-head");
      head.append(el("span", "", `✎ 改动了 ${files.length} 个文件`), el("span", "state", item.status === "completed" ? "已应用" : item.status || ""));
      const body = el("div", "m-card-body");
      body.append(el("code", "m-cmd", files.join("\n")));
      card.append(head, body);
      return card;
    }

    function turnNodes(turn) {
      const nodes = [];
      for (const item of turn.items || []) {
        switch (item.type) {
          case "userMessage":
            for (const attachment of item.attachments || []) nodes.push(msgNode("out", attachmentNode(attachment)));
            if (item.text || !(item.attachments || []).length) nodes.push(msgNode("out", textBubble(item.text)));
            break;
          case "steeringUserMessage": nodes.push(msgNode("out", textBubble(item.text, "插话"))); break;
          case "agentMessage": if (item.text) nodes.push(msgNode("in", textBubble(item.text))); break;
          case "commandExecution": nodes.push(msgNode("in", commandCard(item))); break;
          case "fileChange": nodes.push(msgNode("in", fileCard(item))); break;
          case "userInputResponse": nodes.push(el("div", "m-tip", "已回答提问")); break;
          case "modelChanged": nodes.push(el("div", "m-tip", `模型切换为 ${item.toModel || "?"}`)); break;
          case "contextCompaction": nodes.push(el("div", "m-tip", "已压缩上下文")); break;
          case "webSearch": nodes.push(el("div", "m-tip", `搜索：${item.query || ""}`)); break;
          default: break;
        }
      }
      if (turn.status === "interrupted") nodes.push(el("div", "m-tip", "已停止这一轮"));
      if (turn.status === "failed") nodes.push(el("div", "m-tip", "这一轮失败了"));
      return nodes;
    }

    /** 审批 / 提问卡片。同一个请求复用同一个节点，推送重绘时不丢已选的答案。 */
    function requestCard(request) {
      const key = `${state.current}:${JSON.stringify(request.id)}`;
      const cached = ui.requestCards.get(key);
      if (cached) return cached;
      const card = el("div", "m-card attention");
      const params = request.params || {};
      const foot = el("div", "m-card-foot");
      const respond = async (body) => {
        for (const button of card.querySelectorAll("button")) button.disabled = true;
        ui.stick = true;
        try {
          await api("POST", `/threads/${state.current}/requests/${encodeURIComponent(JSON.stringify(request.id))}`, body);
        } catch (error) {
          toast(error.message);
          for (const button of card.querySelectorAll("button")) button.disabled = false;
        }
      };
      const head = el("div", "m-card-head");
      const body = el("div", "m-card-body");
      if (request.method === "item/commandExecution/requestApproval" || request.method === "item/fileChange/requestApproval") {
        const isCommand = request.method.includes("commandExecution");
        head.append(el("span", "", isCommand ? "⌘ 请求执行命令" : "✎ 请求修改文件"));
        if (params.reason) body.append(el("div", "reason", params.reason));
        if (isCommand) body.append(el("code", "m-cmd", params.command || ""));
        const decisions = (params.availableDecisions || ["accept", "decline"]).filter((decision) => typeof decision === "string");
        if (!decisions.includes("decline") && !decisions.includes("cancel")) decisions.push("decline");
        const labels = { accept: "同意", acceptForSession: "本会话都同意", decline: "拒绝", cancel: "拒绝并停止" };
        for (const decision of decisions.slice(0, 3)) {
          const button = el("button", decision === "accept" ? "primary" : decision === "decline" || decision === "cancel" ? "danger" : "", labels[decision] || decision);
          button.onclick = (event) => { event.stopPropagation(); respond({ decision }); };
          foot.append(button);
        }
      } else if (request.method === "item/tool/requestUserInput") {
        head.append(el("span", "", "? 模型在提问"));
        const answers = {};
        for (const question of params.questions || []) {
          body.append(el("div", "reason", question.question || question.header || ""));
          const choices = el("div", "choices");
          for (const option of question.options || []) {
            const button = el("button", "", option.label);
            button.onclick = () => {
              answers[question.id] = { answers: [option.label] };
              for (const other of choices.querySelectorAll("button")) other.classList.toggle("on", other === button);
            };
            choices.append(button);
          }
          if (question.isOther !== false) {
            const input = el("input");
            input.placeholder = "其他答案";
            input.oninput = () => { answers[question.id] = { answers: [input.value] }; };
            choices.append(input);
          }
          body.append(choices);
        }
        const submit = el("button", "primary", "提交回答");
        submit.onclick = () => respond({ answers });
        foot.append(submit);
      } else {
        head.append(el("span", "", "需要在桌面处理"));
        body.append(el("code", "m-cmd", request.method));
      }
      card.append(head, body);
      card.append(can("full") ? foot : el("div", "readonly", "审批与回答需要「完全控制」权限"));
      ui.requestCards.set(key, card);
      return card;
    }

    function renderChat() {
      if (ui.screen !== "chat") return;
      const view = state.view;
      renderComposer();
      if (!view) return;
      markSeen(state.current);
      $("mChatTitle").textContent = view.title || "（未命名）";
      const running = view.runtime === "active";
      $("mChatState").textContent = running ? (view.headless ? "后台运行中…" : "运行中…") : view.headless ? "在后台运行，桌面不会切过来" : view.live ? "桌面已打开" : "";
      setBackCount("mChatBackCount", state.threads.filter(unread).length);
      const log = $("mLog");
      const stick = nearBottom(log) || ui.stick;
      ui.stick = false;
      const nodes = [];
      if (view.truncatedTurns) nodes.push(el("div", "m-tip", `更早的 ${view.truncatedTurns} 轮未显示`));
      let lastShown = 0;
      for (const turn of view.turns || []) {
        const ms = Number(turn.startedAtMs) || Number(turn.items?.[0]?.startedAtMs) || 0;
        if (ms && ms - lastShown > 5 * 60 * 1000) {
          nodes.push(el("div", "m-time-tip", chatTime(ms / 1000, true)));
          lastShown = ms;
        }
        nodes.push(...turnNodes(turn));
      }
      const lastItem = view.turns?.at(-1)?.items?.at(-1);
      if (running && lastItem?.type !== "agentMessage" && !(view.requests || []).length) nodes.push(msgNode("in", typingBubble()));
      const liveKeys = new Set();
      for (const request of view.requests || []) {
        liveKeys.add(`${state.current}:${JSON.stringify(request.id)}`);
        nodes.push(msgNode("in", requestCard(request)));
      }
      for (const key of [...ui.requestCards.keys()]) if (!liveKeys.has(key)) ui.requestCards.delete(key);
      if (!nodes.length) nodes.push(el("div", "m-empty", "还没有消息，发一条开始吧"));
      log.replaceChildren(...nodes);
      if (stick) log.scrollTop = log.scrollHeight;
    }

    // ---------- 输入区 ----------
    function autosize() {
      const input = $("mInput");
      input.style.height = "38px";
      input.style.height = `${Math.min(input.scrollHeight, 132)}px`;
    }

    function renderComposer() {
      const allowed = can("message");
      $("mComposer").hidden = !allowed;
      $("mReadonly").hidden = allowed;
      const running = state.view?.runtime === "active";
      const ready = ui.pending.filter((entry) => entry.status === "ready");
      const uploading = ui.pending.some((entry) => entry.status === "uploading");
      const hasText = !!$("mInput").value.trim() || ready.length > 0;
      $("mGo").disabled = uploading;
      const go = $("mGo");
      go.hidden = !hasText && !running;
      go.className = `go ${hasText ? "send" : "stop"}`;
      go.innerHTML = hasText ? ICON.send : ICON.stop;
      go.setAttribute("aria-label", hasText ? (running ? "插话" : "发送") : "停止");
      $("mInput").placeholder = running ? "运行中，发消息即插话…" : "发消息...";
      renderChips();
    }

    function chip(icon, label, tone, onClick) {
      const button = el("button", tone || "");
      button.innerHTML = icon;
      button.append(el("span", "", label));
      button.disabled = state.applying || !can("full");
      button.onclick = onClick;
      return button;
    }

    function currentControls() {
      const options = state.optionsFor === state.current ? state.options : null;
      return { options, current: state.view?.controls || options?.current || {} };
    }

    function renderChips() {
      const box = $("mChips");
      if (!state.view) return box.replaceChildren();
      const { options, current } = currentControls();
      const plan = current.collaborationMode === "plan";
      const mode = options?.permissionModes?.find((item) => item.id === current.permissionMode);
      const model = options?.models?.find((item) => item.id === current.model);
      const modelId = current.model || state.view.model;
      const modelLabel = model?.label || options?.models?.find((item) => item.id === modelId)?.label || modelId || "模型";
      const effort = current.effort ? effortLabels[current.effort] || current.effort : "";
      const chips = [
        chip(plan ? ICON.plan : ICON.agent, plan ? "计划" : "Agent", plan ? "on" : "", openModeSheet),
        chip(ICON.shield, mode?.label || (current.permissionMode === "custom" ? "自定义权限" : "沿用权限"), current.permissionMode === "full-access" ? "warn" : "", openPermissionSheet),
        chip(ICON.spark, effort ? `${modelLabel} · ${effort}` : modelLabel, "", openModelSheet),
      ];
      const usage = state.view.tokenUsage;
      if (usage?.window) {
        const ratio = Math.max(0, Math.min(1, usage.used / usage.window));
        const ring = el("div", "ring");
        const circumference = 2 * Math.PI * 7;
        ring.innerHTML = `<svg viewBox="0 0 18 18"><circle cx="9" cy="9" r="7" fill="none" stroke="currentColor" stroke-opacity=".25" stroke-width="2"/><circle cx="9" cy="9" r="7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-dasharray="${(ratio * circumference).toFixed(1)} ${circumference.toFixed(1)}" transform="rotate(-90 9 9)"/></svg>`;
        ring.append(el("span", "", `${formatTokens(usage.used)} / ${formatTokens(usage.window)}`));
        ring.title = "上下文用量";
        chips.push(ring);
      }
      box.replaceChildren(...chips);
    }

    async function send() {
      const text = $("mInput").value.trim();
      if (ui.pending.some((entry) => entry.status === "uploading")) return toast("附件还在上传…");
      const attachments = ui.pending.filter((entry) => entry.status === "ready").map(({ path, name, kind }) => ({ path, name, kind }));
      if (!text && !attachments.length) {
        if (state.view?.runtime === "active") await interrupt();
        return;
      }
      if (!state.current || state.busy) return;
      state.busy = true;
      ui.stick = true;
      $("mGo").disabled = true;
      try {
        await api("POST", `/threads/${state.current}/messages`, { text, attachments });
        $("mInput").value = "";
        for (const entry of ui.pending) if (entry.preview) URL.revokeObjectURL(entry.preview);
        ui.pending = [];
        renderAttach();
        autosize();
        if (!state.socket && !state.poller) connectSocket(state.current);
      } catch (error) {
        toast(error.message);
      } finally {
        state.busy = false;
        $("mGo").disabled = false;
        renderComposer();
      }
    }

    async function interrupt() {
      try { await api("POST", `/threads/${state.current}/interrupt`); } catch (error) { toast(error.message); }
    }

    async function openInDesktop() {
      try {
        toast("正在桌面打开会话…");
        const view = await api("POST", `/threads/${state.current}/open`);
        applyView(view);
        connectSocket(state.current);
      } catch (error) { toast(error.message); }
    }

    // ---------- 底部弹出菜单 ----------
    function closeSheet() { document.getElementById("mSheetMask")?.remove(); }
    function openSheet(title, build) {
      closeSheet();
      const mask = el("div", "m-mask");
      mask.id = "mSheetMask";
      const sheet = el("div", "m-sheet");
      if (title) sheet.append(el("div", "m-sheet-title", title));
      const body = el("div", "m-sheet-body");
      build(body);
      const cancel = el("button", "cancel", "取消");
      cancel.onclick = closeSheet;
      sheet.append(body, cancel);
      mask.append(sheet);
      mask.onclick = (event) => { if (event.target === mask) closeSheet(); };
      $("m").append(mask);
    }
    function optionButton({ label, detail, checked, danger, center, disabled, onClick }) {
      const button = el("button", `opt${danger ? " danger" : ""}${center ? " center" : ""}`);
      const text = el("span", "label");
      text.append(el("span", "", label));
      if (detail) text.append(el("small", "", detail));
      button.append(text);
      if (checked) button.append(el("span", "check", "✓"));
      button.disabled = !!disabled;
      button.onclick = () => { closeSheet(); onClick?.(); };
      return button;
    }

    function openModeSheet() {
      const { current } = currentControls();
      const plan = current.collaborationMode === "plan";
      openSheet("模式", (body) => {
        body.append(
          optionButton({ label: "Agent", detail: "直接动手做", checked: !plan, onClick: () => plan && changeSettings({ collaborationMode: "default" }) }),
          optionButton({
            label: "计划", detail: "先和你讨论出完整方案，再动手", checked: plan,
            onClick: () => {
              if (plan) return;
              const desktopNeeded = !state.view?.live || state.view?.headless;
              changeSettings({ collaborationMode: "plan" }, desktopNeeded ? "计划模式要在桌面里用，会让桌面 Codex 打开这个会话。继续吗？" : null);
            },
          }),
        );
      });
    }

    function openPermissionSheet() {
      const { options, current } = currentControls();
      if (!options) return toast("还在读取可选项…");
      openSheet("权限", (body) => {
        for (const mode of options.permissionModes) {
          body.append(optionButton({
            label: mode.label, detail: mode.detail, checked: mode.id === current.permissionMode, danger: mode.id === "full-access",
            onClick: () => mode.id !== current.permissionMode && changeSettings({ permissionMode: mode.id },
              mode.id === "full-access" ? "完全访问：命令不经沙箱、不再询问，直接在这台电脑上执行。确定切换吗？" : null),
          }));
        }
      });
    }

    function openModelSheet() {
      const { options, current } = currentControls();
      if (!options) return toast("还在读取可选项…");
      const models = [...options.models];
      if (current.model && !models.some((model) => model.id === current.model)) models.unshift({ id: current.model, label: current.model, efforts: [] });
      const model = models.find((item) => item.id === current.model);
      openSheet("模型与推理强度", (body) => {
        body.append(el("div", "section", "推理强度"));
        const efforts = el("div", "seg-row");
        const list = model?.efforts?.length ? model.efforts : ["low", "medium", "high"];
        for (const effort of [null, ...list]) {
          const label = effort ? effortLabels[effort] || effort : `默认${model?.defaultEffort ? `（${effortLabels[model.defaultEffort] || model.defaultEffort}）` : ""}`;
          const button = el("button", (current.effort || null) === effort ? "on" : "", label);
          button.onclick = () => { closeSheet(); if ((current.effort || null) !== effort) changeSettings({ effort }); };
          efforts.append(button);
        }
        body.append(efforts, el("div", "section", "模型"));
        for (const item of models) {
          body.append(optionButton({ label: item.label || item.id, detail: item.description, checked: item.id === current.model,
            onClick: () => item.id !== current.model && changeSettings({ model: item.id }) }));
        }
      });
    }

    function openMoreSheet() {
      const view = state.view;
      if (!view) return;
      const running = view.runtime === "active";
      openSheet(view.cwd || "", (body) => {
        if ((!view.live || view.headless) && can("message")) {
          body.append(optionButton({ label: "在桌面打开", detail: running ? "等这一轮跑完再打开" : "让桌面 Codex 切到这个会话", disabled: running, onClick: openInDesktop }));
        }
        if (running && can("message")) body.append(optionButton({ label: "停止这一轮", danger: true, onClick: interrupt }));
        if (view.cwd && can("message")) body.append(optionButton({ label: "在这个项目新建会话", detail: view.cwd, onClick: () => openNewSheet(view.cwd) }));
        body.append(optionButton({ label: "刷新", onClick: () => selectThread(state.current) }));
      });
    }

    function openFilterSheet() {
      openSheet("显示", (body) => {
        for (const [id, label] of [["all", "全部会话"], ["running", "只看运行中"], ["unread", "只看未读"]]) {
          body.append(optionButton({ label, checked: ui.filter === id, onClick: () => { ui.filter = id; renderList(); } }));
        }
      });
    }

    function openHostSheet() {
      openSheet("", (body) => {
        body.append(
          optionButton({ label: state.me?.host || "这台电脑", detail: `已连接 · ${location.host}`, disabled: true }),
          optionButton({ label: state.me?.kind === "device" ? state.me.name : "本机浏览器", detail: `这台设备 · ${roleText(state.me?.role)}`, disabled: true }),
          optionButton({ label: "刷新会话列表", onClick: loadThreads }),
        );
      });
    }

    /**
     * 新建会话。在项目里点 ⊕（或对话里「在这个项目新建会话」）时 `presetCwd` 已定，不用选目录；
     * 在列表上点 ⊕ 时从已有项目里挑，或「选择其他文件夹」浏览这台电脑上的目录。
     */
    function openNewSheet(presetCwd, chosenCwd) {
      if (!can("message")) return toast("这台设备只能查看");
      const projects = projectsOf(state.threads).filter((project) => project.cwd);
      let cwd = presetCwd ?? chosenCwd ?? projects[0]?.cwd ?? "";
      const draft = openNewSheet.draft || { name: "", text: "" };
      openNewSheet.draft = null;
      openSheet(presetCwd != null ? `在「${baseName(presetCwd)}」新建会话` : "新建会话", (body) => {
        const name = el("input");
        name.placeholder = "会话名称（可选）";
        name.value = draft.name;
        const text = el("textarea");
        text.placeholder = "第一条消息（可选）";
        text.value = draft.text;
        const keepDraft = () => { openNewSheet.draft = { name: name.value, text: text.value }; };
        if (presetCwd == null) {
          body.append(el("div", "section", "项目"));
          const row = el("div", "seg-row");
          const chosenLine = el("div", "chosen");
          const chosenText = el("span", "", cwd || "还没选文件夹");
          const browse = el("button", "", "选择其他文件夹…");
          browse.onclick = () => { keepDraft(); openFolderSheet(cwd || null, (picked) => openNewSheet(null, picked)); };
          chosenLine.append(chosenText, browse);
          for (const project of projects.slice(0, 12)) {
            const button = el("button", project.cwd.replace(/\/+$/, "") === cwd.replace(/\/+$/, "") ? "on" : "", project.name);
            button.onclick = () => {
              cwd = project.cwd;
              chosenText.textContent = cwd;
              for (const other of row.querySelectorAll("button")) other.classList.toggle("on", other === button);
            };
            row.append(button);
          }
          if (projects.length) body.append(row);
          const pick = el("div", "form");
          pick.style.paddingTop = "0";
          pick.style.paddingBottom = "0";
          pick.append(chosenLine);
          body.append(pick);
        }
        const form = el("div", "form");
        const create = el("button", "primary-btn", "创建");
        create.onclick = async () => {
          if (!cwd) return toast("先选一个项目或文件夹");
          create.disabled = true;
          try {
            const data = await api("POST", "/threads", { cwd, name: name.value.trim() || undefined, text: text.value.trim() || undefined });
            closeSheet();
            await loadThreads();
            openChat(data.threadId, ui.screen === "project" ? "project" : "list");
          } catch (error) {
            toast(error.message);
            create.disabled = false;
          }
        };
        form.append(name, text, create);
        body.append(form);
      });
    }

    /** 浏览这台电脑上的文件夹：点进去、上一级、「用这个文件夹」。 */
    function openFolderSheet(start, onPick) {
      openSheet("选择文件夹", (body) => {
        const crumb = el("div", "crumb", "读取中…");
        const list = el("div");
        const pick = el("div", "pick");
        const use = el("button", "primary-btn", "用这个文件夹");
        const hint = el("small");
        pick.append(use, hint);
        body.append(crumb, list, pick);
        let current = null;
        async function go(path) {
          use.disabled = true;
          try {
            const data = await api("GET", `/fs/dirs${path ? `?path=${encodeURIComponent(path)}` : ""}`);
            current = data.path;
            const home = data.home;
            crumb.textContent = current.startsWith(home) ? `~${current.slice(home.length)}` || "~" : current;
            const rows = [];
            if (data.parent) {
              const up = el("button", "opt");
              up.append(el("span", "label", "‹ 上一级"));
              up.onclick = () => go(data.parent);
              rows.push(up);
            }
            if (current !== home) {
              const homeButton = el("button", "opt");
              homeButton.append(el("span", "label", "⌂ 主目录"));
              homeButton.onclick = () => go(home);
              rows.push(homeButton);
            }
            for (const entry of data.entries) {
              const row = el("button", "opt");
              const icon = el("span");
              icon.className = "folder";
              icon.innerHTML = ICON.folder;
              row.append(icon, el("span", "label", entry.name));
              if (entry.git) row.append(el("span", "git", "git"));
              row.onclick = () => go(entry.path);
              rows.push(row);
            }
            if (!data.entries.length) rows.push(el("div", "m-empty", "这里没有子文件夹"));
            list.replaceChildren(...rows);
            body.scrollTop = 0;
            hint.textContent = data.git ? "这是一个 git 仓库" : current;
            use.disabled = false;
          } catch (error) {
            toast(error.message);
            if (!current) crumb.textContent = error.message;
          }
        }
        use.onclick = () => { if (!current) return; closeSheet(); onPick(current); };
        go(start);
      });
    }

    // ---------- 设置 ----------
    function renderSettings() {
      const body = $("mSettingsBody");
      const me = state.me || {};
      const item = (label, value) => {
        const node = el("div", "m-item");
        node.append(el("span", "", label));
        if (value != null) node.append(el("span", "value", value));
        return node;
      };
      const groups = [];
      const device = el("div", "m-group");
      device.append(item("电脑", me.host || ""), item("这台设备", me.kind === "device" ? me.name : "本机浏览器"), item("权限", roleText(me.role)));
      groups.push(el("div", "m-group-title", "连接"), device);
      const display = el("div", "m-group");
      const styleRow = item("对话样式");
      const seg = el("div", "m-seg");
      for (const [id, label] of [["chat", "聊天"], ["codex", "Codex"], ...(can("full") ? [["mirror", "桌面镜像"]] : [])]) {
        const button = el("button", "", label);
        button.setAttribute("aria-pressed", String((document.documentElement.dataset.style || "chat") === id));
        button.onclick = () => setStyle(id);
        seg.append(button);
      }
      styleRow.append(seg);
      display.append(styleRow);
      groups.push(el("div", "m-group-title", "显示"), display);
      const alerts = el("div", "m-group");
      const permission = "Notification" in window ? Notification.permission : "unsupported";
      const notifyRow = el("button", "m-item");
      notifyRow.append(el("span", "", "系统通知"), el("span", "value", { granted: "已开启", denied: "已被浏览器拒绝", default: "点击开启", unsupported: "浏览器不支持" }[permission]));
      notifyRow.disabled = permission !== "default";
      notifyRow.onclick = () => $("notify").onclick();
      alerts.append(notifyRow);
      groups.push(el("div", "m-group-title", "提醒：页面开着时，需要审批、模型提问或一轮跑完会提醒"), alerts);
      if (me.kind === "device") {
        const leave = el("div", "m-group");
        const button = el("button", "m-item danger", "退出配对");
        button.onclick = () => $("forget").onclick();
        leave.append(button);
        groups.push(leave);
      }
      body.replaceChildren(...groups);
    }

    // ---------- 导航 ----------
    function show(screen) {
      ui.screen = screen;
      $("mList").hidden = screen !== "list";
      $("mProject").hidden = screen !== "project";
      $("mSettings").hidden = screen !== "settings";
      $("mChat").hidden = screen !== "chat";
      $("mTabs").hidden = screen !== "list" && screen !== "settings";
      $("mTabChats").setAttribute("aria-selected", String(screen !== "settings"));
      $("mTabSettings").setAttribute("aria-selected", String(screen === "settings"));
    }
    function openProject(cwd) {
      ui.project = cwd;
      history.pushState({ m: "project" }, "");
      show("project");
      renderProject();
    }
    function openChat(id, from) {
      ui.from = from;
      ui.stick = true;
      ui.requestCards.clear();
      history.pushState({ m: "chat" }, "");
      show("chat");
      $("mChatTitle").textContent = threadTitle(state.threads.find((thread) => thread.id === id) || {});
      $("mChatState").textContent = "";
      $("mLog").replaceChildren(el("div", "m-empty", "加载中…"));
      markSeen(id);
      selectThread(id);
    }
    function leaveChat() {
      for (const entry of ui.pending) if (entry.preview) URL.revokeObjectURL(entry.preview);
      ui.pending = [];
      renderAttach();
      closeSocket();
      markSeen(state.current);
      state.current = null;
      state.view = null;
      show(ui.from === "project" && ui.project !== null ? "project" : "list");
      renderList();
      renderProject();
      // 刚聊过的会话时间、摘要变了，回到列表时立刻刷新一次。
      loadThreads();
    }
    function goBack() {
      if (history.state?.m) history.back();
      else popped();
    }
    function popped() {
      closeSheet();
      if (ui.screen === "chat") leaveChat();
      else if (ui.screen === "project") { ui.project = null; show("list"); renderList(); }
    }
    window.addEventListener("popstate", popped);

    function setStyle(next) {
      if (next === "mirror" && !can("full")) return toast("桌面镜像需要「完全控制」权限");
      const previous = document.documentElement.dataset.style;
      if (next === "mirror" && previous !== "mirror") localStorage.setItem(MIRROR_BACK_KEY, previous || "codex");
      document.documentElement.dataset.style = next;
      localStorage.setItem(STYLE_KEY, next);
      if (next === "mirror") {
        closeSocket();
        mirror.start();
        return;
      }
      mirror.stop();
      $("style").textContent = next === "chat" ? "Codex 样式" : "聊天样式";
      renderThreads();
      if (state.view) applyView(state.view);
      if (next === "chat") {
        show(state.current ? "chat" : "list");
        renderSettings();
      } else if (state.current) {
        $("app").classList.add("viewing");
      }
    }

    // ---------- 事件 ----------
    $("mTabChats").onclick = () => { show("list"); renderList(); };
    $("mTabSettings").onclick = () => { show("settings"); renderSettings(); };
    $("mFilter").onclick = openFilterSheet;
    $("mHost").onclick = openHostSheet;
    $("mNew").onclick = () => openNewSheet(null);
    $("mProjectNew").onclick = () => openNewSheet(ui.project);
    $("mProjectBack").onclick = goBack;
    $("mChatBack").onclick = goBack;
    $("mChatMore").onclick = openMoreSheet;
    $("mPlus").onclick = openAttachSheet;
    $("mGo").onclick = send;
    $("mSearch").oninput = () => { ui.query = $("mSearch").value; renderList(); };
    $("mInput").addEventListener("input", () => { autosize(); renderComposer(); });
    $("mInput").addEventListener("keydown", (event) => {
      // 手机上回车换行，点按钮发送；电脑上回车发送、Shift+回车换行。
      if (!coarse && event.key === "Enter" && !event.shiftKey && !event.isComposing) {
        event.preventDefault();
        send();
      }
    });
    // 列表页开着时定期刷新：别处（桌面、别的设备）开的会话、跑完的会话能及时出现。
    setInterval(() => {
      if (isChat() && state.me && !document.hidden && (ui.screen === "list" || ui.screen === "project")) loadThreads();
    }, 8000);
    show("list");

    return {
      onThreads() {
        initSeen(state.threads);
        renderList();
        renderProject();
      },
      onThreadsError(message) { $("mRows").replaceChildren(el("div", "m-empty", `读取会话失败：${message}`)); },
      onView() { renderChat(); },
      onRole() {
        $("mHostName").textContent = state.me?.host || "远程控制";
        $("mHostDot").classList.toggle("off", !state.me);
        $("mNew").style.visibility = can("message") ? "" : "hidden";
        renderSettings();
        renderComposer();
      },
      onOffline(message) {
        $("mHostDot").classList.add("off");
        $("mRows").replaceChildren(el("div", "m-empty", `连接失败：${message}`));
      },
      setStyle,
    };
  })();

  // 样式切换：按设备记在 localStorage；聊天样式下模型 / 权限收进「⋯」。
  const styleLabel = () => (document.documentElement.dataset.style === "chat" ? "Codex 样式" : "聊天样式");
  $("style").textContent = styleLabel();
  $("mirrorOpen").onclick = () => m.setStyle("mirror");
  $("style").onclick = () => m.setStyle(document.documentElement.dataset.style === "chat" ? "codex" : "chat");
  $("more").onclick = () => $("controls").classList.toggle("chat-open");

  $("pairButton").onclick = pair;
  $("pairName").addEventListener("keydown", (event) => { if (event.key === "Enter") pair(); });
  $("pairCode").addEventListener("keydown", (event) => { if (event.key === "Enter") $("pairName").focus(); });
  $("forget").onclick = () => {
    if (!confirm("退出后这台设备要重新扫码配对。确定吗？")) return;
    localStorage.removeItem(DEVICE_KEY);
    location.reload();
  };
  $("notify").onclick = async () => {
    const result = await Notification.requestPermission().catch(() => "denied");
    toast(result === "granted" ? "已开启：页面在后台时，需要审批或跑完会提醒" : "浏览器没有允许通知，仍会用标题和振动提醒");
    applyRole();
  };

  async function boot() {
    try {
      state.me = await api("GET", "/me");
    } catch (error) {
      if ($("gate").hidden) $("threads").replaceChildren(el("div", "empty", `连接失败：${error.message}`));
      m.onOffline(error.message);
      return;
    }
    applyRole();
    loadThreads();
    // 上次停在桌面镜像：有权限就接着连，否则退回自绘界面。
    if (document.documentElement.dataset.style === "mirror") {
      if (can("full")) mirror.start();
      else m.setStyle(narrow ? "chat" : "codex");
    }
  }

  if (pairCode && !token) {
    showGate("配对这台设备", "确认设备名称后点「配对」。配对后这台设备可以长期访问，可随时在 Codex++ 里移除。", { pairing: true, code: pairCode });
  } else if (!token) {
    if (location.protocol === "https:") showGate("配对这台设备", "在 Codex++「远程控制」里点「添加设备」，扫码或输入配对码。", { pairing: true });
    else showGate("缺少令牌", "请从 Codex++「远程控制」页面打开本页。");
  } else {
    boot();
  }
})();
</script>
</body>
</html>

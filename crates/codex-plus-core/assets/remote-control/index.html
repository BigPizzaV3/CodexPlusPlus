    <button class="m-rail-only" id="mTabMirror" title="桌面镜像：直接看并操作桌面上的 Codex 窗口" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg><span>镜像</span></button>
    <button class="m-rail-only" id="mTabStyle" title="切换到 Codex 样式"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5 20.5 7v10L12 21.5 3.5 17V7Z"/><path d="m8.5 10 2.5 2-2.5 2M13 14.5h3"/></svg><span>Codex</span></button>
    <button id="mTabSettings" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12.2 2h-.4a2 2 0 0 0-2 2v.2a2 2 0 0 1-1 1.7l-.4.3a2 2 0 0 1-2 0l-.2-.1a2 2 0 0 0-2.7.7l-.2.4a2 2 0 0 0 .7 2.7l.2.1a2 2 0 0 1 1 1.7v.5a2 2 0 0 1-1 1.8l-.2.1a2 2 0 0 0-.7 2.7l.2.4a2 2 0 0 0 2.7.7l.2-.1a2 2 0 0 1 2 0l.4.3a2 2 0 0 1 1 1.7v.2a2 2 0 0 0 2 2h.4a2 2 0 0 0 2-2v-.2a2 2 0 0 1 1-1.7l.4-.3a2 2 0 0 1 2 0l.2.1a2 2 0 0 0 2.7-.7l.2-.4a2 2 0 0 0-.7-2.7l-.2-.1a2 2 0 0 1-1-1.8v-.5a2 2 0 0 1 1-1.7l.2-.1a2 2 0 0 0 .7-2.7l-.2-.4a2 2 0 0 0-2.7-.7l-.2.1a2 2 0 0 1-2 0l-.4-.3a2 2 0 0 1-1-1.7V4a2 2 0 0 0-2-2Z"/><circle cx="12" cy="12" r="3"/></svg><span>设置</span></button>
  </nav>
  <section class="m-screen m-chat" id="mChat" hidden>
    <div class="m-placeholder" id="mPlaceholder"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-8.5 8.3 9 9 0 0 1-3.9-.9L3 20l1.3-4.4a8 8 0 0 1-1.1-4.1A8.4 8.4 0 0 1 11.7 3.2h.8a8.4 8.4 0 0 1 8.5 8.3Z"/></svg></div>
    <header class="m-top">
      <button class="m-back" id="mChatBack" aria-label="返回"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg><span class="count" id="mChatBackCount" hidden></span></button>
      <div class="m-title"><span id="mChatTitle"></span><small id="mChatState"></small></div>
      <button class="m-icon" id="mChatMore" aria-label="更多"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1.3" fill="currentColor"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/><circle cx="19" cy="12" r="1.3" fill="currentColor"/></svg></button>
    </header>
    <div class="m-log" id="mLog"></div>
    <footer class="m-composer" id="mComposer">
      <div class="m-attach" id="mAttach" hidden></div>
      <div class="m-pill">
        <button class="plus" id="mPlus" aria-label="发图片或文件"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></button>
        <textarea id="mInput" rows="1" placeholder="发消息..." enterkeyhint="send"></textarea>
        <button class="go send" id="mGo" aria-label="发送" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.4"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
      </div>
      <div class="m-chips" id="mChips"></div>
    </footer>
    <div class="m-readonly" id="mReadonly" hidden>这台设备只能查看。需要发消息可在 Codex++ 的设备列表里调高权限。</div>
  </section>
  <!-- 加加：聊天机器人，替用户照看会话（远程控制服务里的 jiajia 模块） -->
  <section class="m-screen m-chat" id="mBot" hidden>
    <header class="m-top">
      <button class="m-back" id="mBotBack" aria-label="返回"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg><span class="count" id="mBotBackCount" hidden></span></button>
      <div class="m-title"><span>加加</span><small id="mBotState"></small></div>
      <button class="m-icon" id="mBotMore" aria-label="加加的设置"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1.3" fill="currentColor"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/><circle cx="19" cy="12" r="1.3" fill="currentColor"/></svg></button>
    </header>
    <div class="m-log" id="mBotLog"></div>
    <footer class="m-composer" id="mBotComposer">
      <div class="m-pill">
        <textarea id="mBotInput" rows="1" placeholder="和加加说…" enterkeyhint="send"></textarea>
        <button class="go send" id="mBotGo" aria-label="发送" hidden></button>
      </div>
    </footer>
    <div class="m-readonly" id="mBotReadonly" hidden>这台设备只能查看，不能和加加说话。可在 Codex++ 的设备列表里调高权限。</div>
  </section>
</div>
<!-- 桌面镜像：Codex 桌面窗口的实时画面 -->
<div class="mirror" id="mirror">
  <div class="mirror-bar">
    <button id="mirrorBack" title="回到我们自己画的界面">‹ 自绘界面</button>
    <div class="status"><i class="dot" id="mirrorDot"></i><span id="mirrorStatus">桌面镜像</span></div>
    <button id="mirrorRetry" title="重新连接">刷新</button>
    <button id="mirrorKeyboard" title="弹出键盘：打的字会输入到 Codex 当前聚焦的地方">键盘</button>
  </div>
  <div class="mirror-stage" id="mirrorStage">
    <canvas id="mirrorCanvas" tabindex="-1"></canvas>
    <div class="mirror-tip" id="mirrorTip">桌面镜像</div>
  </div>
  <div class="mirror-ime" id="mirrorIme" hidden></div>
  <textarea id="mirrorInput" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="输入到 Codex"></textarea>
</div>
<div class="gate" id="gate" hidden>
  <div class="card">
    <h2 id="gateTitle">配对这台设备</h2>
    <p id="gateText"></p>
    <input id="pairCode" class="code" placeholder="配对码" autocomplete="one-time-code" autocapitalize="characters" hidden>
    <input id="pairName" placeholder="设备名称" maxlength="40" hidden>
    <button id="pairButton" class="primary" hidden>配对</button>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
(() => {
  // 令牌来源：本机页面的主令牌走 #token=（只存会话级）；配对设备的令牌存 localStorage，长期有效直到被移除。
  const MASTER_KEY = "codexPlusRemoteToken";
  const DEVICE_KEY = "codexPlusRemoteDeviceToken";
  const params = new URLSearchParams(location.hash.slice(1));
  const pairCode = params.get("pair") || "";
  if (params.get("token")) sessionStorage.setItem(MASTER_KEY, params.get("token"));
  if (params.get("token") || pairCode) history.replaceState(null, "", location.pathname);
  const token = sessionStorage.getItem(MASTER_KEY) || localStorage.getItem(DEVICE_KEY) || "";
  // 对话样式：codex（桌面形态）或 chat（按微信做的聊天形态）。手机没选过时默认聊天。
  const STYLE_KEY = "codexPlusRemoteStyle";
  const narrow = window.matchMedia?.("(max-width: 720px)").matches ?? window.innerWidth <= 720;
  const style = localStorage.getItem(STYLE_KEY) || (narrow ? "chat" : "codex");
  document.documentElement.dataset.style = style;
  const $ = (id) => document.getElementById(id);
  const state = { threads: [], query: "", expanded: new Set(), openDetails: new Set(), draftCwd: "", current: null, view: null, socket: null, poller: null, busy: false, stickNext: false, options: null, optionsFor: null, applying: false, me: null, seenRequests: new Set(), wasRunning: false };
  const rank = { view: 0, message: 1, full: 2 };
  const can = (role) => rank[state.me?.role ?? "view"] >= rank[role];

  /** 未配对 / 被移除：盖住整个页面，引导扫码或输入配对码。 */
  function showGate(title, text, { pairing = false, code = "" } = {}) {
    closeSocket();
    $("gate").hidden = false;
    $("gateTitle").textContent = title;
    $("gateText").textContent = text;
    for (const id of ["pairCode", "pairName", "pairButton"]) $(id).hidden = !pairing;
    if (pairing) {
      $("pairCode").value = code;
      $("pairName").value = guessDeviceName();
      (code ? $("pairName") : $("pairCode")).focus();
    }
  }

  function guessDeviceName() {
    const ua = navigator.userAgent;
    if (/iPhone/.test(ua)) return "iPhone";
    if (/iPad/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1)) return "iPad";
    if (/Android/.test(ua)) return "Android 手机";
    if (/Macintosh/.test(ua)) return "Mac";
    if (/Windows/.test(ua)) return "Windows 电脑";
    return "浏览器";
  }

  async function pair() {
    const code = $("pairCode").value.trim();
    if (!code) return toast("先填配对码");
    $("pairButton").disabled = true;
    try {
      const response = await fetch("/api/pair", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ code, name: $("pairName").value.trim() }),
      });
      const payload = await response.json().catch(() => ({ ok: false, error: `HTTP ${response.status}` }));
      if (!payload.ok) throw new Error(payload.error || `HTTP ${response.status}`);
      localStorage.setItem(DEVICE_KEY, payload.data.token);
      location.reload();
    } catch (error) {
      toast(error.message);
      $("pairButton").disabled = false;
    }
  }

  function unauthorized(message) {
    if (sessionStorage.getItem(MASTER_KEY)) {
      sessionStorage.removeItem(MASTER_KEY);
      showGate("令牌已失效", "请从 Codex++「远程控制」页面重新打开本页。");
    } else {
      localStorage.removeItem(DEVICE_KEY);
      showGate("需要重新配对", `${message || "这台设备已被移除"}。在 Codex++「远程控制」里点「添加设备」，扫码或输入配对码。`, { pairing: true });
    }
  }

  function toast(text) {
    const node = $("toast");
    node.textContent = text;
    node.classList.add("show");
    clearTimeout(toast.timer);
    toast.timer = setTimeout(() => node.classList.remove("show"), 3200);
  }

  async function api(method, path, body) {
    const response = await fetch(`/api${path}`, {
      method,
      headers: { "Authorization": `Bearer ${token}`, ...(body ? { "Content-Type": "application/json" } : {}) },
      body: body ? JSON.stringify(body) : undefined,
    });
    const payload = await response.json().catch(() => ({ ok: false, error: `HTTP ${response.status}` }));
    if (response.status === 401) unauthorized(payload.error);
    if (!payload.ok) throw new Error(payload.error || `HTTP ${response.status}`);
    return payload.data;
  }

  /** 页面不在前台时提醒：标题、振动、系统通知（用户允许过才发）。 */
  function alertUser(text) {
    if (!document.hidden) return;
    document.title = `● ${text} · Codex++`;
    navigator.vibrate?.(200);
    if ("Notification" in window && Notification.permission === "granted") {
      try { new Notification("Codex++ 远程控制", { body: text, tag: "codex-plus-remote" }); } catch {}
    }
  }
  document.addEventListener("visibilitychange", () => { if (!document.hidden) document.title = "Codex++ 远程控制"; });

  function watchForAttention(view) {
    for (const request of view.requests || []) {
      const key = `${view.threadId || state.current}:${JSON.stringify(request.id)}`;
      if (state.seenRequests.has(key)) continue;
      state.seenRequests.add(key);
      alertUser(request.method === "item/tool/requestUserInput" ? "模型在提问" : "有操作等你审批");
    }
    const running = view.runtime === "active";
    if (state.wasRunning && !running && view.live) alertUser(`「${view.title || "会话"}」这一轮跑完了`);
    state.wasRunning = running;
  }

  const roleText = (role) => ({ view: "只能查看", message: "可发消息", full: "完全控制" }[role] || role || "");
  const styleNow = () => document.documentElement.dataset.style || "codex";

  function applyRole() {
    const me = state.me;
    $("whoami").hidden = me?.kind !== "device";
    if (me?.kind === "device") {
      $("whoamiText").textContent = `${me.name} · ${roleText(me.role)}`;
      $("forget").hidden = false;
    }
    $("cxHostName").textContent = me?.host || "Codex";
    $("notify").hidden = !("Notification" in window) || Notification.permission !== "default";
    $("cxNew").hidden = !can("message");
    $("compose").hidden = !can("message");
    $("readonly").hidden = can("message");
    $("mirrorOpen").hidden = !can("full");
    m.onRole();
  }

  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text != null) node.textContent = text;
    return node;
  }

  function relative(seconds) {
    if (!seconds) return "";
    const diff = Date.now() / 1000 - seconds;
    if (diff < 60) return "刚刚";
    if (diff < 3600) return `${Math.floor(diff / 60)} 分钟前`;
    if (diff < 86400) return `${Math.floor(diff / 3600)} 小时前`;
    return new Date(seconds * 1000).toLocaleDateString();
  }

  /** 侧栏右侧的短时间：3 分、2 小时、5 天。 */
  function shortTime(seconds) {
    if (!seconds) return "";
    const diff = Math.max(0, Date.now() / 1000 - seconds);
    if (diff < 60) return "刚刚";
    if (diff < 3600) return `${Math.floor(diff / 60)} 分`;
    if (diff < 86400) return `${Math.floor(diff / 3600)} 小时`;
    if (diff < 86400 * 30) return `${Math.floor(diff / 86400)} 天`;
    return new Date(seconds * 1000).toLocaleDateString();
  }

  async function loadThreads() {
    try {
      const data = await api("GET", "/threads");
      state.threads = data.threads || [];
      renderThreads();
    } catch (error) {
      $("threads").replaceChildren(el("div", "cx-empty", `读取会话失败：${error.message}`));
      m.onThreadsError(error.message);
    }
  }

  const isRunning = (thread) => thread.status === "active" || thread.status === "running" || thread.status === "inProgress";
  const baseName = (path) => String(path || "").replace(/\/+$/, "").split("/").pop() || path || "未记录项目";
  const byRecent = (a, b) => (Number(b.updatedAt) || 0) - (Number(a.updatedAt) || 0);
  const threadTitle = (thread) => thread.title || thread.preview || "（未命名）";

  /** 会话按工作目录归到项目里，项目按最近活动排序。 */
  function projectsOf(threads) {
    const map = new Map();
    for (const thread of threads) {
      const key = thread.cwd || "";
      const project = map.get(key) || { cwd: key, name: baseName(key), threads: [], updatedAt: 0, running: 0 };
      project.threads.push(thread);
      project.updatedAt = Math.max(project.updatedAt, Number(thread.updatedAt) || 0);
      if (isRunning(thread)) project.running += 1;
      map.set(key, project);
    }
    return [...map.values()].sort((a, b) => b.updatedAt - a.updatedAt);
  }

  function renderThreads() {
    if (!state.draftCwd) state.draftCwd = projectsOf(state.threads).find((project) => project.cwd)?.cwd || "";
    renderSide();
    if (!state.current && styleNow() === "codex") renderBlank();
    m.onThreads();
  }

  // ---------- Codex 样式：图标 ----------
  const icon = (d, width = 1.8) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${width}" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
  const CX = {
    folder: icon('<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/>'),
    folderOpen: icon('<path d="M3 7a2 2 0 0 1 2-2h4l2 2h7a2 2 0 0 1 2 2v1"/><path d="M3 17V9h17.5a1 1 0 0 1 1 1.3l-2.2 7a2 2 0 0 1-1.9 1.4H5a2 2 0 0 1-2-2Z"/>'),
    compose: icon('<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>'),
    plus: icon('<path d="M12 5v14M5 12h14"/>', 2),
    up: icon('<path d="M12 19V5M5 12l7-7 7 7"/>', 2.4),
    stop: icon('<rect x="7" y="7" width="10" height="10" rx="1.5" fill="currentColor"/>'),
    chev: icon('<path d="m6 9 6 6 6-6"/>', 2),
    shield: icon('<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/>'),
    alert: icon('<circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.5h.01"/>', 2),
    agent: icon('<path d="M6.5 15.5a3.5 3.5 0 1 1 0-7c3 0 8 7 11 7a3.5 3.5 0 1 0 0-7c-3 0-8 7-11 7Z"/>'),
    plan: icon('<path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/>', 2),
    diff: icon('<path d="M12 3v8M8 7h8M8 17h8"/><rect x="3" y="3" width="18" height="18" rx="3"/>'),
    logo: icon('<path d="M12 2.5 20.5 7v10L12 21.5 3.5 17V7Z"/><path d="m8.5 10 2.5 2-2.5 2M13 14.5h3"/>', 1.5),
  };

  // ---------- Codex 样式：侧栏（新聊天 / 项目 / 最近）----------
  function renderSide() {
    const query = state.query.trim().toLowerCase();
    const threads = state.threads.filter((thread) => !query || [thread.title, thread.preview, thread.cwd].some((value) => String(value || "").toLowerCase().includes(query)));
    const projects = projectsOf(threads).filter((project) => project.cwd);
    const box = $("cxProjects");
    if (!projects.length) box.replaceChildren(el("div", "cx-empty", query ? "没有匹配的项目" : "没有项目"));
    else box.replaceChildren(...projects.flatMap((project) => {
      const open = state.expanded.has(project.cwd) || !!query;
      const row = el("div", `cx-row${!state.current && state.draftCwd === project.cwd ? " active" : ""}`);
      row.innerHTML = open ? CX.folderOpen : CX.folder;
      row.title = project.cwd;
      row.append(el("span", "name", project.name));
      row.append(project.running ? el("span", "spin") : el("span", "count", String(project.threads.length)));
      if (can("message")) {
        const add = el("button", "cx-icon add");
        add.innerHTML = CX.compose;
        add.title = "在这个项目新建会话";
        add.onclick = (event) => { event.stopPropagation(); newChat(project.cwd); };
        row.append(add);
      }
      row.onclick = () => {
        if (state.expanded.has(project.cwd)) state.expanded.delete(project.cwd);
        else state.expanded.add(project.cwd);
        renderSide();
      };
      return open ? [row, ...[...project.threads].sort(byRecent).map((thread) => threadRow(thread, true))] : [row];
    }));
    const recent = [...threads].sort(byRecent).slice(0, 40);
    $("threads").replaceChildren(...(recent.length ? recent.map((thread) => threadRow(thread, false)) : [el("div", "cx-empty", query ? "没有匹配的会话" : "还没有会话")]));
  }

  function threadRow(thread, child) {
    const row = el("div", `cx-row${child ? " child" : ""}${thread.id === state.current ? " active" : ""}`);
    row.append(el("span", "name", threadTitle(thread)));
    if (isRunning(thread)) row.append(el("span", "spin"));
    else if (m.unread(thread)) row.append(el("span", "unread"));
    else row.append(el("span", "aux", shortTime(thread.updatedAt)));
    row.title = thread.cwd ? `${threadTitle(thread)}\n${thread.cwd}` : threadTitle(thread);
    row.onclick = () => selectThread(thread.id);
    return row;
  }

  /** 新聊天：和 Codex 桌面一样先停在空白页，选好项目、打第一句话再建会话。 */
  function newChat(cwd) {
    closeSocket();
    state.current = null;
    state.view = null;
    state.wasRunning = false;
    if (cwd) state.draftCwd = cwd;
    $("app").classList.add("viewing");
    renderThreads();
    $("input").focus();
  }

  function renderBlank() {
    if (!state.draftCwd) state.draftCwd = projectsOf(state.threads).find((project) => project.cwd)?.cwd || "";
    $("title").textContent = "新聊天";
    $("state").textContent = "";
    $("open").hidden = true;
    const log = $("log");
    log.classList.add("blank");
    const hello = el("div", "cx-hello");
    hello.innerHTML = CX.logo;
    hello.append(
      el("h2", "", state.draftCwd ? `在「${baseName(state.draftCwd)}」里开始` : "开始构建"),
      el("p", "", state.draftCwd ? "新会话在这台电脑的后台运行，桌面上的 Codex 不会切过来，可以同时工作。" : "先在输入框下方选一个项目文件夹。"),
    );
    log.replaceChildren(hello);
    $("requests").replaceChildren();
    renderControls();
  }

  async function selectThread(id) {
    state.current = id;
    state.view = null;
    state.wasRunning = false;
    closeSocket();
    const thread = state.threads.find((item) => item.id === id);
    if (thread?.cwd) state.expanded.add(thread.cwd);
    renderThreads();
    $("app").classList.add("viewing");
    state.stickNext = true;
    $("title").textContent = threadTitle(thread || {});
    $("state").textContent = "";
    $("log").classList.remove("blank");
    $("log").replaceChildren(el("div", "cx-note", "加载中…"));
    $("requests").replaceChildren();
    renderControls();
    try {
      const view = await api("GET", `/threads/${id}`);
      if (state.current !== id) return;
      applyView(view);
      if (view.live) connectSocket(id);
      loadOptions(id);
    } catch (error) {
      $("log").replaceChildren(el("div", "cx-note", `读取失败：${error.message}`));
    }
  }

  function closeSocket() {
    if (state.socket) {
      state.socket.onclose = null;
      state.socket.close();
      state.socket = null;
    }
    clearInterval(state.poller);
    state.poller = null;
  }

  // 有的手机浏览器对自签证书的 wss 不放行（页面本身已信任也一样），连不上就改成轮询。
  let socketFailures = 0;

  function startPolling(id) {
    clearInterval(state.poller);
    state.poller = setInterval(async () => {
      if (state.current !== id || state.busy) return;
      try {
        const view = await api("GET", `/threads/${id}`);
        if (state.current === id) applyView(view);
      } catch {}
    }, 1500);
  }

  function connectSocket(id) {
    closeSocket();
    if (socketFailures >= 2) return startPolling(id);
    const scheme = location.protocol === "https:" ? "wss" : "ws";
    const socket = new WebSocket(`${scheme}://${location.host}/api/threads/${id}/stream?token=${encodeURIComponent(token)}`);
    let opened = false;
    state.socket = socket;
    socket.onopen = () => { opened = true; socketFailures = 0; };
    socket.onmessage = (event) => {
      const message = JSON.parse(event.data);
      if (state.current !== id) return;
      if (message.type === "view") applyView(message.view);
      else if (message.type === "revoked") unauthorized(message.reason);
      else if (message.type === "closed" && message.reconnect) {
        // 推送来源换了（例如后台会话转到桌面）：重连一次就接到新的来源。
        state.socket.onclose = null;
        state.socket = null;
        setTimeout(() => state.current === id && !state.socket && !state.poller && connectSocket(id), 600);
      } else if (message.type === "closed" || message.type === "error") {
        toast(message.reason || message.error || "实时连接已断开");
        if (state.view) applyView({ ...state.view, live: false, requests: [] });
      }
    };
    socket.onclose = () => {
      if (state.socket !== socket) return;
      state.socket = null;
      if (!opened) socketFailures += 1;
      if (state.current === id && state.view?.live) setTimeout(() => state.current === id && !state.socket && !state.poller && connectSocket(id), 1500);
    };
  }

  function nearBottom(node) {
    return node.scrollHeight - node.scrollTop - node.clientHeight < 80;
  }

  function applyView(view) {
    state.view = view;
    if (styleNow() === "codex") m.markSeen(state.current);
    $("title").textContent = view.title || "（未命名）";
    const running = view.runtime === "active";
    const badge = $("state");
    badge.className = `cx-badge${running ? " running" : view.live ? " live" : ""}`;
    // 后台会话：在这台电脑后台跑，桌面窗口不切换；随时可以点「在桌面打开」接过去。
    const background = !!view.headless;
    badge.textContent = running ? (background ? "后台运行中" : "运行中") : background ? "后台" : view.live ? "已在桌面打开" : "";
    badge.title = background ? "在这台电脑的后台运行，桌面 Codex 不会切到这个会话" : "";
    $("open").hidden = (view.live && !background) || !can("message");
    $("open").disabled = running && background;
    watchForAttention(view);
    const log = $("log");
    log.classList.remove("blank");
    const stick = nearBottom(log) || state.stickNext;
    state.stickNext = false;
    const nodes = [];
    if (view.truncatedTurns) nodes.push(el("div", "cx-note", `更早的 ${view.truncatedTurns} 轮未显示`));
    for (const turn of view.turns || []) nodes.push(renderTurn(turn, view));
    if (!nodes.length) nodes.push(el("div", "cx-note", "还没有消息"));
    // 最后一条不是助手消息时才补「正在思考」，免得和流式输出重复。
    const lastItems = view.turns?.at(-1)?.items || [];
    if (running && lastItems.at(-1)?.type !== "agentMessage" && !(view.requests || []).length) nodes.push(el("div", "cx-thinking", "正在思考"));
    log.replaceChildren(...nodes);
    if (stick) log.scrollTop = log.scrollHeight;
    renderRequests(view.requests || []);
    renderControls();
    m.onView();
  }

  const effortLabels = { none: "不推理", minimal: "最低", low: "低", medium: "中", high: "高", xhigh: "极高", max: "Max", ultra: "Ultra" };

  async function loadOptions(id) {
    try {
      const options = await api("GET", `/threads/${id}/options`);
      if (state.current !== id) return;
      state.options = options;
      state.optionsFor = id;
      renderControls();
      m.onView();
    } catch (error) {
      toast(`读取可选模型失败：${error.message}`);
    }
  }

  async function changeSettings(change, confirmText) {
    if (!state.current || state.applying) return;
    if (confirmText && !confirm(confirmText)) { renderControls(); return; }
    state.applying = true;
    renderControls();
    try {
      const view = await api("POST", `/threads/${state.current}/settings`, change);
      applyView(view);
      if (!state.socket && !state.poller) connectSocket(state.current);
    } catch (error) {
      toast(error.message);
    } finally {
      state.applying = false;
      renderControls();
      m.onView();
    }
  }

  // ---------- Codex 样式：消息 ----------
  /** 助手回复按 Markdown 显示：代码块、标题、列表、引用、行内代码、粗体、链接。只建 DOM，不解析 HTML。 */
  function markdown(text) {
    const root = el("div", "cx-agent");
    const lines = String(text || "").replace(/\r\n/g, "\n").split("\n");
    const bulletPattern = /^\s*([-*+]|\d+[.)])\s+(.*)$/;
    let para = [];
    const flush = () => {
      if (!para.length) return;
      const p = el("p");
      inline(p, para.join("\n"));
      root.append(p);
      para = [];
    };
    for (let i = 0; i < lines.length;) {
      const line = lines[i];
      const fence = line.match(/^\s*(```|~~~)/);
      if (fence) {
        flush();
        const buffer = [];
        i += 1;
        while (i < lines.length && !lines[i].trim().startsWith(fence[1])) buffer.push(lines[i++]);
        i += 1;
        const pre = el("pre");
        pre.append(el("code", "", buffer.join("\n")));
        root.append(pre);
        continue;
      }
      const heading = line.match(/^(#{1,6})\s+(.*)$/);
      if (heading) {
        flush();
        const node = el(`h${Math.min(heading[1].length + 2, 5)}`);
        inline(node, heading[2]);
        root.append(node);
        i += 1;
        continue;
      }
      if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(line)) { flush(); root.append(el("hr")); i += 1; continue; }
      const bullet = line.match(bulletPattern);
      if (bullet) {
        flush();
        const ordered = /\d/.test(bullet[1]);
        const list = el(ordered ? "ol" : "ul");
        if (ordered) list.start = Number.parseInt(bullet[1], 10) || 1;
        while (i < lines.length) {
          const item = lines[i].match(bulletPattern);
          if (item && /\d/.test(item[1]) === ordered) {
            const li = el("li");
            inline(li, item[2]);
            list.append(li);
            i += 1;
          } else if (lines[i].trim() && /^\s{2,}/.test(lines[i]) && list.lastChild) {
            list.lastChild.append(document.createElement("br"));
            inline(list.lastChild, lines[i].trim());
            i += 1;
          } else break;
        }
        root.append(list);
        continue;
      }
      if (line.startsWith(">")) {
        flush();
        const buffer = [];
        while (i < lines.length && lines[i].startsWith(">")) buffer.push(lines[i++].replace(/^>\s?/, ""));
        const quote = el("blockquote");
        inline(quote, buffer.join("\n"));
        root.append(quote);
        continue;
      }
      if (!line.trim()) { flush(); i += 1; continue; }
      para.push(line);
      i += 1;
    }
    flush();
    return root;
  }

  function inline(node, text) {
    const pattern = /(`[^`\n]+`)|(\*\*[^*\n]+\*\*)|\[([^\]\n]+)\]\((https?:\/\/[^)\s]+)\)/g;
    let last = 0;
    for (let match; (match = pattern.exec(text));) {
      if (match.index > last) node.append(text.slice(last, match.index));
      if (match[1]) node.append(el("code", "", match[1].slice(1, -1)));
      else if (match[2]) node.append(el("strong", "", match[2].slice(2, -2)));
      else {
        const link = el("a", "", match[3]);
        link.href = match[4];
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        node.append(link);
      }
      last = pattern.lastIndex;
    }
    if (last < text.length) node.append(text.slice(last));
  }

  /** 去掉外层的 `zsh -lc '…'`，和 Codex 一样只显示里面那条命令。 */
  function shownCommand(command) {
    const text = Array.isArray(command) ? command.join(" ") : String(command || "");
    const inner = text.match(/^(?:\/bin\/|\/usr\/bin\/)?(?:ba|z)?sh -l?c (['"])([\s\S]*)\1$/);
    return inner ? inner[2] : text;
  }

  function commandNode(item) {
    const details = el("details", "cx-cmd");
    const key = `cmd:${item.id}`;
    details.open = state.openDetails.has(key);
    details.ontoggle = () => (details.open ? state.openDetails.add(key) : state.openDetails.delete(key));
    const summary = el("summary");
    const verb = { inProgress: "正在运行", failed: "运行失败", declined: "已拒绝运行" }[item.status] || "已运行";
    const command = shownCommand(item.command);
    summary.append(el("span", item.status === "failed" || item.status === "declined" ? "bad" : "", verb), el("code", "", command.split("\n")[0]));
    if (item.status === "inProgress") summary.append(el("span", "spin"));
    details.append(summary);
    const output = [command.includes("\n") ? `$ ${command}` : "", item.aggregatedOutput || ""].filter(Boolean).join("\n");
    details.append(el("pre", "", output || "（没有输出）"));
    return details;
  }

  /** 一个文件改动的 +N / −M：新增算全部行，删除算全部行，修改数 diff 里的 +/- 行。 */
  function diffStat(change) {
    const type = change.kind?.type || change.kind;
    const lines = String(change.diff || "").split("\n");
    if (lines.at(-1) === "") lines.pop();
    if (type === "add") return [lines.length, 0];
    if (type === "delete") return [0, lines.length];
    let plus = 0;
    let minus = 0;
    for (const line of lines) {
      if (line.startsWith("+++") || line.startsWith("---")) continue;
      if (line[0] === "+") plus += 1;
      else if (line[0] === "-") minus += 1;
    }
    return [plus, minus];
  }

  function statNode(plus, minus) {
    const node = el("span", "stat");
    node.append(el("span", "plus-n", `+${plus}`), " ", el("span", "minus-n", `-${minus}`));
    return node;
  }

  function fileChangeNode(item, view) {
    const changes = item.changes || [];
    const stats = changes.map(diffStat);
    const total = stats.reduce((sum, [plus, minus]) => [sum[0] + plus, sum[1] + minus], [0, 0]);
    const card = el("div", "cx-files");
    const head = el("div", "head");
    const badge = el("div", "icon");
    badge.innerHTML = CX.diff;
    const text = el("div");
    const verb = { inProgress: "正在编辑", failed: "编辑失败", declined: "已拒绝编辑" }[item.status] || "已编辑";
    const small = el("small");
    small.append(statNode(total[0], total[1]));
    text.append(el("b", "", `${verb} ${changes.length} 个文件`), small);
    head.append(badge, text);
    card.append(head);
    const key = `files:${item.id}`;
    const expanded = state.openDetails.has(key);
    const root = String(view?.cwd || "").replace(/\/+$/, "");
    changes.forEach((change, index) => {
      if (!expanded && index >= 3) return;
      const path = String(change.path || "");
      const shown = root && path.startsWith(`${root}/`) ? path.slice(root.length + 1) : path;
      const cut = shown.lastIndexOf("/") + 1;
      const row = el("div", "file");
      row.title = path;
      row.append(el("span", "dir", shown.slice(0, cut)), el("span", "base", shown.slice(cut)), statNode(...stats[index]));
      card.append(row);
    });
    if (changes.length > 3) {
      const more = el("div", "file more", expanded ? "收起" : `再显示 ${changes.length - 3} 个文件`);
      more.style.cursor = "pointer";
      more.onclick = () => {
        if (expanded) state.openDetails.delete(key); else state.openDetails.add(key);
        if (state.view) applyView(state.view);
      };
      card.append(more);
    }
    return card;
  }

  function renderTurn(turn, view) {
    const box = el("div", "cx-turn");
    for (const item of turn.items || []) {
      switch (item.type) {
        case "userMessage":
        case "steeringUserMessage": {
          const node = el("div", `cx-user${item.type === "steeringUserMessage" ? " steer" : ""}`);
          const files = item.attachments || [];
          if (files.length) {
            const row = el("div", "files");
            row.append(...files.map((attachment) => m.attachmentNode(attachment)));
            node.append(row);
          }
          if (item.text || !files.length) node.append(el("div", "text", item.text || ""));
          box.append(node);
          break;
        }
        case "agentMessage": if (item.text) box.append(markdown(item.text)); break;
        case "commandExecution": box.append(commandNode(item)); break;
        case "fileChange": box.append(fileChangeNode(item, view)); break;
        case "webSearch": box.append(el("div", "cx-step", `已搜索 ${item.query || ""}`)); break;
        case "userInputResponse": box.append(el("div", "cx-step", "已回答提问")); break;
        case "modelChanged": box.append(el("div", "cx-note", `模型已切换为 ${item.toModel || "?"}`)); break;
        case "contextCompaction": box.append(el("div", "cx-note", "已压缩上下文")); break;
        default: break;
      }
    }
    if (turn.status === "interrupted") box.append(el("div", "cx-note", "已停止这一轮"));
    if (turn.status === "failed" || turn.error) box.append(errorNode(turn.error));
    return box;
  }

  /** 一轮失败：和 Codex 一样给出原因；长的细节折起来。 */
  function errorNode(error) {
    const box = el("div", "cx-error");
    box.append(el("strong", "", "这一轮失败了"));
    box.append(el("div", "", error?.message || "没有拿到失败原因，可以在桌面 Codex 里看看这个会话"));
    if (error?.details) {
      const details = el("details");
      details.append(el("summary", "", "详细信息"), el("pre", "", error.details));
      box.append(details);
    }
    return box;
  }

  function renderRequests(requests) {
    $("requests").replaceChildren(...requests.map(renderRequest));
  }

  function renderRequest(request) {
    const card = el("div", "cx-request");
    const params = request.params || {};
    const actions = el("div", "actions");
    const respond = async (body) => {
      for (const b of actions.querySelectorAll("button")) b.disabled = true;
      state.stickNext = true;
      try {
        await api("POST", `/threads/${state.current}/requests/${encodeURIComponent(JSON.stringify(request.id))}`, body);
      } catch (error) {
        toast(error.message);
        for (const b of actions.querySelectorAll("button")) b.disabled = false;
      }
    };
    if (request.method === "item/commandExecution/requestApproval" || request.method === "item/fileChange/requestApproval") {
      const isCommand = request.method.includes("commandExecution");
      card.append(el("strong", "", isCommand ? "要运行这条命令吗？" : "要修改这些文件吗？"));
      if (params.reason) card.append(el("div", "", params.reason));
      if (isCommand) card.append(el("code", "", `${shownCommand(params.command)}\n# ${params.cwd || ""}`));
      const decisions = params.availableDecisions || ["accept", "decline"];
      const labels = { accept: "同意", acceptForSession: "本会话都同意", decline: "拒绝", cancel: "拒绝并停止" };
      for (const decision of decisions) {
        if (typeof decision !== "string") continue;
        const button = el("button", `cx-btn${decision === "accept" ? " primary" : decision === "decline" || decision === "cancel" ? " danger" : ""}`, labels[decision] || decision);
        button.onclick = () => respond({ decision });
        actions.append(button);
      }
      if (!decisions.includes("decline")) {
        const button = el("button", "cx-btn danger", "拒绝");
        button.onclick = () => respond({ decision: "decline" });
        actions.append(button);
      }
    } else if (request.method === "item/tool/requestUserInput") {
      card.append(el("strong", "", "Codex 在问你"));
      const answers = {};
      for (const question of params.questions || []) {
        card.append(el("div", "", question.question || question.header || ""));
        const row = el("div", "actions");
        for (const option of question.options || []) {
          const button = el("button", "cx-btn", option.label);
          if (option.description) button.title = option.description;
          button.onclick = () => {
            answers[question.id] = { answers: [option.label] };
            for (const b of row.querySelectorAll("button")) b.classList.toggle("on", b === button);
          };
          row.append(button);
        }
        if (question.isOther !== false) {
          const other = el("input");
          other.placeholder = "其他答案";
          other.oninput = () => { answers[question.id] = { answers: [other.value] }; };
          row.append(other);
        }
        card.append(row);
      }
      const submit = el("button", "cx-btn primary", "提交回答");
      submit.onclick = () => respond({ answers });
      actions.append(submit);
    } else {
      card.append(el("strong", "", "需要在桌面处理的请求"));
      card.append(el("code", "", request.method));
    }
    if (!can("full")) actions.replaceChildren(el("span", "readonly", "审批与回答需要「完全控制」权限，可在 Codex++ 的设备列表里调整。"));
    card.append(actions);
    return card;
  }

  // ---------- Codex 样式：输入卡片下面那一排（加号 / 权限 / 模式 / 项目 … 上下文 / 模型 / 发送）----------
  function pill(svg, label, tone, onClick, { chevron = true, disabled = false, title = "" } = {}) {
    const button = el("button", `cx-pill${tone ? ` ${tone}` : ""}`);
    button.innerHTML = svg;
    if (label) button.append(el("span", "", label));
    if (chevron && label) button.insertAdjacentHTML("beforeend", CX.chev.replace("<svg", '<svg class="chev"'));
    button.disabled = disabled;
    if (title) button.title = title;
    button.onclick = onClick;
    return button;
  }

  function renderControls() {
    const bar = $("controls");
    const isNew = !state.current;
    const running = state.view?.runtime === "active";
    const options = state.optionsFor === state.current ? state.options : null;
    const current = state.view?.controls || options?.current || {};
    const nodes = [pill(CX.plus, "", "", (event) => attachMenu(event.currentTarget), { title: "添加图片或文件" })];
    if (isNew) {
      nodes.push(pill(CX.folder, state.draftCwd ? baseName(state.draftCwd) : "选择项目", "", (event) => projectMenu(event.currentTarget), { title: state.draftCwd }));
    } else {
      const locked = state.applying || !can("full");
      const mode = options?.permissionModes?.find((item) => item.id === current.permissionMode);
      const full = current.permissionMode === "full-access";
      nodes.push(pill(full ? CX.alert : CX.shield, mode?.label || (current.permissionMode === "custom" ? "自定义权限" : "沿用会话权限"), full ? "warn" : "",
        (event) => permissionMenu(event.currentTarget), { disabled: locked || !options, title: mode?.detail || "权限" }));
      const plan = current.collaborationMode === "plan";
      nodes.push(pill(plan ? CX.plan : CX.agent, plan ? "计划模式" : "Agent", plan ? "on" : "", (event) => modeMenu(event.currentTarget), { disabled: locked || !state.view }));
    }
    nodes.push(el("span", "grow"));
    if (!isNew) {
      const usage = state.view?.tokenUsage;
      if (usage?.window) {
        const ratio = Math.max(0, Math.min(1, usage.used / usage.window));
        const ring = el("span", "cx-ring");
        const length = 2 * Math.PI * 6.5;
        ring.innerHTML = `<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-opacity=".3" stroke-width="2"/><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="${(ratio * length).toFixed(1)} ${length.toFixed(1)}" transform="rotate(-90 8 8)"/></svg>`;
        ring.append(`${Math.round(ratio * 100)}%`);
        ring.title = `上下文已用 ${usage.used.toLocaleString()} / ${usage.window.toLocaleString()}`;
        nodes.push(ring);
      }
      const models = options?.models || [];
      const modelId = current.model || state.view?.model;
      const modelLabel = models.find((item) => item.id === modelId)?.label || modelId || "模型";
      const effort = current.effort ? ` ${effortLabels[current.effort] || current.effort}` : "";
      nodes.push(pill("", `${modelLabel}${effort}`, "", (event) => modelMenu(event.currentTarget), { disabled: state.applying || !can("full") || !options, title: "模型与推理强度" }));
    }
    const pending = m.pending();
    const uploading = pending.some((entry) => entry.status === "uploading");
    const hasContent = !!$("input").value.trim() || pending.some((entry) => entry.status === "ready");
    const stop = running && !hasContent;
    const go = el("button", "cx-send");
    go.innerHTML = stop ? CX.stop : CX.up;
    go.title = stop ? "停止" : running ? "插话" : "发送";
    go.disabled = state.busy || uploading || (!hasContent && !stop) || (stop && !can("message"));
    go.onclick = stop ? interrupt : send;
    nodes.push(go);
    bar.replaceChildren(...nodes);
    $("input").placeholder = isNew ? "和 Codex 一起工作" : running ? "运行中，发消息即插话…" : "要求后续变更";
  }

  // ---------- Codex 样式：贴着按钮弹出的菜单 ----------
  function closeMenu() {
    document.getElementById("cxMenu")?.remove();
    document.removeEventListener("pointerdown", outsideMenu, true);
  }
  function outsideMenu(event) {
    if (!event.target.closest?.("#cxMenu")) closeMenu();
  }
  function openMenu(anchor, build) {
    closeMenu();
    const menu = el("div", "cx-menu");
    menu.id = "cxMenu";
    const add = {
      title: (text) => menu.append(el("div", "title", text)),
      sep: () => menu.append(el("div", "sep")),
      node: (node) => menu.append(node),
      item: ({ label, detail, checked, danger, disabled, onClick }) => {
        const button = el("button", `item${danger ? " danger" : ""}`);
        button.append(el("span", "check", checked ? "✓" : ""));
        const text = el("span", "label");
        text.append(el("span", "", label));
        if (detail) text.append(el("small", "", detail));
        button.append(text);
        button.disabled = !!disabled;
        button.onclick = () => { closeMenu(); onClick?.(); };
        menu.append(button);
      },
    };
    build(add);
    // 没有可勾选项的菜单（主机、加号）不留勾选那一列，文字贴左边。
    if (![...menu.querySelectorAll(".check")].some((node) => node.textContent)) for (const node of menu.querySelectorAll(".check")) node.remove();
    document.body.append(menu);
    const rect = anchor.getBoundingClientRect();
    const width = menu.offsetWidth;
    const height = menu.offsetHeight;
    const above = rect.top - height - 6 >= 8 && rect.top > window.innerHeight / 2;
    menu.style.left = `${Math.max(8, Math.min(rect.left, window.innerWidth - width - 8))}px`;
    menu.style.top = `${above ? rect.top - height - 6 : Math.max(8, Math.min(rect.bottom + 6, window.innerHeight - height - 8))}px`;

  // ---------- Codex 样式：发送 ----------
  function autosize() {
    const input = $("input");
    input.style.height = "auto";
    input.style.height = `${Math.min(input.scrollHeight, 220)}px`;
  }

  async function send() {
    const text = $("input").value.trim();
    const pending = m.pending();
    if (pending.some((entry) => entry.status === "uploading")) return toast("附件还在上传…");
    const attachments = pending.filter((entry) => entry.status === "ready").map(({ path, name, kind }) => ({ path, name, kind }));
    if ((!text && !attachments.length) || state.busy) return;
    if (!state.current) return createAndSend(text, attachments);
    state.busy = true;
    state.stickNext = true;
    renderControls();
    try {
      await api("POST", `/threads/${state.current}/messages`, { text, attachments });
      $("input").value = "";
      m.clearPending();
      autosize();
      // 后台会话的推送从发消息起就有，直接连。
      if (!state.socket && !state.poller) connectSocket(state.current);
    } catch (error) {
      toast(error.message);
    } finally {
      state.busy = false;
      renderControls();
    }
  }

  /** 新聊天的第一句话：先建会话再发（带附件时分两步，附件走发消息接口）。 */
  async function createAndSend(text, attachments) {
    const cwd = state.draftCwd;
    if (!cwd) return toast("先选一个项目文件夹");
    state.busy = true;
    renderControls();
    try {
      const data = await api("POST", "/threads", { cwd, text: attachments.length ? undefined : text || undefined });
      if (attachments.length) await api("POST", `/threads/${data.threadId}/messages`, { text, attachments });
      $("input").value = "";
      m.clearPending();
      autosize();
      await loadThreads();
      await selectThread(data.threadId);
      if (state.current === data.threadId && !state.socket && !state.poller) connectSocket(data.threadId);
    } catch (error) {
      toast(error.message);
    } finally {
      state.busy = false;
      renderControls();
    }
  }

  async function interrupt() {
    try { await api("POST", `/threads/${state.current}/interrupt`); } catch (error) { toast(error.message); }
  }

  $("input").addEventListener("keydown", (event) => {
    if (event.key === "Enter" && !event.shiftKey && !event.isComposing && !window.matchMedia?.("(pointer: coarse)").matches) {

  $("input").addEventListener("input", () => { autosize(); renderControls(); });
  // 粘贴截图、拖文件进输入框：直接当附件。
  $("input").addEventListener("paste", (event) => {

  $("compose").addEventListener("dragover", (event) => { event.preventDefault(); $("compose").classList.add("drag"); });
  $("compose").addEventListener("dragleave", () => $("compose").classList.remove("drag"));
  $("compose").addEventListener("drop", (event) => {

  $("refresh").onclick = loadThreads;
  $("cxNew").onclick = () => newChat(null);

  $("cxSearchToggle").onclick = () => {

  // 窄屏：会话页「‹」回侧栏（项目 / 最近）。

  $("open").onclick = async () => {

  };
  // 侧栏定期刷新：别处（桌面、别的设备）开的会话、跑完的会话能及时出现。
  setInterval(() => {
    if (styleNow() === "codex" && state.me && !document.hidden) loadThreads();
  }, 10000);

  // ================= 桌面镜像 =================
  // 把 Codex 桌面窗口的画面投过来（服务端经 CDP 投屏），鼠标 / 触摸 / 滚轮 / 按键发回去。
  // 输入法用本机的：隐藏输入框收字，拼完的文字整段发过去（Input.insertText），回车退格等单独作为按键发。
  const MIRROR_BACK_KEY = "codexPlusRemoteStyleBeforeMirror";
  const mirror = (() => {
    const SENTINEL = "​"; // 输入框里常驻一个零宽字符：手机键盘在空输入框上按退格不发事件
    const SPECIAL = new Set(["Enter", "Backspace", "Delete", "Tab", "Escape", "ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "Home", "End", "PageUp", "PageDown"]);
    const KEYCODES = { Enter: 13, Backspace: 8, Delete: 46, Tab: 9, Escape: 27, ArrowLeft: 37, ArrowUp: 38, ArrowRight: 39, ArrowDown: 40, Home: 36, End: 35, PageUp: 33, PageDown: 34 };
    const s = { socket: null, active: false, meta: null, title: "", composing: false, touch: null, moveQueued: null, resizeTimer: null, retryTimer: null, keyboard: false };
    const canvas = $("mirrorCanvas");
    const context = canvas.getContext("2d");
    const input = $("mirrorInput");

    function status(text, tone = "") {
      $("mirrorStatus").textContent = text;
      $("mirrorDot").className = `dot ${tone}`;
    }
    function tip(text) {
      $("mirrorTip").hidden = !text;
      $("mirrorTip").textContent = text || "";
    }
    const send = (message) => s.socket?.readyState === 1 && s.socket.send(JSON.stringify(message));
    const modifiersOf = (event) => (event.altKey ? 1 : 0) | (event.ctrlKey ? 2 : 0) | (event.metaKey ? 4 : 0) | (event.shiftKey ? 8 : 0);

    function requestFrames() {
      const stage = $("mirrorStage");
      // 高分屏要的像素多、每帧大：长边最多 1920，够看清字，带宽少一半以上。
      const ratio = Math.min(window.devicePixelRatio || 1, 2, 1920 / Math.max(stage.clientWidth, stage.clientHeight, 1));
      // acks：每画完一帧回 frameAck，服务端据此控制路上的帧数（网快就快、网慢就少发，不会攒出延迟）。
      send({ type: "start", width: Math.round(stage.clientWidth * ratio), height: Math.round(stage.clientHeight * ratio), acks: true });
    }

    // 一帧画面（JPEG）：同时只解一帧，解码期间来的只留最新一帧，跟不上时丢旧帧，不会越画越落后。
    let decoding = false;
    let pendingFrame = null;
    async function drawFrame(blob) {
      if (decoding) {
        // 被新帧顶掉的旧帧也算处理完了，照样确认，不然服务端会一直等它。
        if (pendingFrame) send({ type: "frameAck" });
        pendingFrame = blob;
        return;
      }
      decoding = true;
      try {
        const bitmap = await createImageBitmap(blob);
        if (canvas.width !== bitmap.width || canvas.height !== bitmap.height) {
          canvas.width = bitmap.width;
          canvas.height = bitmap.height;
        }
        context.drawImage(bitmap, 0, 0);
        bitmap.close?.();
        tip("");
      } catch {}
      send({ type: "frameAck" });
      decoding = false;
      if (pendingFrame) {
        const next = pendingFrame;
        pendingFrame = null;
        drawFrame(next);
      }
    }

    function connect() {
      clearTimeout(s.retryTimer);
      if (!s.active) return;
      status("连接中…");
      tip("正在连接 Codex 桌面…");
      const scheme = location.protocol === "https:" ? "wss" : "ws";
      const socket = new WebSocket(`${scheme}://${location.host}/api/mirror?token=${encodeURIComponent(token)}`);
      socket.binaryType = "blob";
      s.socket = socket;
      socket.onmessage = async (event) => {
        if (s.socket !== socket) return;
        if (typeof event.data !== "string") {
          drawFrame(event.data);
          return;
        }
        const message = JSON.parse(event.data);
        if (message.type === "ready") {
          s.title = message.title || "Codex";
          status(`已连接 · ${s.title}`, "on");
          requestFrames();
        } else if (message.type === "meta") {
          s.meta = message.meta;
        } else if (message.type === "visibility") {
          tip(message.visible ? "" : "Codex 暂时没有出画面，稍等一下；一直没有的话，在电脑上把 Codex 窗口点出来一次。");
        } else if (message.type === "warning") {
          toast(message.error);
        } else if (message.type === "revoked") {
          stop();
          unauthorized(message.reason);
        } else if (message.type === "error") {
          status("连接失败", "off");
          tip(message.error);
          s.socket = null;
        } else if (message.type === "closed") {
          status(message.reason || "已断开", "off");
          if (message.reconnect) s.retryTimer = setTimeout(connect, 1500);
        }
      };
      socket.onclose = () => {
        if (s.socket !== socket) return;
        s.socket = null;
        if (s.active) {
          status("连接断开，正在重连…", "off");
          s.retryTimer = setTimeout(connect, 2000);
        }
      };
    }

    function start() {
      if (s.active) return;
      s.active = true;
      input.value = SENTINEL;
      connect();
      // 电脑上直接把焦点放到隐藏输入框，打字就能进 Codex；手机上点「键盘」才弹出。
      if (!matchMedia("(pointer: coarse)").matches) focusInput();
    }

    function stop() {
      s.active = false;
      clearTimeout(s.retryTimer);
      const socket = s.socket;
      s.socket = null;
      if (socket) { socket.onclose = null; socket.close(); }
      input.blur();
      hideIme();
    }

    function focusInput() {
      input.focus({ preventScroll: true });
      input.setSelectionRange(input.value.length, input.value.length);
    }

    // ---------- 坐标：画布上的点 → Codex 页面里的点（CSS 像素）----------
    function point(event) {
      const rect = canvas.getBoundingClientRect();
      const width = s.meta?.deviceWidth || canvas.width;
      const height = s.meta?.deviceHeight || canvas.height;
      const x = ((event.clientX - rect.left) / rect.width) * width;
      const y = ((event.clientY - rect.top) / rect.height) * height + (s.meta?.offsetTop || 0);
      return { x: Math.max(0, Math.min(width, x)), y: Math.max(0, y), scale: width / rect.width };
    }
    const buttonOf = (button) => ["left", "middle", "right"][button] || "none";

    canvas.addEventListener("pointerdown", (event) => {
      event.preventDefault();
      canvas.setPointerCapture(event.pointerId);
      const { x, y } = point(event);
      if (event.pointerType === "mouse") {
        send({ type: "mouse", event: "mousePressed", x, y, button: buttonOf(event.button), buttons: event.buttons, clickCount: event.detail || 1, modifiers: modifiersOf(event) });
        focusInput();
      } else {
        s.touch = { id: event.pointerId, startX: event.clientX, startY: event.clientY, lastX: event.clientX, lastY: event.clientY, moved: false };
      }
    });
    canvas.addEventListener("pointermove", (event) => {
      if (event.pointerType === "mouse") {
        // 一帧内只发一次移动
        s.moveQueued = event;
        if (s.moveQueued && !s.moveScheduled) {
          s.moveScheduled = true;
          requestAnimationFrame(() => {
            s.moveScheduled = false;
            const last = s.moveQueued;
            if (!last) return;
            const { x, y } = point(last);
            send({ type: "mouse", event: "mouseMoved", x, y, button: last.buttons & 1 ? "left" : "none", buttons: last.buttons, modifiers: modifiersOf(last) });
          });
        }
        return;
      }
      const touch = s.touch;
      if (!touch || touch.id !== event.pointerId) return;
      if (Math.hypot(event.clientX - touch.startX, event.clientY - touch.startY) > 8) touch.moved = true;
      if (!touch.moved) return;
      // 手指拖动 = 滚动
      const { x, y, scale } = point(event);
      queueWheel(x, y, (touch.lastX - event.clientX) * scale, (touch.lastY - event.clientY) * scale, 0);
      touch.lastX = event.clientX;
      touch.lastY = event.clientY;
    });
    canvas.addEventListener("pointerup", (event) => {
      const { x, y } = point(event);
      if (event.pointerType === "mouse") {
        send({ type: "mouse", event: "mouseReleased", x, y, button: buttonOf(event.button), buttons: event.buttons, clickCount: event.detail || 1, modifiers: modifiersOf(event) });
        return;
      }
      const touch = s.touch;
      s.touch = null;
      if (!touch || touch.moved) return;
      // 轻点 = 单击
      send({ type: "mouse", event: "mousePressed", x, y, button: "left", buttons: 1, clickCount: 1 });
      send({ type: "mouse", event: "mouseReleased", x, y, button: "left", buttons: 0, clickCount: 1 });
      if (s.keyboard) focusInput();
    });
    canvas.addEventListener("pointercancel", () => { s.touch = null; });
    canvas.addEventListener("contextmenu", (event) => event.preventDefault());
    canvas.addEventListener("wheel", (event) => {
      event.preventDefault();
      const { x, y, scale } = point(event);
      const unit = event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? canvas.getBoundingClientRect().height : 1;
      queueWheel(x, y, event.deltaX * unit * scale, event.deltaY * unit * scale, modifiersOf(event));
    }, { passive: false });

    // 触控板一秒上百个滚轮事件，逐个转给 Codex 它会排队、滚动发拖：一个刷新周期内的位移合并成一次发。
    let wheel = null;
    function queueWheel(x, y, deltaX, deltaY, modifiers) {
      if (wheel && wheel.modifiers === modifiers) {
        Object.assign(wheel, { x, y, deltaX: wheel.deltaX + deltaX, deltaY: wheel.deltaY + deltaY });
        return;
      }
      if (wheel) flushWheel();
      wheel = { x, y, deltaX, deltaY, modifiers };
      requestAnimationFrame(flushWheel);
    }
    function flushWheel() {
      if (!wheel) return;
      const { x, y, deltaX, deltaY, modifiers } = wheel;
      wheel = null;
      if (deltaX || deltaY) send({ type: "wheel", x, y, deltaX, deltaY, modifiers });
    }

    // ---------- 键盘与输入法 ----------
    /** macOS 上 Cmd / Option 组合键要带编辑命令，Codex 里才会执行（全选、撤销、按词移动……）。 */
    function commandsFor(event) {
      const key = event.key.length === 1 ? event.key.toLowerCase() : event.key;
      const shift = event.shiftKey;
      if (event.metaKey && !event.altKey) {
        const map = {
          a: ["selectAll"], z: [shift ? "redo" : "undo"], c: ["copy"], x: ["cut"],
          ArrowLeft: [shift ? "moveToBeginningOfLineAndModifySelection" : "moveToBeginningOfLine"],
          ArrowRight: [shift ? "moveToEndOfLineAndModifySelection" : "moveToEndOfLine"],
          ArrowUp: ["moveToBeginningOfDocument"], ArrowDown: ["moveToEndOfDocument"],
          Backspace: ["deleteToBeginningOfLine"],
        };
        return map[key];
      }
      if (event.altKey && !event.metaKey) {
        const map = {
          ArrowLeft: [shift ? "moveWordLeftAndModifySelection" : "moveWordLeft"],
          ArrowRight: [shift ? "moveWordRightAndModifySelection" : "moveWordRight"],
          Backspace: ["deleteWordBackward"], Delete: ["deleteWordForward"],
        };
        return map[key];
      }
      return undefined;
    }

    function sendKey({ key, code, keyCode, modifiers = 0, commands }) {
      const down = key === "Enter" ? { event: "keyDown", text: "\r" } : { event: "rawKeyDown" };
      send({ type: "key", ...down, key, code, keyCode, modifiers, ...(commands ? { commands } : {}) });
      send({ type: "key", event: "keyUp", key, code, keyCode, modifiers });
    }
    const pressKey = (key) => sendKey({ key, code: key, keyCode: KEYCODES[key] || 0 });

    input.addEventListener("keydown", (event) => {
      if (event.isComposing || event.keyCode === 229 || s.composing) return;
      // Cmd/Ctrl+V 交给 paste 事件：粘贴的是本机剪贴板
      if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "v") return;
      const combo = (event.metaKey || event.ctrlKey) && event.key.length === 1;
      if (!SPECIAL.has(event.key) && !combo) return;
      event.preventDefault();
      sendKey({ key: event.key, code: event.code, keyCode: event.keyCode, modifiers: modifiersOf(event), commands: commandsFor(event) });
    });

    /** 把输入框里新打的字发出去；输入框清空到只剩零宽字符。 */
    function flush() {
      const value = input.value;
      input.value = SENTINEL;
      input.setSelectionRange(1, 1);
      if (value === "") return pressKey("Backspace"); // 零宽字符被删了 = 按了退格
      const text = value.split(SENTINEL).join("");
      if (!text) return;
      text.split(/\r?\n/).forEach((line, index) => {
        if (index > 0) pressKey("Enter");
        if (line) send({ type: "text", text: line });
      });
    }
    input.addEventListener("input", (event) => {
      if (s.composing || event.isComposing) {
        showIme(input.value.split(SENTINEL).join(""));
        return;
      }
      flush();
    });
    input.addEventListener("compositionstart", () => { s.composing = true; showIme(""); });
    input.addEventListener("compositionupdate", (event) => showIme(event.data || ""));
    input.addEventListener("compositionend", () => {
      s.composing = false;
      hideIme();
      flush();
    });
    input.addEventListener("paste", (event) => {
      event.preventDefault();
      const text = event.clipboardData?.getData("text/plain");
      if (text) send({ type: "text", text });
    });

    function showIme(text) {
      $("mirrorIme").hidden = !text;
      $("mirrorIme").textContent = text;
    }
    function hideIme() { $("mirrorIme").hidden = true; }

    // ---------- 工具栏 ----------
    $("mirrorKeyboard").onclick = () => {
      s.keyboard = !s.keyboard;
      $("mirrorKeyboard").classList.toggle("on", s.keyboard);
      if (s.keyboard) focusInput(); else input.blur();
    };
    $("mirrorBack").onclick = () => {
      const back = localStorage.getItem(MIRROR_BACK_KEY);
      m.setStyle(back === "chat" || back === "codex" ? back : (matchMedia("(max-width: 720px)").matches ? "chat" : "codex"));
    };
    $("mirrorRetry").onclick = () => { if (s.active) { s.socket?.close(); s.socket = null; connect(); } };
    new ResizeObserver(() => {
      clearTimeout(s.resizeTimer);
      s.resizeTimer = setTimeout(() => s.active && requestFrames(), 300);
    }).observe($("mirrorStage"));

    return { start, stop, get active() { return s.active; } };
  })();

  // ================= 手机界面（聊天样式）=================
  // 四屏：列表（项目）/ 项目（会话）/ 对话 / 设置。和 Codex 样式共用 state、接口和推送，只是另一套呈现。
  const m = (() => {
    const SEEN_KEY = "codexPlusRemoteSeen";
    const ui = { screen: "list", from: "list", project: null, filter: "all", query: "", stick: false, expanded: new Set(), requestCards: new Map() };
    const palette = ["#c8574d", "#3f9a8c", "#c98a3a", "#5677b8", "#8b62b3", "#55995a", "#b9567f", "#5f8ea6", "#a0784f"];
    const coarse = window.matchMedia?.("(pointer: coarse)").matches ?? false;
    const isChat = () => document.documentElement.dataset.style === "chat";
    // 宽屏（电脑浏览器）：照电脑版微信三栏，会话列表和对话并排；窄屏还是手机一屏一屏地切。
    const wideQuery = window.matchMedia?.("(min-width: 900px)");
    const wide = () => !!wideQuery?.matches;
    const svg = (d, attrs = "") => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"${attrs}>${d}</svg>`;
    const ICON = {
      send: svg('<path d="M12 19V5M5 12l7-7 7 7"/>', ' stroke-width="2.4"'),
      stop: svg('<rect x="7" y="7" width="10" height="10" rx="1.5" fill="currentColor"/>'),
      // 无限符号：对应 Codex 手机端的「∞ Agent」。
      agent: svg('<path d="M6.5 15.5a3.5 3.5 0 1 1 0-7c3 0 8 7 11 7a3.5 3.5 0 1 0 0-7c-3 0-8 7-11 7Z"/>'),
      plan: svg('<path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/>'),
      shield: svg('<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/><path d="M12 8v4M12 16h.01"/>'),
      spark: svg('<path d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6 5.6 18.4"/>'),
      bot: svg('<path d="m7 9 3 3-3 3M13 15h4"/>', ' stroke-width="2.2"'),
      file: svg('<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6"/>'),
      folder: svg('<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/>'),
    };
    // 附件：上传到这台电脑的上传目录，发消息时带上路径。
    ui.pending = [];
    const rawUrl = (path) => `/api/uploads/raw?path=${encodeURIComponent(path)}&token=${encodeURIComponent(token)}`;

    // ---------- 未读：每个会话上次看到时的 updatedAt，存在本机 ----------
    let seen = null;
    try { seen = JSON.parse(localStorage.getItem(SEEN_KEY) || "null"); } catch {}
    const saveSeen = () => { try { localStorage.setItem(SEEN_KEY, JSON.stringify(seen)); } catch {} };
    function markSeen(id) {
      if (!id) return;
      seen = seen || {};
      seen[id] = Math.floor(Date.now() / 1000) + 1;
      saveSeen();
    }
    function initSeen(threads) {
      if (seen) return;
      // 第一次打开：已有的会话都算看过，免得满屏红点。
      seen = {};
      for (const thread of threads) seen[thread.id] = Number(thread.updatedAt) || 0;
      saveSeen();
    }
    const unread = (thread) => !!seen && thread.id !== state.current && (Number(thread.updatedAt) || 0) > (seen[thread.id] || 0);

    // ---------- 小工具 ----------
    const hash = (text) => { let value = 7; for (const ch of String(text)) value = (value * 31 + ch.codePointAt(0)) >>> 0; return value; };
    const colorOf = (key) => palette[hash(key) % palette.length];
    const firstChar = (text) => { const ch = [...String(text || "").trim()][0] || "#"; return /[a-z]/i.test(ch) ? ch.toUpperCase() : ch; };
    const pad = (value) => String(value).padStart(2, "0");
    /** 微信式时间：今天 时:分；昨天；本周 周几；今年 几月几日；更早 年月日。 */
    function chatTime(seconds, withClock = false) {
      if (!seconds) return "";
      const date = new Date(seconds * 1000);
      const now = new Date();
      const clock = `${pad(date.getHours())}:${pad(date.getMinutes())}`;
      const dayStart = (value) => new Date(value.getFullYear(), value.getMonth(), value.getDate()).getTime();
      const days = Math.round((dayStart(now) - dayStart(date)) / 86400000);
      if (days <= 0) return clock;
      let day;
      if (days === 1) day = "昨天";
      else if (days < 7) day = `周${"日一二三四五六"[date.getDay()]}`;
      else if (date.getFullYear() === now.getFullYear()) day = `${date.getMonth() + 1}月${date.getDate()}日`;
      else day = `${date.getFullYear()}年${date.getMonth() + 1}月${date.getDate()}日`;
      return withClock ? `${day} ${clock}` : day;
    }
    const formatTokens = (value) => (value >= 1e6 ? `${+(value / 1e6).toFixed(value % 1e6 ? 1 : 0)}M` : value >= 1e3 ? `${Math.round(value / 1e3)}K` : String(value));

    /** 头像：一个会话用单字方块；多个会话按微信群头像的排法拼九宫格，每格是会话标题的首字。 */
    function avatarNode(tiles, { badge = 0, dot = false } = {}) {
      const box = el("div", "m-avatar");
      const face = el("div", "face");
      if (tiles.length === 1) {
        face.classList.add("single");
        face.style.background = colorOf(tiles[0].key);
        face.textContent = tiles[0].char;
      } else {
        const count = Math.min(tiles.length, 9);
        const layout = { 2: [2], 3: [1, 2], 4: [2, 2], 5: [2, 3], 6: [3, 3], 7: [1, 3, 3], 8: [2, 3, 3], 9: [3, 3, 3] }[count];
        const columns = count <= 4 ? 2 : 3;
        const size = Math.floor((48 - 4 - 2 * (columns - 1)) / columns);
        let index = 0;
        for (const perRow of layout) {
          const row = el("div", "grid-row");
          for (let k = 0; k < perRow; k += 1, index += 1) {
            const tile = el("div", "tile", tiles[index].char);
            Object.assign(tile.style, { width: `${size}px`, height: `${size}px`, background: colorOf(tiles[index].key), fontSize: `${Math.round(size * 0.6)}px` });
            row.append(tile);
          }
          face.append(row);
        }
      }
      box.append(face);
      if (badge) box.append(el("b", "badge", badge > 99 ? "99+" : String(badge)));
      else if (dot) box.append(el("b", "badge dot"));
      return box;
    }

    function rowNode({ avatar, title, sub, time, active, onClick }) {
      const row = el("div", `m-row${active ? " active" : ""}`);
      const body = el("div", "m-row-body");
      const head = el("div", "m-row-head");
      head.append(el("div", "m-row-title", title), el("div", "m-row-time", time));
      const subLine = el("div", "m-row-sub");
      subLine.append(...sub);
      body.append(head, subLine);
      row.append(avatar, body);
      row.onclick = onClick;
      return row;
    }

    const byRecent = (a, b) => (Number(b.updatedAt) || 0) - (Number(a.updatedAt) || 0);
    const threadTitle = (thread) => thread.title || thread.preview || "（未命名）";

    function filteredThreads() {
      const query = ui.query.trim().toLowerCase();
      return state.threads.filter((thread) => {
        if (ui.filter === "running" && !isRunning(thread)) return false;
        if (ui.filter === "unread" && !unread(thread)) return false;
        return !query || [thread.title, thread.preview, thread.cwd].some((value) => String(value || "").toLowerCase().includes(query));
      });
    }

    function setBackCount(id, count) {
      const node = $(id);
      node.hidden = !count;
      node.textContent = count > 99 ? "99+" : String(count);
    }

    // ---------- 列表（项目）----------
    function renderList() {
      const rows = $("mRows");
      const total = state.threads.filter(unread).length + (jj.summary?.unread || 0);
      $("mTabBadge").hidden = !total;
      $("mTabBadge").textContent = total > 99 ? "99+" : String(total);
      // 加加置顶（搜索、筛选时不显示）。
      const pinned = jj.summary && !ui.query.trim() && ui.filter === "all" ? [jjRow()] : [];
      if (!state.threads.length) return rows.replaceChildren(...pinned, el("div", "m-empty", "还没有会话。点右上角 ⊕ 新建一个。"));
      const threads = filteredThreads();
      if (!threads.length) return rows.replaceChildren(...pinned, el("div", "m-empty", ui.query ? "没有匹配的会话" : "没有符合筛选的会话"));
      rows.replaceChildren(...pinned, ...projectsOf(threads).map((project) => {
        const sessions = [...project.threads].sort(byRecent);
        const single = sessions.length === 1;
        const tiles = single
          ? [{ char: firstChar(project.name), key: project.cwd || project.name }]
          : sessions.slice(0, 9).map((thread) => ({ char: firstChar(threadTitle(thread)), key: thread.id }));
        const sub = [];
        if (project.running) sub.push(el("span", "running", `${project.running} 个运行中 · `));
        sub.push(document.createTextNode(threadTitle(sessions[0])));
        return rowNode({
          avatar: avatarNode(tiles, { badge: sessions.filter(unread).length }),
          title: single ? project.name : `${project.name}（${sessions.length}）`,
          sub,
          time: chatTime(project.updatedAt),
          active: wide() && sessions.some((thread) => thread.id === state.current),
          // 只有一个会话的项目直接进对话（和微信单聊一样）。
          onClick: () => (single ? openChat(sessions[0].id, "list") : openProject(project.cwd)),
        });
      }));
    }

    // ---------- 项目（会话）----------
    function renderProject() {
      if (ui.project === null) return;
      const sessions = state.threads.filter((thread) => (thread.cwd || "") === ui.project).sort(byRecent);
      $("mProjectTitle").textContent = `${baseName(ui.project)}（${sessions.length}）`;
      setBackCount("mProjectBackCount", state.threads.filter((thread) => unread(thread) && (thread.cwd || "") !== ui.project).length);
      $("mProjectNew").hidden = !can("message");
      const rows = $("mProjectRows");
      if (!sessions.length) return rows.replaceChildren(el("div", "m-empty", "这个项目还没有会话"));
      rows.replaceChildren(...sessions.map((thread) => {
        const sub = [];
        if (isRunning(thread)) sub.push(el("span", "running", "运行中 · "));
        sub.push(document.createTextNode(thread.preview && thread.preview !== thread.title ? thread.preview : relative(thread.updatedAt)));
        return rowNode({
          avatar: avatarNode([{ char: firstChar(threadTitle(thread)), key: thread.id }], { dot: unread(thread) }),
          title: threadTitle(thread),
          sub,
          time: chatTime(thread.updatedAt),
          active: thread.id === state.current,
          onClick: () => openChat(thread.id, "project"),
        });
      }));
    }

    // ---------- 对话 ----------
    function msgNode(direction, content) {
      const node = el("div", `m-msg ${direction}`);
      const who = el("div", "who");
      if (direction === "out") who.textContent = "我";
      else who.innerHTML = ICON.bot;
      node.append(who, content);
      return node;
    }

    /** 文字气泡：认 ``` 代码块和 `行内代码`，其余原样（不解析 HTML）。 */
    function textBubble(text, tag) {
      const node = el("div", "m-bubble");
      if (tag) node.append(el("span", "tag", tag));
      String(text || "").split(/```[^\n]*\n?/).forEach((part, index) => {
        if (!part) return;
        if (index % 2 === 1) return node.append(el("pre", "", part.replace(/\n$/, "")));
        const trimmed = index > 0 ? part.replace(/^\n/, "") : part;
        for (const segment of trimmed.split(/(`[^`\n]+`)/)) {
          if (/^`[^`]+`$/.test(segment)) node.append(el("code", "", segment.slice(1, -1)));
          else if (segment) node.append(document.createTextNode(segment));
        }
      });
      return node;
    }

    /** 消息里的图片 / 文件。上传目录里的图片能取原图；别处的（比如桌面上粘贴的）只显示占位。 */
    function attachmentNode(attachment) {
      if (attachment.kind === "image") {
        const box = el("div", "m-photo");
        const src = attachment.path ? rawUrl(attachment.path) : attachment.url && /^(data:image|https?:)/.test(attachment.url) ? attachment.url : null;
        if (!src) {
          box.classList.add("missing");
          box.textContent = "[图片]";
          return box;
        }
        const img = el("img");
        img.alt = attachment.name || "图片";
        img.loading = "lazy";
        img.src = src;
        img.onerror = () => { box.classList.add("missing"); box.replaceChildren(document.createTextNode("[图片]")); };
        // 图片加载出来会把内容撑高：原本在底部就继续贴着底部。
        img.onload = () => {
          const log = $("mLog");
          if (log.scrollHeight - log.scrollTop - log.clientHeight < img.clientHeight + 160) log.scrollTop = log.scrollHeight;
        };
        box.append(img);
        box.onclick = () => openViewer(src);
        return box;
      }
      const card = el("div", "m-file");
      card.innerHTML = ICON.file;
      card.append(el("span", "", attachment.name || "文件"));
      return card;
    }

    function openViewer(src) {
      const viewer = el("div", "m-viewer");
      const img = el("img");
      img.src = src;
      viewer.append(img);
      viewer.onclick = () => viewer.remove();
      document.body.append(viewer);
    }

    // ---------- 附件：选择、压缩、上传 ----------
    function pickFiles(accept, capture) {
      const input = document.createElement("input");
      input.type = "file";
      input.multiple = !capture;
      if (accept) input.accept = accept;
      if (capture) input.setAttribute("capture", capture);
      input.onchange = () => { for (const file of input.files || []) addPending(file); };
      input.click();
    }

    /** 大图先在手机上缩到长边 2048、转 JPEG，上传快，也省模型的上下文。 */
    async function shrinkImage(file) {
      if (!file.type.startsWith("image/") || file.type === "image/gif" || file.size < 1.5 * 1024 * 1024) return file;
      try {
        const bitmap = await createImageBitmap(file);
        const scale = Math.min(1, 2048 / Math.max(bitmap.width, bitmap.height));
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(bitmap.width * scale);
        canvas.height = Math.round(bitmap.height * scale);
        canvas.getContext("2d").drawImage(bitmap, 0, 0, canvas.width, canvas.height);
        const blob = await new Promise((resolve) => canvas.toBlob(resolve, "image/jpeg", 0.85));
        if (!blob || blob.size >= file.size) return file;
        return new File([blob], file.name.replace(/\.[^.]+$/, "") + ".jpg", { type: "image/jpeg" });
      } catch {
        return file;
      }
    }

    function upload(file, onProgress) {
      return new Promise((resolve, reject) => {
        const request = new XMLHttpRequest();
        request.open("POST", "/api/uploads");
        request.setRequestHeader("Authorization", `Bearer ${token}`);
        request.setRequestHeader("Content-Type", file.type || "application/octet-stream");
        request.setRequestHeader("X-File-Name", encodeURIComponent(file.name || "file"));
        request.upload.onprogress = (event) => event.lengthComputable && onProgress(event.loaded / event.total);
        request.onload = () => {
          let payload = {};
          try { payload = JSON.parse(request.responseText); } catch {}
          if (request.status === 401) unauthorized(payload.error);
          if (payload.ok) resolve(payload.data);
          else reject(new Error(payload.error || `HTTP ${request.status}`));
        };
        request.onerror = () => reject(new Error("上传失败，检查网络"));
        request.send(file);
      });
    }

    async function addPending(original) {
      if (ui.pending.length >= 9) return toast("一次最多带 9 个附件");
      const isImage = original.type.startsWith("image/");
      const entry = { key: Math.random().toString(36).slice(2), name: original.name || "文件", kind: isImage ? "image" : "file", status: "uploading", progress: 0,
        preview: isImage ? URL.createObjectURL(original) : null };
      ui.pending.push(entry);
      renderAttach();
      try {
        const file = await shrinkImage(original);
        const data = await upload(file, (ratio) => { entry.progress = ratio; renderAttach(); });
        Object.assign(entry, { status: "ready", path: data.path, name: data.name, kind: data.kind });
      } catch (error) {
        entry.status = "error";
        toast(`${entry.name}：${error.message}`);
      }
      renderAttach();
    }

    function removePending(key) {
      const entry = ui.pending.find((item) => item.key === key);
      if (entry?.preview) URL.revokeObjectURL(entry.preview);
      ui.pending = ui.pending.filter((item) => item.key !== key);
      renderAttach();
    }

    function renderAttach() {
      for (const tray of [$("mAttach"), $("cxAttach")]) fillTray(tray);
      renderComposer();
      if (document.documentElement.dataset.style === "codex") renderControls();
    }

    function fillTray(tray) {
      tray.hidden = !ui.pending.length;
      tray.replaceChildren(...ui.pending.map((entry) => {
        const item = el("div", `item ${entry.status}`);
        item.dataset.progress = `${Math.round(entry.progress * 100)}%`;
        if (entry.preview) {
          const img = el("img");
          img.src = entry.preview;
          item.append(img);
        } else {
          item.innerHTML = ICON.file;
          item.append(el("span", "name", entry.name));
        }
        const remove = el("button", "x", "×");
        remove.setAttribute("aria-label", "移除");
        remove.onclick = () => removePending(entry.key);
        item.append(remove);
        return item;
      }));
    }

    function openAttachSheet() {
      openSheet("", (body) => {
        body.append(
          optionButton({ label: "照片", detail: "从相册选，可多选", onClick: () => pickFiles("image/*") }),
          optionButton({ label: "拍照", onClick: () => pickFiles("image/*", "environment") }),
          optionButton({ label: "文件", detail: "代码、文档、日志等，Codex 会去读它", onClick: () => pickFiles("") }),
        );
      });
    }

    function typingBubble() {
      const node = el("div", "m-bubble typing");
      node.append(el("i"), el("i"), el("i"));
      return node;
    }

    function commandCard(item) {
      const card = el("div", "m-card");
      const [label, tone] = { completed: ["完成", "ok"], failed: ["失败", "bad"], declined: ["已拒绝", "bad"], inProgress: ["运行中", ""] }[item.status] || [item.status || "", ""];
      const head = el("div", "m-card-head");
      head.append(el("span", "", "⌘ 执行命令"), el("span", `state ${tone}`, label));
      const body = el("div", "m-card-body");
      body.append(el("code", "m-cmd", shownCommand(item.command)));
      if (item.aggregatedOutput) {
        const output = el("pre", "out", item.aggregatedOutput);
        const key = item.id || item.command;
        output.hidden = !ui.expanded.has(key);
        body.append(output);
        card.style.cursor = "pointer";
        card.onclick = () => {
          output.hidden = !output.hidden;
          if (output.hidden) ui.expanded.delete(key); else ui.expanded.add(key);
        };
      }
      card.append(head, body);
      return card;
    }

    function fileCard(item) {
      const card = el("div", "m-card");
      const files = (item.changes || []).map((change) => change.path).filter(Boolean);
      const head = el("div", "m-card-head");
      head.append(el("span", "", `✎ 改动了 ${files.length} 个文件`), el("span", "state", item.status === "completed" ? "已应用" : item.status || ""));
      const body = el("div", "m-card-body");
      body.append(el("code", "m-cmd", files.join("\n")));
      card.append(head, body);
      return card;
    }

    function turnNodes(turn) {
      const nodes = [];
      for (const item of turn.items || []) {
        switch (item.type) {
          case "userMessage":
            for (const attachment of item.attachments || []) nodes.push(msgNode("out", attachmentNode(attachment)));
            if (item.text || !(item.attachments || []).length) nodes.push(msgNode("out", textBubble(item.text)));
            break;
          case "steeringUserMessage": nodes.push(msgNode("out", textBubble(item.text, "插话"))); break;
          case "agentMessage": if (item.text) nodes.push(msgNode("in", textBubble(item.text))); break;
          case "commandExecution": nodes.push(msgNode("in", commandCard(item))); break;
          case "fileChange": nodes.push(msgNode("in", fileCard(item))); break;
          case "userInputResponse": nodes.push(el("div", "m-tip", "已回答提问")); break;
          case "modelChanged": nodes.push(el("div", "m-tip", `模型切换为 ${item.toModel || "?"}`)); break;
          case "contextCompaction": nodes.push(el("div", "m-tip", "已压缩上下文")); break;
          case "webSearch": nodes.push(el("div", "m-tip", `搜索：${item.query || ""}`)); break;
          default: break;
        }
      }
      if (turn.status === "interrupted") nodes.push(el("div", "m-tip", "已停止这一轮"));
      if (turn.status === "failed" || turn.error) {
        const tip = el("div", "m-tip error", `这一轮失败了：${turn.error?.message || "没有拿到失败原因"}`);
        if (turn.error?.details) tip.title = turn.error.details;
        nodes.push(tip);
      }
      return nodes;
    }

    /** 审批 / 提问卡片。同一个请求复用同一个节点，推送重绘时不丢已选的答案。加加贴的卡片属于别的会话，传 threadId。 */
    function requestCard(request, threadId = state.current, onDone = null) {
      const key = `${threadId}:${JSON.stringify(request.id)}`;
      const cached = ui.requestCards.get(key);
      if (cached) return cached;
      const card = el("div", "m-card attention");
      const params = request.params || {};
      const foot = el("div", "m-card-foot");
      const respond = async (body) => {
        for (const button of card.querySelectorAll("button")) button.disabled = true;
        ui.stick = true;
        try {
          await api("POST", `/threads/${threadId}/requests/${encodeURIComponent(JSON.stringify(request.id))}`, body);
          onDone?.();
        } catch (error) {
          toast(error.message);
          for (const button of card.querySelectorAll("button")) button.disabled = false;
        }
      };
      const head = el("div", "m-card-head");
      const body = el("div", "m-card-body");
      if (request.method === "item/commandExecution/requestApproval" || request.method === "item/fileChange/requestApproval") {
        const isCommand = request.method.includes("commandExecution");
        head.append(el("span", "", isCommand ? "⌘ 请求执行命令" : "✎ 请求修改文件"));
        if (params.reason) body.append(el("div", "reason", params.reason));
        if (isCommand) body.append(el("code", "m-cmd", shownCommand(params.command)));
        const decisions = (params.availableDecisions || ["accept", "decline"]).filter((decision) => typeof decision === "string");
        if (!decisions.includes("decline") && !decisions.includes("cancel")) decisions.push("decline");
        const labels = { accept: "同意", acceptForSession: "本会话都同意", decline: "拒绝", cancel: "拒绝并停止" };
        for (const decision of decisions.slice(0, 3)) {
          const button = el("button", decision === "accept" ? "primary" : decision === "decline" || decision === "cancel" ? "danger" : "", labels[decision] || decision);
          button.onclick = (event) => { event.stopPropagation(); respond({ decision }); };
          foot.append(button);
        }
      } else if (request.method === "item/tool/requestUserInput") {
        head.append(el("span", "", "? 模型在提问"));
        const answers = {};
        for (const question of params.questions || []) {
          body.append(el("div", "reason", question.question || question.header || ""));
          const choices = el("div", "choices");
          for (const option of question.options || []) {
            const button = el("button", "", option.label);
            button.onclick = () => {
              answers[question.id] = { answers: [option.label] };
              for (const other of choices.querySelectorAll("button")) other.classList.toggle("on", other === button);
            };
            choices.append(button);
          }
          if (question.isOther !== false) {
            const input = el("input");
            input.placeholder = "其他答案";
            input.oninput = () => { answers[question.id] = { answers: [input.value] }; };
            choices.append(input);
          }
          body.append(choices);
        }
        const submit = el("button", "primary", "提交回答");
        submit.onclick = () => respond({ answers });
        foot.append(submit);
      } else {
        head.append(el("span", "", "需要在桌面处理"));
        body.append(el("code", "m-cmd", request.method));
      }
      card.append(head, body);
      card.append(can("full") ? foot : el("div", "readonly", "审批与回答需要「完全控制」权限"));
      ui.requestCards.set(key, card);
      return card;
    }

    function renderChat() {
      if ($("mChat").hidden) return;
      const view = state.view;
      renderComposer();
      if (!view) return;
      markSeen(state.current);
      $("mChatTitle").textContent = view.title || "（未命名）";
      const running = view.runtime === "active";
      $("mChatState").textContent = running ? (view.headless ? "后台运行中…" : "运行中…") : view.headless ? "在后台运行，桌面不会切过来" : view.live ? "桌面已打开" : "";
      setBackCount("mChatBackCount", state.threads.filter(unread).length);
      const log = $("mLog");
      const stick = nearBottom(log) || ui.stick;
      ui.stick = false;
      const nodes = [];
      if (view.truncatedTurns) nodes.push(el("div", "m-tip", `更早的 ${view.truncatedTurns} 轮未显示`));
      let lastShown = 0;
      for (const turn of view.turns || []) {
        const ms = Number(turn.startedAtMs) || Number(turn.items?.[0]?.startedAtMs) || 0;
        if (ms && ms - lastShown > 5 * 60 * 1000) {
          nodes.push(el("div", "m-time-tip", chatTime(ms / 1000, true)));
          lastShown = ms;
        }
        nodes.push(...turnNodes(turn));
      }
      const lastItem = view.turns?.at(-1)?.items?.at(-1);
      if (running && lastItem?.type !== "agentMessage" && !(view.requests || []).length) nodes.push(msgNode("in", typingBubble()));
      const liveKeys = new Set();
      for (const request of view.requests || []) {
        liveKeys.add(`${state.current}:${JSON.stringify(request.id)}`);
        nodes.push(msgNode("in", requestCard(request)));
      }
      for (const key of [...ui.requestCards.keys()]) if (!liveKeys.has(key)) ui.requestCards.delete(key);
      if (!nodes.length) nodes.push(el("div", "m-empty", "还没有消息，发一条开始吧"));
      log.replaceChildren(...nodes);
      if (stick) log.scrollTop = log.scrollHeight;
    }

    // ---------- 输入区 ----------
    function autosize() {
      const input = $("mInput");
      if (wide()) { input.style.height = ""; return; }
      input.style.height = "38px";
      input.style.height = `${Math.min(input.scrollHeight, 132)}px`;
    }

    function renderComposer() {
      const allowed = can("message");
      $("mComposer").hidden = !allowed;
      $("mReadonly").hidden = allowed;
      const running = state.view?.runtime === "active";
      const ready = ui.pending.filter((entry) => entry.status === "ready");
      const uploading = ui.pending.some((entry) => entry.status === "uploading");
      const hasText = !!$("mInput").value.trim() || ready.length > 0;
      const go = $("mGo");
      go.disabled = uploading;
      go.setAttribute("aria-label", hasText ? (running ? "插话" : "发送") : "停止");
      if (wide()) {
        // 电脑版微信：右下角一直有「发送」，没字时变灰；运行中没字时是「停止」。
        const stop = running && !hasText;
        go.hidden = false;
        go.className = `go ${stop ? "stop" : "send"}${hasText ? " ready" : ""}`;
        go.textContent = stop ? "停止" : "发送";
        go.disabled = uploading || (!hasText && !stop);
        $("mInput").placeholder = running ? "运行中，发消息即插话（Enter 发送，Shift+Enter 换行）" : "";
      } else {
        go.hidden = !hasText && !running;
        go.className = `go ${hasText ? "send" : "stop"}`;
        go.innerHTML = hasText ? ICON.send : ICON.stop;
        $("mInput").placeholder = running ? "运行中，发消息即插话…" : "发消息...";
      }
      renderChips();
    }

    function chip(icon, label, tone, onClick) {
      const button = el("button", tone || "");
      button.innerHTML = icon;
      button.append(el("span", "", label));
      button.disabled = state.applying || !can("full");
      button.onclick = onClick;
      return button;
    }

    function currentControls() {
      const options = state.optionsFor === state.current ? state.options : null;
      return { options, current: state.view?.controls || options?.current || {} };
    }

    function renderChips() {
      const box = $("mChips");
      if (!state.view) return box.replaceChildren();
      const { options, current } = currentControls();
      const plan = current.collaborationMode === "plan";
      const mode = options?.permissionModes?.find((item) => item.id === current.permissionMode);
      const model = options?.models?.find((item) => item.id === current.model);
      const modelId = current.model || state.view.model;
      const modelLabel = model?.label || options?.models?.find((item) => item.id === modelId)?.label || modelId || "模型";
      const effort = current.effort ? effortLabels[current.effort] || current.effort : "";
      const chips = [
        chip(plan ? ICON.plan : ICON.agent, plan ? "计划" : "Agent", plan ? "on" : "", openModeSheet),
        chip(ICON.shield, mode?.label || (current.permissionMode === "custom" ? "自定义权限" : "沿用权限"), current.permissionMode === "full-access" ? "warn" : "", openPermissionSheet),
        chip(ICON.spark, effort ? `${modelLabel} · ${effort}` : modelLabel, "", openModelSheet),
      ];
      const usage = state.view.tokenUsage;
      if (usage?.window) {
        const ratio = Math.max(0, Math.min(1, usage.used / usage.window));
        const ring = el("div", "ring");
        const circumference = 2 * Math.PI * 7;
        ring.innerHTML = `<svg viewBox="0 0 18 18"><circle cx="9" cy="9" r="7" fill="none" stroke="currentColor" stroke-opacity=".25" stroke-width="2"/><circle cx="9" cy="9" r="7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-dasharray="${(ratio * circumference).toFixed(1)} ${circumference.toFixed(1)}" transform="rotate(-90 9 9)"/></svg>`;
        ring.append(el("span", "", `${formatTokens(usage.used)} / ${formatTokens(usage.window)}`));
        ring.title = "上下文用量";
        chips.push(ring);
      }
      box.replaceChildren(...chips);
    }

    async function send() {
      const text = $("mInput").value.trim();
      if (ui.pending.some((entry) => entry.status === "uploading")) return toast("附件还在上传…");
      const attachments = ui.pending.filter((entry) => entry.status === "ready").map(({ path, name, kind }) => ({ path, name, kind }));
      if (!text && !attachments.length) {
        if (state.view?.runtime === "active") await interrupt();
        return;
      }
      if (!state.current || state.busy) return;
      state.busy = true;
      ui.stick = true;
      $("mGo").disabled = true;
      try {
        await api("POST", `/threads/${state.current}/messages`, { text, attachments });
        $("mInput").value = "";
        for (const entry of ui.pending) if (entry.preview) URL.revokeObjectURL(entry.preview);
        ui.pending = [];
        renderAttach();
        autosize();
        if (!state.socket && !state.poller) connectSocket(state.current);
      } catch (error) {
        toast(error.message);
      } finally {
        state.busy = false;
        $("mGo").disabled = false;
        renderComposer();
      }
    }

    async function interrupt() {
      try { await api("POST", `/threads/${state.current}/interrupt`); } catch (error) { toast(error.message); }
    }

    async function openInDesktop() {
      try {
        toast("正在桌面打开会话…");
        const view = await api("POST", `/threads/${state.current}/open`);
        applyView(view);
        connectSocket(state.current);
      } catch (error) { toast(error.message); }
    }

    // ---------- 底部弹出菜单 ----------
    function closeSheet() { document.getElementById("mSheetMask")?.remove(); }
    function openSheet(title, build) {
      closeSheet();
      const mask = el("div", "m-mask");
      mask.id = "mSheetMask";
      const sheet = el("div", "m-sheet");
      if (title) sheet.append(el("div", "m-sheet-title", title));
      const body = el("div", "m-sheet-body");
      build(body);
      const cancel = el("button", "cancel", "取消");
      cancel.onclick = closeSheet;
      sheet.append(body, cancel);
      mask.append(sheet);
      mask.onclick = (event) => { if (event.target === mask) closeSheet(); };

    function optionButton({ label, detail, checked, danger, center, disabled, onClick }) {
      const button = el("button", `opt${danger ? " danger" : ""}${center ? " center" : ""}`);
      const text = el("span", "label");
      text.append(el("span", "", label));
      if (detail) text.append(el("small", "", detail));
      button.append(text);
      if (checked) button.append(el("span", "check", "✓"));
      button.disabled = !!disabled;

    function openModeSheet() {
      const { current } = currentControls();
      const plan = current.collaborationMode === "plan";
      openSheet("模式", (body) => {
        body.append(
          optionButton({ label: "Agent", detail: "直接动手做", checked: !plan, onClick: () => plan && changeSettings({ collaborationMode: "default" }) }),
          optionButton({
            label: "计划", detail: "先和你讨论出完整方案，再动手", checked: plan,
            onClick: () => {
              if (plan) return;
              const desktopNeeded = !state.view?.live || state.view?.headless;
              changeSettings({ collaborationMode: "plan" }, desktopNeeded ? "计划模式要在桌面里用，会让桌面 Codex 打开这个会话。继续吗？" : null);

      const { options, current } = currentControls();
      if (!options) return toast("还在读取可选项…");
      openSheet("权限", (body) => {
        for (const mode of options.permissionModes) {
          body.append(optionButton({
            label: mode.label, detail: mode.detail, checked: mode.id === current.permissionMode, danger: mode.id === "full-access",
            onClick: () => mode.id !== current.permissionMode && changeSettings({ permissionMode: mode.id },
              mode.id === "full-access" ? "完全访问：命令不经沙箱、不再询问，直接在这台电脑上执行。确定切换吗？" : null),
          }));

    function openModelSheet() {
      const { options, current } = currentControls();
      if (!options) return toast("还在读取可选项…");
      const models = [...options.models];
      if (current.model && !models.some((model) => model.id === current.model)) models.unshift({ id: current.model, label: current.model, efforts: [] });
      const model = models.find((item) => item.id === current.model);
      openSheet("模型与推理强度", (body) => {
        body.append(el("div", "section", "推理强度"));
        const efforts = el("div", "seg-row");
        const list = model?.efforts?.length ? model.efforts : ["low", "medium", "high"];
        for (const effort of [null, ...list]) {
          const label = effort ? effortLabels[effort] || effort : `默认${model?.defaultEffort ? `（${effortLabels[model.defaultEffort] || model.defaultEffort}）` : ""}`;
          const button = el("button", (current.effort || null) === effort ? "on" : "", label);
          button.onclick = () => { closeSheet(); if ((current.effort || null) !== effort) changeSettings({ effort }); };
          efforts.append(button);
        }
        body.append(efforts, el("div", "section", "模型"));
        for (const item of models) {
          body.append(optionButton({ label: item.label || item.id, detail: item.description, checked: item.id === current.model,
            onClick: () => item.id !== current.model && changeSettings({ model: item.id }) }));

      openSheet(view.cwd || "", (body) => {
        if ((!view.live || view.headless) && can("message")) {
          body.append(optionButton({ label: "在桌面打开", detail: running ? "等这一轮跑完再打开" : "让桌面 Codex 切到这个会话", disabled: running, onClick: openInDesktop }));
        }
        if (running && can("message")) body.append(optionButton({ label: "停止这一轮", danger: true, onClick: interrupt }));
        if (view.cwd && can("message")) body.append(optionButton({ label: "在这个项目新建会话", detail: view.cwd, onClick: () => openNewSheet(view.cwd) }));
        body.append(optionButton({ label: "刷新", onClick: () => selectThread(state.current) }));

    function openFilterSheet() {

        for (const [id, label] of [["all", "全部会话"], ["running", "只看运行中"], ["unread", "只看未读"]]) {

          optionButton({ label: state.me?.kind === "device" ? state.me.name : "本机浏览器", detail: `这台设备 · ${roleText(state.me?.role)}`, disabled: true }),

    /**
     * 新建会话。在项目里点 ⊕（或对话里「在这个项目新建会话」）时 `presetCwd` 已定，不用选目录；
     * 在列表上点 ⊕ 时从已有项目里挑，或「选择其他文件夹」浏览这台电脑上的目录。
     */
    function openNewSheet(presetCwd, chosenCwd) {
      if (!can("message")) return toast("这台设备只能查看");
      const projects = projectsOf(state.threads).filter((project) => project.cwd);
      let cwd = presetCwd ?? chosenCwd ?? projects[0]?.cwd ?? "";
      const draft = openNewSheet.draft || { name: "", text: "" };
      openNewSheet.draft = null;
      openSheet(presetCwd != null ? `在「${baseName(presetCwd)}」新建会话` : "新建会话", (body) => {
        const name = el("input");
        name.placeholder = "会话名称（可选）";

        const text = el("textarea");
        text.placeholder = "第一条消息（可选）";
        text.value = draft.text;
        const keepDraft = () => { openNewSheet.draft = { name: name.value, text: text.value }; };
        if (presetCwd == null) {
          body.append(el("div", "section", "项目"));
          const row = el("div", "seg-row");
          const chosenLine = el("div", "chosen");

          const browse = el("button", "", "选择其他文件夹…");
          browse.onclick = () => { keepDraft(); openFolderSheet(cwd || null, (picked) => openNewSheet(null, picked)); };
          chosenLine.append(chosenText, browse);
          for (const project of projects.slice(0, 12)) {
            const button = el("button", project.cwd.replace(/\/+$/, "") === cwd.replace(/\/+$/, "") ? "on" : "", project.name);

              cwd = project.cwd;

              for (const other of row.querySelectorAll("button")) other.classList.toggle("on", other === button);

          pick.style.paddingTop = "0";
          pick.style.paddingBottom = "0";
          pick.append(chosenLine);
          body.append(pick);

        const create = el("button", "primary-btn", "创建");

          if (!cwd) return toast("先选一个项目或文件夹");
          create.disabled = true;
          try {
            const data = await api("POST", "/threads", { cwd, name: name.value.trim() || undefined, text: text.value.trim() || undefined });

            await loadThreads();

    /** 浏览这台电脑上的文件夹：点进去、上一级、「用这个文件夹」。 */
    function openFolderSheet(start, onPick) {
      openSheet("选择文件夹", (body) => {
        const crumb = el("div", "crumb", "读取中…");
        const list = el("div");
        const pick = el("div", "pick");
        const use = el("button", "primary-btn", "用这个文件夹");
        const hint = el("small");
        pick.append(use, hint);
        body.append(crumb, list, pick);
        let current = null;
        async function go(path) {
          use.disabled = true;
          try {
            const data = await api("GET", `/fs/dirs${path ? `?path=${encodeURIComponent(path)}` : ""}`);
            current = data.path;
            const home = data.home;
            crumb.textContent = current.startsWith(home) ? `~${current.slice(home.length)}` || "~" : current;
            const rows = [];
            if (data.parent) {
              const up = el("button", "opt");
              up.append(el("span", "label", "‹ 上一级"));
              up.onclick = () => go(data.parent);
              rows.push(up);
            }
            if (current !== home) {
              const homeButton = el("button", "opt");
              homeButton.append(el("span", "label", "⌂ 主目录"));
              homeButton.onclick = () => go(home);
              rows.push(homeButton);
            }
            for (const entry of data.entries) {
              const row = el("button", "opt");
              const icon = el("span");
              icon.className = "folder";

              row.append(icon, el("span", "label", entry.name));

              row.onclick = () => go(entry.path);
              rows.push(row);

            list.replaceChildren(...rows);
            body.scrollTop = 0;
            hint.textContent = data.git ? "这是一个 git 仓库" : current;
            use.disabled = false;
          } catch (error) {
            toast(error.message);
            if (!current) crumb.textContent = error.message;
          }
        }
        use.onclick = () => { if (!current) return; closeSheet(); onPick(current); };
        go(start);
      });

    // ---------- 加加：聊天机器人，替用户照看会话 ----------
    // 推送连 /api/jiajia/stream：先给完整状态，之后推摘要 + 新增 / 改动的聊天记录（按 id 合并）。
    const jj = { summary: null, messages: [], hasMore: false, socket: null, failures: 0, poller: null, models: null, stick: false, maxSeen: 0, sending: false };
    const JJ_INTRO = "我是加加，帮你照看电脑上 Codex 的会话：问我哪些在跑、让我给某个会话带句话、在某个项目新开会话、盯着一个会话跑完告诉你，都行。会话要你审批时我也会把卡片贴过来。";

    function jjConnect() {
      if (jj.socket || jj.poller || !state.me) return;
      if (jj.failures >= 2) return jjPoll();
      const scheme = location.protocol === "https:" ? "wss" : "ws";
      const socket = new WebSocket(`${scheme}://${location.host}/api/jiajia/stream?token=${encodeURIComponent(token)}`);
      let opened = false;
      jj.socket = socket;
      socket.onopen = () => { opened = true; jj.failures = 0; };
      socket.onmessage = (event) => {
        const message = JSON.parse(event.data);
        if (message.type === "state") jjApplyState(message.state);
        else if (message.type === "update") jjApplyUpdate(message.summary, message.messages || []);
        else if (message.type === "revoked") unauthorized(message.reason);
      };
      socket.onclose = () => {
        if (jj.socket !== socket) return;
        jj.socket = null;
        if (!opened) jj.failures += 1;
        setTimeout(jjConnect, document.hidden ? 6000 : 1500);
      };
    }

    // 自签证书下有的手机浏览器不放行 wss：退回轮询。
    function jjPoll() {
      clearInterval(jj.poller);
      const tick = async () => { try { jjApplyState(await api("GET", "/jiajia")); } catch {} };
      tick();
      jj.poller = setInterval(() => !document.hidden && tick(), 3000);
    }

    function jjApplyState(data) {
      jj.summary = data.summary;
      jj.messages = data.messages || [];
      jj.hasMore = !!data.hasMore;
      jjAfterChange();
    }

    function jjApplyUpdate(summary, messages) {
      jj.summary = summary;
      for (const message of messages) {
        const index = jj.messages.findIndex((existing) => existing.id === message.id);
        if (index >= 0) jj.messages[index] = message;
        else jj.messages.push(message);
      }
      jj.messages.sort((a, b) => a.id - b.id);
      jjAfterChange();
    }

    function jjAfterChange() {
      // 页面在后台时，加加说了新话就提醒（标题、振动、系统通知）。
      const fresh = jj.messages.filter((message) => message.id > jj.maxSeen && (message.role === "bot" || message.role === "notice"));
      if (jj.maxSeen && fresh.length) alertUser(`加加：${fresh.at(-1).text || "有新消息"}`);
      jj.maxSeen = Math.max(jj.maxSeen, ...jj.messages.map((message) => message.id), 1);
      // 宽屏上列表一直在旁边：看得见就刷新置顶那一行。
      if (!$("mList").hidden) renderList();
      jjRender();
    }

    function jjThinkingText() {
      const summary = jj.summary;
      if (!summary?.thinking) return "";
      return summary.activity ? `${summary.activity}…` : "正在输入…";
    }

    /** 列表置顶的那一行。 */
    function jjRow() {
      const summary = jj.summary || {};
      const avatar = avatarNode([{ char: "加", key: "jiajia" }], { badge: summary.unread || 0 });
      jjFace(avatar.querySelector(".face"));
      const sub = [];
      const thinking = jjThinkingText();
      if (thinking) sub.push(el("span", "running", thinking));
      else sub.push(document.createTextNode(summary.last ? (summary.last.card ? `[审批] ${summary.last.text}` : summary.last.text) : "帮你照看会话，点进来聊聊"));
      const row = rowNode({
        avatar,
        title: "加加",
        sub,
        time: summary.last ? chatTime(summary.last.at / 1000) : "",
        active: wide() && ui.screen === "bot",
        onClick: openBot,
      });
      row.classList.add("jj-row");
      return row;
    }

    function openBot() {
      // 宽屏上从某个会话切过来：先把那个会话放下（不然它的推送还连着）。
      if (state.current) {
        clearPending();
        closeSocket();
        markSeen(state.current);
        state.current = null;
        state.view = null;
      }
      if (!wide() || (ui.screen !== "bot" && ui.screen !== "chat")) history.pushState({ m: "bot" }, "");
      jj.stick = true;
      show("bot");
      renderList();
      jjConnect();
      jjRender();
      jjAutosize();
      if (jj.summary && !jj.summary.settings?.configured && can("message")) jjSetupSheet();
    }

    /** 把加加的头像画到一个方块上：图片，或者文字 + 底色；都没设就是渐变底的「加」。 */
    function jjFace(node, avatar = jj.summary?.settings?.avatar || {}) {
      node.classList.add("jj");
      node.style.background = "";
      node.style.fontSize = "";
      node.textContent = "";
      node.classList.toggle("jj-img", !!avatar.image);
      if (avatar.image) {
        node.style.backgroundImage = `url("/api/jiajia/avatar?v=${avatar.version || 0}&token=${encodeURIComponent(token)}")`;
        return node;
      }
      const text = avatar.text || "加";
      node.textContent = text;
      // 两个以上的字缩小一点，不然方块里放不下。
      if ([...text].length > 1) node.style.fontSize = "0.8em";
      if (avatar.color) node.style.background = avatar.color;
      return node;
    }

    function jjMsg(content) {
      const node = msgNode("in", content);
      jjFace(node.querySelector(".who"));
      return node;
    }

    /** 加加提到的会话：卡片，点进去打开那个会话。 */
    function jjThreadCard(id) {
      const thread = state.threads.find((item) => item.id === id);
      const card = el("div", "m-card m-thread");
      const head = el("div", "m-card-head");
      head.append(el("span", "", thread ? threadTitle(thread) : `会话 ${id.slice(0, 8)}`), el("span", "state kind", thread && isRunning(thread) ? "运行中" : "会话"));
      const body = el("div", "m-card-body", thread ? `${baseName(thread.cwd)} · ${relative(thread.updatedAt)}` : "点开看看");
      card.append(head, body);
      card.onclick = () => openChat(id, "bot");
      return card;
    }

    /** 审批卡片：复用会话里的审批卡片，加上会话名；处理过的灰掉。 */
    function jjRequestCard(message) {
      const info = message.request || {};
      if (message.resolved) {
        const card = el("div", "m-card resolved");
        const head = el("div", "m-card-head");
        head.append(el("span", "", message.text || "审批"), el("span", "state", "已处理"));
        card.append(head);
        card.onclick = () => info.threadId && openChat(info.threadId, "bot");
        return card;
      }
      const card = requestCard(info.request || {}, info.threadId, () => { message.resolved = true; jjRender(); });
      if (!card.dataset.jj) {
        card.dataset.jj = "1";
        const link = el("div", "jj-thread", `「${info.title || "会话"}」 ›`);
        link.onclick = (event) => { event.stopPropagation(); openChat(info.threadId, "bot"); };
        card.prepend(link);
      }
      return card;
    }

    function jjMessageNodes(message) {
      const cards = (message.threads || []).filter((id) => !message.request || id !== message.request.threadId).map(jjThreadCard);
      switch (message.role) {
        case "user": return [msgNode("out", textBubble(message.text))];
        case "event": return [el("div", "m-tip", `会话动静：${message.text}`)];
        case "notice": {
          const stack = el("div", "m-bot-stack");
          stack.append(message.request ? jjRequestCard(message) : textBubble(message.text, "提醒"), ...cards);
          return [jjMsg(stack)];
        }
        default: {
          const stack = el("div", "m-bot-stack");
          if (message.text) stack.append(textBubble(message.text));
          stack.append(...cards);
          return [jjMsg(stack)];
        }
      }
    }

    function jjRender() {
      if ($("mBot").hidden) return;
      const summary = jj.summary;
      $("mBotState").textContent = jjThinkingText();
      setBackCount("mBotBackCount", state.threads.filter(unread).length);
      $("mBotMore").style.visibility = can("message") ? "" : "hidden";
      const log = $("mBotLog");
      const stick = nearBottom(log) || jj.stick;
      jj.stick = false;
      const nodes = [];
      if (!summary) {
        nodes.push(el("div", "m-empty", "连接中…"));
      } else {
        if (jj.hasMore) {
          const older = el("button", "m-more-older", "查看更早的消息");
          older.onclick = jjLoadOlder;
          nodes.push(older);
        }
        if (!jj.messages.length) {
          nodes.push(jjMsg(textBubble(JJ_INTRO)));
          if (!summary.settings?.configured && can("message")) {
            const start = el("button", "m-more-older", "选个模型，开始用加加 ›");
            start.onclick = jjSetupSheet;
            nodes.push(start);
          }
        }
        let lastShown = 0;
        for (const message of jj.messages) {
          if (message.at - lastShown > 5 * 60 * 1000) {
            nodes.push(el("div", "m-time-tip", chatTime(message.at / 1000, true)));
            lastShown = message.at;
          }
          nodes.push(...jjMessageNodes(message));
        }
        if (summary.thinking) nodes.push(jjMsg(typingBubble()));
      }
      log.replaceChildren(...nodes);
      if (stick) log.scrollTop = log.scrollHeight;
      jjRenderComposer();
      jjMarkRead();
    }

    function jjMarkRead() {
      const summary = jj.summary;
      const last = jj.messages.at(-1);
      if (!summary || !last || document.hidden || $("mBot").hidden || last.id <= (summary.readUpto || 0)) return;
      summary.readUpto = last.id;
      summary.unread = 0;
      api("POST", "/jiajia/read", { upto: last.id }).catch(() => {});
    }

    async function jjLoadOlder() {
      const first = jj.messages[0];
      if (!first) return;
      try {
        const data = await api("GET", `/jiajia/messages?before=${first.id}`);
        const older = data.messages || [];
        jj.hasMore = older.length >= 60;
        jj.messages = [...older.filter((message) => !jj.messages.some((existing) => existing.id === message.id)), ...jj.messages];
        const log = $("mBotLog");
        const fromBottom = log.scrollHeight - log.scrollTop;
        jjRender();
        log.scrollTop = log.scrollHeight - fromBottom;
      } catch (error) { toast(error.message); }
    }

    function jjAutosize() {
      const input = $("mBotInput");
      if (wide()) { input.style.height = ""; return; }
      input.style.height = "38px";
      input.style.height = `${Math.min(input.scrollHeight, 132)}px`;
    }

    function jjRenderComposer() {
      const allowed = can("message");
      $("mBotComposer").hidden = !allowed;
      $("mBotReadonly").hidden = allowed;
      const thinking = !!jj.summary?.thinking;
      const hasText = !!$("mBotInput").value.trim();
      const go = $("mBotGo");
      if (wide()) {
        const stop = thinking && !hasText;
        go.hidden = false;
        go.className = `go ${stop ? "stop" : "send"}${hasText ? " ready" : ""}`;
        go.textContent = stop ? "停止" : "发送";
        go.disabled = jj.sending || (!hasText && !stop);
      } else {
        go.hidden = !hasText && !thinking;
        go.className = `go ${hasText ? "send" : "stop"}`;
        go.innerHTML = hasText ? ICON.send : ICON.stop;
        go.disabled = jj.sending;
      }
      go.setAttribute("aria-label", hasText ? "发送" : "停止");
      $("mBotInput").placeholder = thinking ? "加加在回复，发消息会插进去…" : "和加加说…";
    }

    async function jjSend() {
      const text = $("mBotInput").value.trim();
      if (!text) {
        if (jj.summary?.thinking) api("POST", "/jiajia/interrupt").catch((error) => toast(error.message));
        return;
      }
      if (!jj.summary?.settings?.configured) return jjSetupSheet();
      if (jj.sending) return;
      jj.sending = true;
      jjRenderComposer();
      try {
        await api("POST", "/jiajia/messages", { text });
        $("mBotInput").value = "";
        jj.stick = true;
        jjAutosize();
      } catch (error) {
        toast(error.message);
      } finally {
        jj.sending = false;
        jjRenderComposer();
      }
    }

    async function jjSettings(change) {
      try {
        jj.summary = await api("POST", "/jiajia/settings", change);
        jjRender();
        renderList();
      } catch (error) { toast(error.message); }
    }

      const current = jj.summary?.settings?.avatar || {};

    function jjPickAvatar() {
      const input = document.createElement("input");
      input.type = "file";
      input.accept = "image/*";
      input.onchange = async () => {
        const file = input.files?.[0];
        if (!file) return;
        try {
          // 居中裁成正方形，缩到 256×256：上传快，也免得大图撑爆头像。
          const bitmap = await createImageBitmap(file);
          const side = Math.min(bitmap.width, bitmap.height);
          const canvas = document.createElement("canvas");
          canvas.width = canvas.height = 256;
          canvas.getContext("2d").drawImage(bitmap, (bitmap.width - side) / 2, (bitmap.height - side) / 2, side, side, 0, 0, 256, 256);
          const blob = await new Promise((resolve) => canvas.toBlob(resolve, "image/jpeg", 0.9));
          if (!blob) throw new Error("这张图片处理不了，换一张试试");
          const response = await fetch("/api/jiajia/avatar", { method: "POST", headers: { Authorization: `Bearer ${token}`, "Content-Type": "image/jpeg" }, body: blob });
          const payload = await response.json().catch(() => ({ ok: false, error: `HTTP ${response.status}` }));
          if (response.status === 401) unauthorized(payload.error);
          if (!payload.ok) throw new Error(payload.error || `HTTP ${response.status}`);
          jj.summary = payload.data;
          renderList();
          jjRender();
          toast("头像换好了");
        } catch (error) { toast(error.message); }
      };
      input.click();
    }

    // ---------- 设置 ----------
    function renderSettings() {
      const body = $("mSettingsBody");
      const me = state.me || {};
      const item = (label, value) => {
        const node = el("div", "m-item");
        node.append(el("span", "", label));
        if (value != null) node.append(el("span", "value", value));
        return node;
      };
      const groups = [];
      const device = el("div", "m-group");
      device.append(item("电脑", me.host || ""), item("这台设备", me.kind === "device" ? me.name : "本机浏览器"), item("权限", roleText(me.role)));
      groups.push(el("div", "m-group-title", "连接"), device);
      const display = el("div", "m-group");
      const styleRow = item("对话样式");
      const seg = el("div", "m-seg");
      for (const [id, label] of [["chat", "聊天"], ["codex", "Codex"], ...(can("full") ? [["mirror", "桌面镜像"]] : [])]) {
        const button = el("button", "", label);
        button.setAttribute("aria-pressed", String((document.documentElement.dataset.style || "chat") === id));
        button.onclick = () => setStyle(id);
        seg.append(button);
      }
      styleRow.append(seg);
      display.append(styleRow);
      groups.push(el("div", "m-group-title", "显示"), display);
      const alerts = el("div", "m-group");
      const permission = "Notification" in window ? Notification.permission : "unsupported";
      const notifyRow = el("button", "m-item");
      notifyRow.append(el("span", "", "系统通知"), el("span", "value", { granted: "已开启", denied: "已被浏览器拒绝", default: "点击开启", unsupported: "浏览器不支持" }[permission]));
      notifyRow.disabled = permission !== "default";
      notifyRow.onclick = () => $("notify").onclick();
      alerts.append(notifyRow);
      groups.push(el("div", "m-group-title", "提醒：页面开着时，需要审批、模型提问或一轮跑完会提醒"), alerts);
      if (me.kind === "device") {
        const leave = el("div", "m-group");
        const button = el("button", "m-item danger", "退出配对");
        button.onclick = () => $("forget").onclick();
        leave.append(button);
        groups.push(leave);
      }
      body.replaceChildren(...groups);
    }

    // ---------- 导航 ----------
    function show(screen) {
      ui.screen = screen;
      if (screen !== "chat" && screen !== "bot") ui.side = screen;
      const wideNow = wide();
      const side = wideNow ? ui.side || "list" : screen;
      $("mList").hidden = side !== "list";
      $("mProject").hidden = side !== "project";
      $("mSettings").hidden = side !== "settings";
      // 加加和会话对话占同一个位置（宽屏是右栏）。
      $("mBot").hidden = screen !== "bot";
      $("mChat").hidden = wideNow ? screen === "bot" : screen !== "chat";
      $("mTabs").hidden = wideNow ? false : screen !== "list" && screen !== "settings";
      $("m").classList.toggle("no-chat", !state.current);
      $("mTabChats").setAttribute("aria-selected", String(side !== "settings"));
      $("mTabSettings").setAttribute("aria-selected", String(side === "settings"));
    }
    function openProject(cwd) {
      ui.project = cwd;
      history.pushState({ m: "project" }, "");
      show("project");
      renderProject();
    }
    function openChat(id, from) {
      if (state.current && state.current !== id) clearPending();
      ui.from = from;
      ui.stick = true;
      ui.requestCards.clear();
      // 宽屏是并排的，切会话不压历史（不然浏览器后退要一个个退）。
      if (!wide() || ui.screen !== "chat") history.pushState({ m: "chat" }, "");
      state.current = id;
      show("chat");
      $("mChatTitle").textContent = threadTitle(state.threads.find((thread) => thread.id === id) || {});
      $("mChatState").textContent = "";
      $("mLog").replaceChildren(el("div", "m-empty", "加载中…"));
      markSeen(id);
      selectThread(id);
    }
    function clearPending() {
      for (const entry of ui.pending) if (entry.preview) URL.revokeObjectURL(entry.preview);
      ui.pending = [];
      renderAttach();
    }
    function leaveChat() {
      clearPending();
      closeSocket();
      markSeen(state.current);
      state.current = null;
      state.view = null;
      // 从加加的会话卡片点进来的，返回加加。
      if (ui.from === "bot") {
        ui.from = "list";
        show("bot");
        jj.stick = true;
        jjRender();
      } else {
        show(ui.from === "project" && ui.project !== null ? "project" : "list");
      }
      renderList();
      renderProject();
      // 刚聊过的会话时间、摘要变了，回到列表时立刻刷新一次。
      loadThreads();
    }
    function goBack() {
      if (history.state?.m) history.back();
      else popped();
    }
    function popped() {
      closeSheet();
      if (ui.screen === "chat") leaveChat();
      else if (ui.screen === "bot") { show(ui.side === "project" && ui.project !== null ? "project" : "list"); renderList(); }
      else if (ui.screen === "project") { ui.project = null; show("list"); renderList(); }
    }
    window.addEventListener("popstate", popped);

    function setStyle(next) {
      if (next === "mirror" && !can("full")) return toast("桌面镜像需要「完全控制」权限");
      const previous = document.documentElement.dataset.style;
      if (next === "mirror" && previous !== "mirror") localStorage.setItem(MIRROR_BACK_KEY, previous || "codex");
      document.documentElement.dataset.style = next;
      localStorage.setItem(STYLE_KEY, next);
      if (next === "mirror") {
        closeSocket();
        mirror.start();
        return;
      }
      mirror.stop();
      renderThreads();
      if (state.view) applyView(state.view);
      if (next === "chat") {
        ui.stick = true;
        show(state.current ? "chat" : "list");
        renderSettings();
      } else if (state.current) {
        $("app").classList.add("viewing");
      }
    }

    // ---------- 事件 ----------
    $("mTabChats").onclick = () => { show("list"); renderList(); };
    $("mTabSettings").onclick = () => { show("settings"); renderSettings(); };
    $("mTabMirror").onclick = () => setStyle("mirror");
    $("mTabStyle").onclick = () => setStyle("codex");
    wideQuery?.addEventListener?.("change", () => { show(ui.screen); autosize(); renderComposer(); renderChat(); jjAutosize(); jjRender(); });
    $("mFilter").onclick = openFilterSheet;
    $("mHost").onclick = openHostSheet;
    $("mNew").onclick = () => openNewSheet(null);
    $("mProjectNew").onclick = () => openNewSheet(ui.project);
    $("mProjectBack").onclick = goBack;
    $("mChatBack").onclick = goBack;
    $("mChatMore").onclick = openMoreSheet;
    $("mBotBack").onclick = goBack;
    $("mBotMore").onclick = jjMoreSheet;
    $("mBotGo").onclick = jjSend;
    $("mBotInput").addEventListener("input", () => { jjAutosize(); jjRenderComposer(); });
    $("mBotInput").addEventListener("keydown", (event) => {
      if (!coarse && event.key === "Enter" && !event.shiftKey && !event.isComposing) {
        event.preventDefault();
        jjSend();
      }
    });
    // 切回前台：手机切后台时推送会断，回来立刻重连、标已读。
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) return;
      jjConnect();
      jjMarkRead();
    });
    $("mPlus").onclick = openAttachSheet;
    $("mGo").onclick = send;
    $("mSearch").oninput = () => { ui.query = $("mSearch").value; renderList(); };
    $("mInput").addEventListener("input", () => { autosize(); renderComposer(); });
    // 粘贴截图 / 文件、把文件拖进输入区：直接当附件（和 Codex 样式一样）。
    $("mInput").addEventListener("paste", (event) => {
      const files = [...(event.clipboardData?.files || [])];
      if (!files.length || !can("message")) return;
      event.preventDefault();
      for (const file of files) addPending(file);
    });
    $("mComposer").addEventListener("dragover", (event) => { event.preventDefault(); $("mComposer").classList.add("drag"); });
    $("mComposer").addEventListener("dragleave", () => $("mComposer").classList.remove("drag"));
    $("mComposer").addEventListener("drop", (event) => {
      event.preventDefault();
      $("mComposer").classList.remove("drag");
      if (can("message")) for (const file of event.dataTransfer?.files || []) addPending(file);
    });
    $("mInput").addEventListener("keydown", (event) => {
      // 手机上回车换行，点按钮发送；电脑上回车发送、Shift+回车换行。
      if (!coarse && event.key === "Enter" && !event.shiftKey && !event.isComposing) {
        event.preventDefault();
        send();
      }
    });
    // 列表页开着时定期刷新：别处（桌面、别的设备）开的会话、跑完的会话能及时出现。
    setInterval(() => {
      if (isChat() && state.me && !document.hidden && (ui.screen === "list" || ui.screen === "project")) loadThreads();
    }, 8000);
    show("list");

    return {
      onThreads() {
        initSeen(state.threads);
        renderList();
        renderProject();
        // 加加的会话卡片要用会话标题、运行状态。
        jjRender();
      },
      onThreadsError(message) { $("mRows").replaceChildren(el("div", "m-empty", `读取会话失败：${message}`)); },
      onView() { renderChat(); },
      onRole() {
        $("mHostName").textContent = state.me?.host || "远程控制";
        $("mMe").textContent = firstChar(state.me?.host || "C");
        $("mMe").title = state.me?.host || "";
        $("mTabMirror").hidden = !can("full");
        $("mHostDot").classList.toggle("off", !state.me);
        $("mNew").style.visibility = can("message") ? "" : "hidden";
        renderSettings();
        renderComposer();
      },
      onOffline(message) {
        $("mHostDot").classList.add("off");
        $("mRows").replaceChildren(el("div", "m-empty", `连接失败：${message}`));
      },
      setStyle,
      // 加加：页面一认证就连推送（列表上的未读、提醒要用）。
      startJiajia: jjConnect,
      openBot,
      // 下面这些 Codex 样式也在用：未读、附件、文件夹浏览。
      unread,
      markSeen,
      attachmentNode,
      pickFiles,
      addPending,
      pending: () => ui.pending,
      clearPending,
      openFolderSheet,
    };
  })();

  // 样式切换：按设备记在 localStorage；聊天样式下模型 / 权限收进「⋯」。
  $("mirrorOpen").onclick = () => m.setStyle("mirror");
  // 加加只在聊天样式里：切过去直接打开。
  $("jiajiaOpen").onclick = () => { m.setStyle("chat"); m.openBot(); };
  $("style").onclick = () => m.setStyle(document.documentElement.dataset.style === "chat" ? "codex" : "chat");

  $("pairButton").onclick = pair;
  $("pairName").addEventListener("keydown", (event) => { if (event.key === "Enter") pair(); });
  $("pairCode").addEventListener("keydown", (event) => { if (event.key === "Enter") $("pairName").focus(); });
  $("forget").onclick = () => {
    if (!confirm("退出后这台设备要重新扫码配对。确定吗？")) return;
    localStorage.removeItem(DEVICE_KEY);
    location.reload();
  };
  $("notify").onclick = async () => {
    const result = await Notification.requestPermission().catch(() => "denied");
    toast(result === "granted" ? "已开启：页面在后台时，需要审批或跑完会提醒" : "浏览器没有允许通知，仍会用标题和振动提醒");
    applyRole();
  };

  async function boot() {
    try {
      state.me = await api("GET", "/me");
    } catch (error) {
      if ($("gate").hidden) $("threads").replaceChildren(el("div", "empty", `连接失败：${error.message}`));
      m.onOffline(error.message);
      return;
    }
    applyRole();
    loadThreads();
    m.startJiajia();
    // 上次停在桌面镜像：有权限就接着连，否则退回自绘界面。
    if (document.documentElement.dataset.style === "mirror") {
      if (can("full")) mirror.start();
      else m.setStyle(narrow ? "chat" : "codex");
    }
  }

  if (pairCode && !token) {
    showGate("配对这台设备", "确认设备名称后点「配对」。配对后这台设备可以长期访问，可随时在 Codex++ 里移除。", { pairing: true, code: pairCode });
  } else if (!token) {
    if (location.protocol === "https:") showGate("配对这台设备", "在 Codex++「远程控制」里点「添加设备」，扫码或输入配对码。", { pairing: true });
    else showGate("缺少令牌", "请从 Codex++「远程控制」页面打开本页。");
  } else {
    boot();
  }
})();
</script>
</body>
</html>

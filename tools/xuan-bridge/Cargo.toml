[package]
name = "xuan-bridge"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[workspace]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[[bin]]
name = "xuan-bridge"
path = "src/main.rs"

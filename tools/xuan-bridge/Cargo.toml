[package]
name = "xuan-bridge"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[workspace]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "rustls-tls-native-roots"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "xuan-bridge"
path = "src/main.rs"

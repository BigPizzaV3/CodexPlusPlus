[package]
name = "codex-plus-manager"
default-run = "codex-plus-plus"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "codex_plus_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "codex-plus-plus"
path = "src/main.rs"

[[bin]]
name = "codex-plus-legacy-shim"
path = "src/legacy_shim.rs"

[dependencies]
anyhow.workspace = true
async-trait = "0.1"
base64.workspace = true
codex-plus-core = { path = "../../../crates/codex-plus-core" }
codex-plus-data = { path = "../../../crates/codex-plus-data" }
codex-plus-launcher = { path = "../../codex-plus-launcher" }
directories.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = ["custom-protocol", "tray-icon"] }
tauri-plugin-dialog = "2"
tokio.workspace = true
toml_edit.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
# 测试程序在 main 之前进家目录沙箱（codex_plus_core::test_sandbox），不碰用户的真实目录。
ctor = "0.8"
tempfile.workspace = true

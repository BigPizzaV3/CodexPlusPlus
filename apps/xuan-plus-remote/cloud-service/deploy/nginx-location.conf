# Include these locations in the existing HTTPS server block for www.meishijiankang.com.
# TLS remains terminated by the existing Nginx configuration.

location = /workagents-remote/api/healthz {
    proxy_pass http://127.0.0.1:8787/healthz;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 3s;
    proxy_send_timeout 10s;
    proxy_read_timeout 10s;
    add_header Cache-Control "no-store" always;
}

# Device bootstrap remains deliberately slow because these endpoints create or consume
# registration state before the normal signed polling/command workload begins.
location = /workagents-remote/api/v1/app-devices/challenges {
    client_max_body_size 16k;
    limit_req zone=workagents_remote_bootstrap burst=6 nodelay;
    limit_req_status 429;
    limit_conn workagents_remote_connection 4;
    proxy_pass http://127.0.0.1:8787/v1/app-devices/challenges;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 3s;
    proxy_send_timeout 10s;
    proxy_read_timeout 10s;
    add_header Cache-Control "no-store" always;
}

location = /workagents-remote/api/v1/app-devices {
    client_max_body_size 16k;
    limit_req zone=workagents_remote_bootstrap burst=6 nodelay;
    limit_req_status 429;
    limit_conn workagents_remote_connection 4;
    proxy_pass http://127.0.0.1:8787/v1/app-devices;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 3s;
    proxy_send_timeout 10s;
    proxy_read_timeout 10s;
    add_header Cache-Control "no-store" always;

# Active task and command routes are still bounded per source IP, but must admit the
# documented five-device maximum, 5-second task polling, and temporary command polling.
location /workagents-remote/api/v1/ {
    client_max_body_size 16k;
    limit_req zone=workagents_remote_active burst=60 nodelay;
    limit_req_status 429;
    limit_conn workagents_remote_connection 4;
    proxy_pass http://127.0.0.1:8787/v1/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 3s;
    proxy_send_timeout 10s;
    proxy_read_timeout 10s;
    add_header Cache-Control "no-store" always;
}

location /workagents-remote/gateway/ {
    client_max_body_size 16k;
    limit_conn workagents_remote_connection 8;
    proxy_pass http://127.0.0.1:8787/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_connect_timeout 5s;
    proxy_send_timeout 75s;
    proxy_read_timeout 75s;
    proxy_buffering off;
    add_header Cache-Control "no-store" always;
}

# 手机仅在前台任务详情页建立该 WSS；正文不缓存到磁盘或代理缓冲区。
location /workagents-remote/stream/ {
    client_max_body_size 4k;
    limit_conn workagents_remote_connection 8;
    proxy_pass http://127.0.0.1:8787/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_connect_timeout 5s;
    proxy_send_timeout 45s;
    proxy_read_timeout 45s;
    proxy_buffering off;
    add_header Cache-Control "no-store" always;
}


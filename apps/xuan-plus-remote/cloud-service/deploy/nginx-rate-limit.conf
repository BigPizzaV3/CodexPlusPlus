# Include this file from the Nginx http context, for example through conf.d/*.conf.
# Bootstrap endpoints create or consume registration state and remain deliberately slow.
limit_req_zone $binary_remote_addr zone=workagents_remote_bootstrap:10m rate=12r/m;

# Active routes require a valid device or PC signature in the Rust service. This capacity
# admits five devices, 5-second task polling, and temporary command-result polling.
limit_req_zone $binary_remote_addr zone=workagents_remote_active:10m rate=600r/m;

limit_conn_zone $binary_remote_addr zone=workagents_remote_connection:10m;

